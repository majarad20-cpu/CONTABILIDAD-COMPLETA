/* ------------------------------------------------------------------ UTM */
const UTM_OFICIALES = {
  "2026-01": 69751, "2026-02": 69611, "2026-03": 69889, "2026-04": 69889, "2026-05": 70588,
  "2026-06": 71506, "2026-07": 71649, "2026-08": 71649, "2026-09": 71721, "2026-10": 72151,
};
/* Valor de la UTM del mes: el ingresado en el programa o, si no hay, el oficial cargado. */
function utm(periodo) { return S.utm[periodo] || UTM_OFICIALES[periodo] || null; }

/* ------------------------------------------------------------------ borrador del F29 */
const FACTURAS = new Set([29, 30, 33, 43, 45, 46]);
const BOLETAS = new Set([35, 39]);
const COMPROBANTES_PAGO = new Set([48]);
const NOTAS_DEBITO = new Set([55, 56, 111]);
const IMPORTACIONES = new Set([914]);

/* Aproximación desde 5 de a/b con enteros exactos (a, b ≥ 0). */
function divisionHaciaArriba(a, b) {
  const A = BigInt(a), B = BigInt(b), q = A / B, r = A - q * B;
  return Number(2n * r >= B ? q + 1n : q);
}
/* Remanente expresado en UTM con dos decimales, aproximando desde 5, como el SII (ver programa de escritorio). */
function reajustarRemanente(remanente, utmAnterior) {
  return divisionHaciaArriba(Math.round(remanente) * 10000, Math.round(utmAnterior * 100)) / 100;
}
/* UTM a pesos enteros, aproximando desde 5. */
function pesosDesdeUtm(cantidadUtm, valorUtm) {
  return divisionHaciaArriba(Math.round(cantidadUtm * 100) * Math.round(valorUtm * 100), 10000);
}

/* (debe, haber) de la cuenta en el mes. Con `excluirSoloIva` se omiten los asientos que solo usan esas cuentas. */
function movimientoMes(cuentaId, periodo, excluirSoloIva) {
  if (!cuentaId) return [0, 0];
  let d = 0, h = 0;
  const fin = ultimoDia(periodo);
  for (const a of S.lista) {
    if (a.fecha < `${periodo}-01` || a.fecha > fin) continue;
    if (excluirSoloIva && !a.lineas.some((l) => !excluirSoloIva.has(l.cuenta))) continue;
    for (const l of a.lineas) if (l.cuenta === cuentaId) { d += l.debe || 0; h += l.haber || 0; }
  }
  return [d, h];
}

/* Retenciones e impuesto único del mes según los módulos de remuneraciones (etapa 4). */
function totalesModulos(periodo) {
  const boletas = (S.honorarios || []).filter((b) => b.periodo === periodo);
  const liq = (S.sueldos || []).filter((l) => l.periodo === periodo);
  return { retencion_honorarios: boletas.reduce((s, b) => s + (b.retencion || 0), 0), boletas: boletas.length,
    impuesto_unico: liq.reduce((s, l) => s + (l.impuesto_unico || 0), 0), liquidaciones: liq.length };
}

function borradorF29(periodo) { return S.f29Borradores.find((b) => b.id === periodo) || null; }

function valoresInicialesF29(periodo) {
  const propio = borradorF29(periodo);
  if (propio) return { remanente_anterior: propio.entradas.remanente_anterior, utm_anterior: propio.entradas.utm_anterior, utm_actual: propio.entradas.utm_actual, tasa_ppm: propio.entradas.tasa_ppm ?? null, base_ppm: propio.entradas.base_ppm ?? null,
    origen_remanente: propio.entradas.origen_remanente || "borrador guardado" };
  const anterior = periodoAnterior(periodo);
  const previo = borradorF29(anterior);
  if (previo) return { remanente_anterior: previo.codigos["77"] || 0, utm_anterior: previo.entradas.utm_actual || utm(periodo), utm_actual: utm(periodoSiguiente(periodo)),
    origen_remanente: `código 77 del borrador de ${nombrePeriodo(anterior)}` };
  const cuenta = cuentasTributarias().remanente_iva;
  let remanente = 0;
  if (cuenta) { const m = libroMayor(cuenta, `${anterior}-01`, ultimoDia(anterior)); remanente = m ? Math.max(m.saldoFinal, 0) : 0; }
  const u = ultimoDia(anterior);
  return { remanente_anterior: remanente, utm_anterior: utm(periodo), utm_actual: utm(periodoSiguiente(periodo)),
    origen_remanente: `saldo contable de la cuenta de remanente al ${u.slice(8)}/${anterior.slice(5)}/${anterior.slice(0, 4)}` };
}

const LINEAS_F29 = [
  ["titulo", "DÉBITOS (VENTAS)"],
  ["503", "502", "Facturas emitidas"], ["110", "111", "Boletas"], ["758", "759", "Comprobantes de pago electrónico (vouchers)"],
  ["512", "513", "Notas de débito emitidas"], ["509", "510", "Notas de crédito emitidas (restan)"],
  ["total", "538", "TOTAL DÉBITOS"], [null, "142", "Ventas exentas o no gravadas del giro (informativo)"],
  ["titulo", "CRÉDITOS (COMPRAS)"],
  ["519", "520", "Facturas recibidas del giro"], ["524", "525", "Facturas de activo fijo"], ["531", "532", "Notas de débito recibidas"],
  ["527", "528", "Notas de crédito recibidas (restan)"], ["534", "535", "Declaraciones de ingreso (importaciones)"],
  [null, "504", "Remanente de crédito fiscal del mes anterior (reajustado)"], ["total", "537", "TOTAL CRÉDITOS"],
  ["titulo", "COMPRAS SIN DERECHO A CRÉDITO (INFORMATIVO)"],
  ["564", "521", "Compras internas afectas sin derecho a crédito (monto neto)"], ["584", "562", "Compras internas exentas o no gravadas"],
  ["titulo", "IMPUESTO AL VALOR AGREGADO"],
  [null, "89", "IVA determinado (débitos − créditos)"], [null, "77", "Remanente de crédito fiscal para el período siguiente"],
  ["titulo", "PAGOS PROVISIONALES MENSUALES"],
  [null, "563", "Base imponible (ingresos del giro)"], [null, "115", "Tasa PPM (%)"], [null, "62", "PPM neto determinado"],
  ["titulo", "RETENCIONES"],
  [null, "151", "Retención de impuesto de 2ª categoría (honorarios)"], [null, "48", "Impuesto único de 2ª categoría (trabajadores)"],
  ["total", "91", "TOTAL A PAGAR"],
];

function calcularF29(periodo, remanenteAnterior = 0, utmAnterior = null, utmActual = null, tasaPpm = null, basePpm = null) {
  const tasa = tasaPpm != null ? tasaPpm : +(empresa().tasa_ppm || 0);
  const docs = docsPeriodo(periodo);
  const ventas = docs.filter((d) => d.registro === "VENTA"), comprasTodas = docs.filter((d) => d.registro === "COMPRA"), mes = mesRcv(periodo);
  /* Con el IVA del mes tratado como gasto, las compras con IVA no entran al crédito fiscal. */
  const compras = comprasTodas.filter((d) => !ivaGastoDoc(d));
  const suma = (lista, tipos, cond = () => true) => {
    const el = lista.filter((d) => tipos.has(+d.tipo_doc) && cond(d));
    return [el.reduce((s, d) => s + (d.cantidad || 1), 0), el.reduce((s, d) => s + (d.iva || 0), 0)];
  };
  const c = {};
  [c["503"], c["502"]] = suma(ventas, FACTURAS);
  [c["110"], c["111"]] = suma(ventas, BOLETAS);
  [c["758"], c["759"]] = suma(ventas, COMPROBANTES_PAGO);
  [c["512"], c["513"]] = suma(ventas, NOTAS_DEBITO);
  [c["509"], c["510"]] = suma(ventas, NOTAS_CREDITO);
  c["538"] = c["502"] + c["111"] + c["759"] + c["513"] - c["510"];
  c["142"] = ventas.reduce((s, d) => s + signoDoc(d.tipo_doc) * (d.exento || 0), 0);
  const sinCredito = (d) => (d.iva_no_recuperable || 0) > 0 && !d.iva;
  [c["519"], c["520"]] = suma(compras, FACTURAS, (d) => !d.activo_fijo && !sinCredito(d));
  [c["524"], c["525"]] = suma(compras, FACTURAS, (d) => d.activo_fijo && !sinCredito(d));
  const afectasSin = comprasTodas.filter((d) => (d.iva_no_recuperable || 0) > 0 || ivaGastoDoc(d) > 0);
  c["564"] = afectasSin.reduce((s, d) => s + (d.cantidad || 1), 0);
  c["521"] = afectasSin.reduce((s, d) => s + signoDoc(d.tipo_doc) * d.neto, 0);
  const exentas = comprasTodas.filter((d) => (d.exento || 0) > 0);
  c["584"] = exentas.reduce((s, d) => s + (d.cantidad || 1), 0);
  c["562"] = exentas.reduce((s, d) => s + signoDoc(d.tipo_doc) * d.exento, 0);
  [c["531"], c["532"]] = suma(compras, NOTAS_DEBITO);
  [c["527"], c["528"]] = suma(compras, NOTAS_CREDITO);
  [c["534"], c["535"]] = suma(compras, IMPORTACIONES);
  const remanente = Math.trunc(+remanenteAnterior || 0);
  let reajuste = 0, remanenteUtm = null;
  if (remanente && utmAnterior && utmActual) { remanenteUtm = reajustarRemanente(remanente, utmAnterior); reajuste = pesosDesdeUtm(remanenteUtm, utmActual) - remanente; }
  c["504"] = remanente + reajuste;
  c["537"] = c["520"] + c["525"] + c["532"] + c["535"] - c["528"] + c["504"];
  c["89"] = Math.max(c["538"] - c["537"], 0);
  c["77"] = Math.max(c["537"] - c["538"], 0);
  c["563"] = ventas.reduce((s, d) => s + signoDoc(d.tipo_doc) * (d.neto + d.exento), 0);
  /* Contabilidad simplificada sin RCV: la base del PPM son los ingresos del mes del libro de caja (netos de IVA). */
  const baseCaja = esSimplificada() && !ventas.length ? Math.round(S.caja.filter((m) => m.tipo === 1 && m.fecha.slice(0, 7) === periodo).reduce((s, m) => s + m.base, 0)) : 0;
  if (baseCaja) c["563"] = baseCaja;
  const ct = cuentasTributarias();
  /* Completa sin ventas en el RCV: la base del PPM sale de las cuentas de ventas del mes; también se puede ingresar a mano. */
  let baseContable = 0;
  if (!ventas.length && !esSimplificada()) { const [d1, h1] = movimientoMes(ct.ventas_neto, periodo), [d2, h2] = movimientoMes(ct.ventas_exento, periodo); baseContable = Math.max(h1 - d1 + (h2 - d2), 0); if (baseContable) c["563"] = baseContable; }
  if (basePpm != null) c["563"] = Math.round(basePpm);
  c["115"] = tasa;
  c["62"] = Math.max(redondearPar(c["563"] * tasa / 100), 0);
  c["151"] = esSimplificada() ? totalesModulos(periodo).retencion_honorarios : movimientoMes(ct.retencion_honorarios, periodo)[1];
  c["48"] = esSimplificada() ? totalesModulos(periodo).impuesto_unico : movimientoMes(ct.impuesto_unico, periodo)[1];
  c["91"] = c["89"] + c["62"] + c["151"] + c["48"];

  const alertas = [];
  const pendientes = esSimplificada() ? [] : docs.filter(pendiente);
  if (pendientes.length) alertas.push(`Hay ${pendientes.length} documento(s) del RCV sin centralizar en ${nombrePeriodo(periodo)}.`);
  if (basePpm != null) alertas.push(`Base del PPM ingresada a mano: $${clp(Math.round(basePpm))}.`);
  else if (baseCaja) alertas.push(`Base del PPM tomada de los ingresos del libro de caja de ${nombrePeriodo(periodo)} ($${clp(baseCaja)}); el IVA y las demás líneas se llenan solo con el RCV.`);
  else if (baseContable) alertas.push(`Base del PPM tomada de las cuentas de ventas de la contabilidad de ${nombrePeriodo(periodo)} ($${clp(baseContable)}).`);
  if (!baseCaja) {
    const faltan = [];
    if (!ventas.length && !mes.sin_ventas) faltan.push("ventas"); if (!comprasTodas.length && !mes.sin_compras) faltan.push("compras");
    if (faltan.length) alertas.push(`No hay ${faltan.join(" ni ")} registradas en el RCV de ${nombrePeriodo(periodo)}. Si no hubo, márcalo en el RCV («Sin ${faltan.join(" / sin ")} este mes»).`);
  }
  if (ivaComoGasto(periodo) && comprasTodas.some((d) => d.iva)) alertas.push(`El IVA de las compras de ${nombrePeriodo(periodo)} se trata como gasto: no entra al crédito fiscal.`);
  const cuentasIva = new Set(["iva_debito", "iva_credito", "remanente_iva"].map((k) => ct[k]).filter(Boolean));
  const comparacion = [];
  if (ct.iva_debito) { const [d, h] = movimientoMes(ct.iva_debito, periodo, cuentasIva); comparacion.push(["IVA débito fiscal", c["538"], h - d]); }
  if (ct.iva_credito) { const [d, h] = movimientoMes(ct.iva_credito, periodo, cuentasIva); comparacion.push(["IVA crédito fiscal del mes", c["537"] - c["504"], d - h]); }
  const modulos = totalesModulos(periodo);
  if (modulos.boletas) comparacion.push(["Retención de honorarios (cód. 151)", modulos.retencion_honorarios, c["151"]]);
  if (modulos.liquidaciones) comparacion.push(["Impuesto único sueldo empresarial (cód. 48)", modulos.impuesto_unico, c["48"]]);
  if (esSimplificada()) comparacion.length = 0;
  for (const [concepto, rcv, cont] of comparacion)
    if (rcv !== cont) alertas.push(`${concepto}: el RCV indica $${clp(rcv)} y la contabilidad $${clp(cont)} (diferencia $${clp(rcv - cont)}).`);
  for (const k of ["iva_debito", "iva_credito"]) if (!ct[k] && !esSimplificada()) alertas.push(`Falta configurar la cuenta «${CONCEPTOS[k][0]}» para comparar con la contabilidad.`);
  if (!tasa) { const g = sugerenciaPpm(); alertas.push(`La tasa de PPM es 0 %. Ingrésala en el campo «Tasa PPM» de este borrador${g ? ` (vigente para tu régimen: ${textoTasa(g.tasa)} %; usa la que figura en tu F29)` : ""}.`); }
  if (remanente && !(utmAnterior && utmActual)) alertas.push("Ingresa la UTM del mes en que se presentó el F29 anterior y la del mes en que se presenta este F29, para reajustar el remanente.");
  return { periodo, codigos: c, alertas, comparacion, reajuste, remanenteUtm, documentos: docs.length, pendientes: pendientes.length,
    sinIva: sinIvaDe(c),
    entradas: { remanente_anterior: remanente, utm_anterior: utmAnterior, utm_actual: utmActual, tasa_ppm: tasa, base_ppm: basePpm } };
}
/* El borrador muestra solo las líneas con valor cuando el mes no tiene operaciones con IVA (o si así se elige). */
const sinIvaDe = (c) => !c["538"] && !c["142"] && !c["521"] && !c["562"] && c["537"] === c["504"];
const SIEMPRE_F29 = new Set(["115", "563", "62", "151", "48", "91"]);
function lineasF29Visibles(c, completo) {
  const out = []; let titulo = null;
  for (const l of LINEAS_F29) {
    if (l[0] === "titulo") { titulo = l; continue; }
    if (completo || SIEMPRE_F29.has(l[1]) || c[l[1]] || (l[0] && l[0] !== "total" && c[l[0]])) { if (titulo) { out.push(titulo); titulo = null; } out.push(l); }
  }
  return out;
}
const f29Completo = (f, p) => (p?.completo != null ? p.completo : !f.sinIva);

function parametrosF29() {
  if (!S.f29 || S.f29.eid !== S.eid) {
    const ej = String(empresa().ejercicio);
    const conDocs = S.rcv.map((d) => d.periodo).filter((p) => p.startsWith(ej)).sort();
    S.f29 = { eid: S.eid, periodo: S.rcvPeriodo && S.rcvPeriodoEid === S.eid ? S.rcvPeriodo : conDocs.at(-1) || periodoRcvInicial(), manual: null };
  }
  return S.f29;
}
const numeroF29 = (t, esUtm) => {
  const s = String(t ?? "").trim();
  if (!s) return null;
  const n = Number(s.replace(/\$/g, "").replace(/\./g, "").replace(",", "."));
  return Number.isFinite(n) ? (esUtm ? n : Math.round(n)) : NaN;
};

function resultadoF29() {
  const p = parametrosF29();
  const ini = valoresInicialesF29(p.periodo);
  const m = p.manual || {};
  const remanente = m.remanente_anterior ?? (ini.remanente_anterior || 0);
  const r = calcularF29(p.periodo, remanente, m.utm_anterior ?? ini.utm_anterior, m.utm_actual ?? ini.utm_actual, m.tasa_ppm !== undefined ? m.tasa_ppm : ini.tasa_ppm ?? null, m.base_ppm !== undefined ? m.base_ppm : ini.base_ppm ?? null);
  r.entradas.origen_remanente = remanente !== (ini.remanente_anterior || 0) ? "ingresado manualmente" : ini.origen_remanente;
  return r;
}

function leerEntradasF29() {
  const p = parametrosF29();
  const rem = numeroF29($("#f29-remanente").value), ua = numeroF29($("#f29-utm-anterior").value, true), uc = numeroF29($("#f29-utm-actual").value, true);
  for (const [v, id] of [[rem, "#f29-remanente"], [ua, "#f29-utm-anterior"], [uc, "#f29-utm-actual"]]) if (Number.isNaN(v)) { aviso(`Valor inválido: «${$(id).value}».`); return false; }

  if (Number.isNaN(tp) || (tp != null && (tp < 0 || tp > 100))) { aviso("La tasa de PPM debe ser un número entre 0 y 100, por ejemplo 1 o 0,25."); return false; }

async function guardarF29() {

    aviso(`Borrador del F29 de ${nombrePeriodo(p.periodo)} guardado en el historial. Su remanente (código 77) se usará como remanente anterior del mes siguiente.`);
  }, "No se pudo guardar el borrador");
}

/* Impuesto Único de Segunda Categoría, tabla mensual en UTM: [hasta (décimas de UTM), factor (milésimas), rebaja (centésimas de UTM)]. */
const TRAMOS_IMPUESTO_UNICO = [[135, 0, 0], [300, 40, 54], [500, 80, 174], [700, 135, 449], [900, 230, 1114], [1200, 304, 1780], [3100, 350, 2332], [null, 400, 3882]];

const TASAS_RETENCION = { 2020: 10.75, 2021: 11.5, 2022: 12.25, 2023: 13.0, 2024: 13.75, 2025: 14.5, 2026: 15.25, 2027: 16.0, 2028: 17.0 };
const TIPOS_BOLETA = { BHE: "Boleta de honorarios recibida", BTE: "Boleta de prestación de servicios de terceros emitida" };

/* Aproximación desde 5 de a/b con enteros exactos (b > 0; a puede ser negativo). */
function divisionRedondeada(a, b) {
  const A = BigInt(a), B = BigInt(b);
  if (A < 0n) return -divisionHaciaArriba(Number(-A), Number(B));
  return divisionHaciaArriba(Number(A), Number(B));
}

function impuestoUnico(base, valorUtm) {
  if (base <= 0) return 0;
  for (const [hasta, factor, rebaja] of TRAMOS_IMPUESTO_UNICO) {
    if (hasta === null || base * 10 <= hasta * valorUtm) {
      // base × factor − rebaja × UTM, en cien milésimas de peso
      return Math.max(divisionRedondeada(BigInt(base) * BigInt(factor) * 100n - BigInt(rebaja) * 1000n * BigInt(valorUtm), 100000), 0);
    }
  }
  return 0;
}
function calcularLiquidacion(bruto, afp, salud, valorUtm) {
  const base = bruto - afp - salud;
  if (base < 0) throw new ErrorRcv("Las cotizaciones no pueden superar el sueldo bruto.");
  const impuesto = impuestoUnico(base, valorUtm);
  return { bruto, afp, salud, base, utm: valorUtm, impuesto_unico: impuesto, liquido: base - impuesto };
}
function tasaRetencion(anio) {
  if (TASAS_RETENCION[anio] != null) return TASAS_RETENCION[anio];
  const anios = Object.keys(TASAS_RETENCION).map(Number);
  return anio > Math.max(...anios) ? TASAS_RETENCION[Math.max(...anios)] : TASAS_RETENCION[Math.min(...anios)];
}
/* [bruto, retención, líquido]. Con `esLiquido`, el monto es lo que se paga y el bruto es líquido / (1 − tasa). */
function calcularBoleta(monto, esLiquido, tasa) {
  const t = Math.round(tasa * 100); // centésimas de punto porcentual: 15,25 % → 1525 / 10000
  let bruto, retencion;
  if (esLiquido) { bruto = divisionRedondeada(BigInt(monto) * 10000n, 10000 - t); retencion = bruto - monto; }
  else { bruto = monto; retencion = divisionRedondeada(BigInt(monto) * BigInt(t), 10000); }
  return [bruto, retencion, bruto - retencion];
}
const mesMayus = (p) => `${MESES[+p.slice(5) - 1].toUpperCase()} ${p.slice(0, 4)}`;

function periodoRemuneraciones() {
  if (!S.remPeriodo || S.remPeriodoEid !== S.eid) {
    const ej = String(empresa().ejercicio);
    const usados = [...S.sueldos, ...S.honorarios].map((x) => x.periodo).filter((p) => p.startsWith(ej)).sort();
    S.remPeriodo = usados.at(-1) || periodoRcvInicial(); S.remPeriodoEid = S.eid;
  }
  return S.remPeriodo;
}
function contabilizado(x) { return !!x.asiento && S.lista.some((a) => a.id === x.asiento); }
async function guardarUtm(periodo, valor) {
  if (!Number.isInteger(valor) || valor < 1000 || valor > 1000000) throw new ErrorRcv("Ingresa el valor de la UTM en pesos, por ejemplo 72.151.");
  await S.almacen.set("config/utm", { valores: { ...S.utm, [periodo]: valor } });
  S.utm = { ...S.utm, [periodo]: valor };
}
function lineasNetas(netos) {
  const orden = (ids) => ids.sort((a, b) => porCodigo(S.porId.get(a), S.porId.get(b)));
  const deudoras = orden([...netos.keys()].filter((c) => netos.get(c) > 0)), acreedoras = orden([...netos.keys()].filter((c) => netos.get(c) < 0));
  return [...deudoras.map((c) => ({ cuenta: c, debe: netos.get(c), haber: 0 })), ...acreedoras.map((c) => ({ cuenta: c, debe: 0, haber: -netos.get(c) }))];
}
function cuentaConcepto(ct, k) { if (!ct[k]) throw new ErrorRcv(`Falta configurar la cuenta «${CONCEPTOS[k][0]}» en Tributario → Cuentas tributarias.`); return ct[k]; }

/* ------------------------------------------------------------------ sueldo empresarial */
const socioPorId = (id) => S.socios.find((s) => s.id === id);
function liquidacionesMes(periodo) {
  return S.sueldos.filter((l) => l.periodo === periodo).sort((a, b) => (socioPorId(a.socio)?.nombre || "").localeCompare(socioPorId(b.socio)?.nombre || ""));
}

function propuestaSueldos(periodo) {
  const pendientes = liquidacionesMes(periodo).filter((l) => !contabilizado(l));
  if (!pendientes.length) throw new ErrorRcv(`No hay liquidaciones de sueldo empresarial pendientes en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias(), netos = new Map(), sumar = (c, v) => netos.set(c, (netos.get(c) || 0) + v);
  for (const l of pendientes) {
    sumar(cuentaConcepto(ct, "sueldo_empresarial"), l.bruto);
    if (l.impuesto_unico) sumar(cuentaConcepto(ct, "impuesto_unico"), -l.impuesto_unico);
    if (l.afp) sumar(cuentaConcepto(ct, "afp_por_pagar"), -l.afp);
    if (l.salud) sumar(cuentaConcepto(ct, "salud_por_pagar"), -l.salud);
    sumar(cuentaConcepto(ct, "pago_sueldos"), -l.liquido);
  }
  return { ids: pendientes.map((l) => l.id), lineas: lineasNetas(netos), fecha: ultimoDia(periodo), glosa: `SUELDO EMPRESARIAL ${mesMayus(periodo)}`, cantidad: pendientes.length, periodo };
}

      : `<td><input type="checkbox" id="li-incluir-${esc(s.id)}" checked aria-label="Incluir a ${esc(s.nombre)}"></td><td>${esc(s.nombre)}</td>
         <td class="num">${entrada("bruto", l ? l.bruto : s.sueldo_bruto)}</td><td class="num">${entrada("afp", l?.afp)}</td><td class="num">${entrada("salud", l?.salud)}</td>`}
      <td class="num">${l ? clp(l.base) : ""}</td><td class="num">${l ? clp(l.impuesto_unico) : ""}</td><td class="num"><strong>${l ? clp(l.liquido) : ""}</strong></td>
      <td>${a ? `<button class="btn enlace" data-asiento="${esc(a.id)}">N° ${a.numero}</button>` : l ? '<span class="etiqueta cerrado">pendiente</span>' : '<span class="ayuda">sin calcular</span>'}</td>
      <td>${l && !cerrada && S.puedeEscribir ? `<button class="btn enlace" type="button" data-accion="eliminar-liquidacion" data-id="${esc(l.id)}">Eliminar</button>` : ""}</td></tr>`;
  }).join("");
  const hayPendientes = liquidacionesMes(periodo).some((l) => !contabilizado(l));

  <p class="ayuda">Remuneración que se asignan los socios que trabajan en la empresa. Se les retiene el Impuesto Único de Segunda Categoría según la tabla mensual y la UTM del mes. Si el socio cotiza (AFP y salud), esas cotizaciones se descuentan de la base del impuesto.</p>
  <div class="barra"><label>Mes<input type="month" id="rem-periodo" value="${periodo}"></label><button class="btn sec" type="button" data-ir="tributarias">Cuentas tributarias</button></div>
  <section class="caja"><h2>Socios</h2>
    ${socios.length ? `<div class="tabla"><table><thead><tr><th>Nombre</th><th>RUT</th><th class="num">Sueldo bruto habitual</th><th>Estado</th><th></th></tr></thead><tbody>${socios.map(filaSocio).join("")}</tbody></table></div>` : ""}
    ${puedeEditar(se && !se.id ? `<form class="barra" data-form="socio">
        <label>Nombre<input id="so-nombre" value="${esc(se.nombre)}"></label><label>RUT<input id="so-rut" value="${esc(se.rut)}"></label>
        <label>Sueldo bruto mensual<input id="so-sueldo" inputmode="numeric" value="${esc(se.sueldo_bruto ? clp(se.sueldo_bruto) : "")}"></label>
        <button class="btn" type="submit">Agregar socio</button><button class="btn sec" type="button" data-accion="cancelar-socio">Cancelar</button></form>`

    <span class="ayuda">Valor oficial del SII. Las de 2026 ya vienen cargadas; si falta un mes, ingrésalo aquí.</span></div>

    <tbody>${filasLiq}</tbody></table></div>
    ${puedeEditar(`<div class="acciones"><button class="btn" type="button" data-accion="liquidar">Calcular y guardar liquidaciones</button>

    : `<div class="caja vacio"><p>Agrega un socio para calcular su sueldo empresarial.</p></div>`}`;

async function guardarSocio() {
  const se = S.socioEdit;
  const nombre = $("#so-nombre").value.trim(), rut = $("#so-rut").value.trim(), sueldo = parseMonto($("#so-sueldo").value || "0");
  if (!nombre) return aviso("Ingresa el nombre del socio.");
  if (!rutValido(rut)) return aviso("El RUT del socio no es válido (revisa el dígito verificador).");
  if (Number.isNaN(sueldo) || sueldo < 0) return aviso("Sueldo bruto: ingresa un monto en pesos enteros, sin decimales.");
  const r = formatoRut(rut);
  if (S.socios.some((s) => s.rut === r && s.id !== se.id)) return aviso(`Ya existe un socio con el RUT ${r}.`);
  const activo = se.id ? $("#so-activo").checked : true;
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/socios/${se.id || "s" + nuevoId()}`, { nombre, rut: r, sueldo_bruto: sueldo, activo });
    S.socioEdit = null; render(); aviso("Socio guardado.");
  }, "No se pudo guardar el socio");
}

async function eliminarSocio(id) {
  if (S.sueldos.some((l) => l.socio === id)) { S.confirmar = null; render(); return aviso("El socio tiene liquidaciones registradas; desactívalo en lugar de eliminarlo."); }
  await ocupado(async () => { await S.almacen.del(`empresas/${S.eid}/socios/${id}`); S.confirmar = null; render(); aviso("Socio eliminado."); }, "No se pudo eliminar el socio");
}

async function liquidar() {
  const periodo = periodoRemuneraciones();
  const textoUtm = $("#rem-utm").value.trim();
  const elegidos = S.socios.filter((s) => $(`#li-incluir-${s.id}`)?.checked);
  const leer = (campo, s) => { const t = $(`#li-${campo}-${s.id}`)?.value.trim() || ""; return t ? parseMonto(t) : 0; };
  await ocupado(async () => {
    try {
      if (textoUtm) { const v = parseMonto(textoUtm); if (v !== utm(periodo)) await guardarUtm(periodo, v); }
      if (!elegidos.length) throw new ErrorRcv("Marca al menos un socio para calcular su liquidación.");
      const valorUtm = utm(periodo);
      if (!valorUtm) throw new ErrorRcv(`Falta el valor de la UTM de ${nombrePeriodo(periodo)}.`);
      const calculadas = [];
      for (const s of elegidos) {
        const bruto = leer("bruto", s), afp = leer("afp", s), salud = leer("salud", s);
        for (const [n, v] of [["Sueldo bruto", bruto], ["AFP", afp], ["Salud", salud]]) if (Number.isNaN(v) || v < 0) throw new ErrorRcv(`${n}: ingresa un monto en pesos enteros, sin decimales.`);
        if (bruto <= 0) throw new ErrorRcv(`${s.nombre}: el sueldo bruto debe ser mayor que cero.`);
        const actual = S.sueldos.find((l) => l.socio === s.id && l.periodo === periodo);
        if (actual && contabilizado(actual)) throw new ErrorRcv(`La liquidación de ${s.nombre} de ${nombrePeriodo(periodo)} ya está contabilizada; elimina primero su asiento para modificarla.`);
        calculadas.push([`${s.id}_${periodo}`, { socio: s.id, periodo, ...calcularLiquidacion(bruto, afp, salud, valorUtm), asiento: "" }]);
      }
      for (const [id, d] of calculadas) await S.almacen.set(`empresas/${S.eid}/sueldos/${id}`, d);
      render(); aviso(`Liquidaciones de ${nombrePeriodo(periodo)} calculadas.`);
    } catch (e) { if (e instanceof ErrorRcv) aviso(e.message); else throw e; }
  }, "No se pudieron guardar las liquidaciones");
}

/* ------------------------------------------------------------------ honorarios */
function boletasMes(periodo) {
  return S.honorarios.filter((b) => b.periodo === periodo).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : String(a.folio).localeCompare(String(b.folio))));
}
function propuestaHonorarios(periodo) {
  const pendientes = boletasMes(periodo).filter((b) => !contabilizado(b));
  if (!pendientes.length) throw new ErrorRcv(`No hay boletas de honorarios pendientes en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias(), netos = new Map(), sumar = (c, v) => netos.set(c, (netos.get(c) || 0) + v);
  for (const b of pendientes) {
    sumar(cuentaConcepto(ct, "honorarios_gasto"), b.bruto);
    if (b.retencion) sumar(cuentaConcepto(ct, "retencion_honorarios"), -b.retencion);
    sumar(cuentaConcepto(ct, "honorarios_pago"), -b.liquido);
  }
  return { ids: pendientes.map((b) => b.id), lineas: lineasNetas(netos), fecha: ultimoDia(periodo), glosa: `HONORARIOS ${mesMayus(periodo)}`, cantidad: pendientes.length, periodo };
}

  <h2>Boletas de ${nombrePeriodo(periodo)}</h2>
  ${lista.length ? `<div class="tabla"><table><thead><tr><th>Tipo</th><th>Folio</th><th>Fecha</th><th>RUT</th><th>Prestador</th><th class="num">Bruto</th><th class="num">Retención</th><th class="num">Líquido</th><th>Estado</th><th></th></tr></thead>
    <tbody>${lista.map((b) => { const c = contabilizado(b), a = c ? S.lista.find((x) => x.id === b.asiento) : null; return `<tr>

      <td class="num">${clp(b.retencion)} <small class="ayuda">(${b.tasa ? pct(b.tasa) + " %" : "sin retención"})</small></td><td class="num">${clp(b.liquido)}</td>
      <td>${a ? `<button class="btn enlace" data-asiento="${esc(a.id)}">N° ${a.numero}</button>` : '<span class="etiqueta cerrado">pendiente</span>'}</td>

async function guardarBoleta() {
  const periodo = periodoRemuneraciones(), be = S.boletaEdit || {};
  const d = { tipo: $("#bo-tipo").value, folio: $("#bo-folio").value.trim(), fecha: $("#bo-fecha").value, rut: $("#bo-rut").value.trim(), nombre: $("#bo-nombre").value.trim(),
    monto: $("#bo-monto").value, base: $("#bo-base").value, sin_retencion: $("#bo-sin").checked, glosa: $("#bo-glosa").value.trim() };
  S.boletaEdit = { ...be, ...d };
  if (!TIPOS_BOLETA[d.tipo]) return aviso("Indica si es una boleta de honorarios recibida o una de prestación de servicios de terceros.");
  if (!d.folio) return aviso("El folio es obligatorio.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return aviso("Ingresa una fecha válida.");
  if (!rutValido(d.rut)) return aviso("El RUT del prestador no es válido (revisa el dígito verificador).");
  if (!d.nombre) return aviso("Ingresa el nombre del prestador.");
  const monto = parseMonto(d.monto || "0");
  if (Number.isNaN(monto) || monto < 0) return aviso("Monto: ingresa un monto en pesos enteros, sin decimales.");
  if (monto <= 0) return aviso("Ingresa el monto de la boleta.");
  const rut = formatoRut(d.rut);
  if (be.id) { const actual = S.honorarios.find((b) => b.id === be.id); if (actual && contabilizado(actual)) return aviso("La boleta ya está contabilizada; elimina primero su asiento para modificarla."); }
  if (S.honorarios.some((b) => b.tipo === d.tipo && b.rut === rut && String(b.folio) === d.folio && b.id !== be.id)) return aviso(`Ya existe la boleta folio ${d.folio} del RUT ${rut}.`);
  const tasa = d.sin_retencion ? 0 : tasaRetencion(+d.fecha.slice(0, 4));
  const [bruto, retencion, liquido] = calcularBoleta(monto, d.base === "liquido" && tasa > 0, tasa);
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/honorarios/${be.id || "h" + nuevoId()}`, { periodo, tipo: d.tipo, folio: d.folio, fecha: d.fecha, rut, nombre: d.nombre, bruto, tasa, retencion, liquido, glosa: d.glosa, asiento: "" });
    S.boletaEdit = null; render(); aviso("Boleta guardada.");
  }, "No se pudo guardar la boleta");
}

function contabilizarRemuneraciones(tipo) {
  const periodo = periodoRemuneraciones();
  try {
    if (tipo === "sueldos") { const p = propuestaSueldos(periodo); abrirPropuesta(p.fecha, p.glosa, p.lineas, `Sueldo empresarial de ${nombrePeriodo(periodo)}: ${p.cantidad} liquidación(es).`, { sueldoIds: p.ids }); }
    else { const p = propuestaHonorarios(periodo); abrirPropuesta(p.fecha, p.glosa, p.lineas, `Honorarios de ${nombrePeriodo(periodo)}: ${p.cantidad} boleta(s).`, { honorarioIds: p.ids }); }
  } catch (e) { if (e instanceof ErrorRcv) aviso(e.message); else throw e; }
}
async function marcarContabilizados(coleccion, ids, asientoId) {
  const lista = S[coleccion];
  for (const id of ids) { const x = lista.find((y) => y.id === id); if (x && !contabilizado(x)) await S.almacen.set(`empresas/${S.eid}/${coleccion}/${id}`, { ...x, asiento: asientoId }); }
}
async function liberarRemuneraciones(asientoId) {
  for (const [coleccion, lista] of [["sueldos", S.sueldos], ["honorarios", S.honorarios], ["liquidaciones", S.liquidaciones], ["finiquitos", S.finiquitos]])
    for (const x of lista.filter((y) => y.asiento === asientoId)) await S.almacen.set(`empresas/${S.eid}/${coleccion}/${x.id}`, { ...x, asiento: "" });
}

/* ------------------------------------------------------------------ exportación: modelo de informe */
/* Cada informe se describe una vez (columnas y filas con un estilo) y se convierte a PDF o Excel,
   con el mismo formato del programa de escritorio. Estilos de fila: "" normal, seccion, glosa,
   subtotal, total, nota, destacado. */
const nombrePrograma = () => (esSimplificada() ? "CONTABILIDAD SIMPLIFICADA" : "CONTABILIDAD COMPLETA");
const ARTICULO_100 = "Artículo 100 Código Tributario: Declaración jurada de que los datos corresponden a los registros contables de la empresa.";
const MESES_MAYUS = MESES.map((m) => m.toUpperCase());
const NEGRITA_FILA = new Set(["seccion", "glosa", "subtotal", "total", "destacado"]);
const NOMBRES_TIPO_INFORME = { ACTIVO: "Activo", PASIVO: "Pasivo", PATRIMONIO: "Patrimonio", INGRESO: "Ingreso (ganancia)", GASTO: "Gasto (pérdida)" };

const col = (titulo, ancho, tipo = "texto", negrita = false) => ({ titulo, ancho, tipo, negrita });
class Informe {
  constructor(titulo, subtitulo, columnas, nombre, opciones = {}) {
    Object.assign(this, { titulo, subtitulo, columnas, nombre, filas: [], grupos: [], horizontal: false, oficial: false, firmas: [], vacio: "", notas: [], recuadro: null }, opciones);
  }
  agregar(valores, opciones = {}) { this.filas.push({ valores, estilo: "", nivel: 0, abarca: null, derecha: false, bloque: false, ...opciones }); }
}
const periodoTexto = (desde, hasta) => `PERÍODO: ${fmtFecha(desde)} a ${fmtFecha(hasta)}`;
const pesosTexto = (v) => (v < 0 ? `-$${clp(-v)}` : `$${clp(v)}`);
const sinCeros = (v) => v || null;
const nombreSeguro = (t) => (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "empresa";
const cuentaDe = (id) => S.porId.get(id) || { codigo: "?", nombre: "(cuenta eliminada)", tipo: "ACTIVO" };

function informeDiario(desde, hasta) {
  const inf = new Informe("LIBRO DIARIO", periodoTexto(desde, hasta),
    [col("Fecha", 11, "fecha"), col("As. N°", 7), col("Código", 10), col("Cuenta / Glosa / Detalle", 46), col("Debe", 15, "monto"), col("Haber", 15, "monto")],
    `libro_diario_${desde}_${hasta}`, { oficial: true });
  let mes = null, td = 0, th = 0;
  for (const a of S.lista.filter((x) => x.fecha >= desde && x.fecha <= hasta)) {
    if (a.fecha.slice(0, 7) !== mes) { mes = a.fecha.slice(0, 7); inf.agregar([`--- ${MESES_MAYUS[+mes.slice(5) - 1]} ${mes.slice(0, 4)} ---`], { estilo: "seccion", abarca: 0 }); }
    const marca = a.apertura ? " (APERTURA)" : a.cierre ? " (CIERRE)" : "";
    inf.agregar([a.fecha, String(a.numero), `GLOSA: ${a.glosa.toUpperCase()}${marca}`], { estilo: "glosa", abarca: 2 });
    for (const l of a.lineas) {
      const c = cuentaDe(l.cuenta);
      inf.agregar([null, null, c.codigo, c.nombre + (l.glosa ? ` · ${l.glosa}` : ""), sinCeros(l.debe), sinCeros(l.haber)], { nivel: l.haber ? 2 : 0 });
      td += l.debe || 0; th += l.haber || 0;
    }
    inf.agregar([null, null, null, "TOTAL ASIENTO:", a.lineas.reduce((s, l) => s + (l.debe || 0), 0), a.lineas.reduce((s, l) => s + (l.haber || 0), 0)], { estilo: "subtotal", derecha: true });
  }
  inf.agregar([null, null, null, "TOTAL GENERAL LIBRO DIARIO:", td, th], { estilo: "total", derecha: true });
  return inf;
}

function seccionMayor(inf, m) {
  const c = m.cuenta;
  inf.agregar([`CUENTA: ${c.codigo} - ${c.nombre}`], { estilo: "seccion", abarca: 0 });
  if (m.saldoInicial) inf.agregar([null, null, "SALDO ANTERIOR", null, null, m.saldoInicial], { estilo: "nota" });
  for (const x of m.movimientos) {
    if (x.reinicio) inf.agregar([x.fecha, null, `Apertura: el saldo anterior (${pesosTexto(x.anterior)}) se reinicia`, null, null, 0], { estilo: "nota" });
    else inf.agregar([x.asiento.fecha, String(x.asiento.numero), (x.glosa || "").toUpperCase(), sinCeros(x.debe), sinCeros(x.haber), x.saldo]);
  }
  const neto = c.tipo === "ACTIVO" || c.tipo === "GASTO" ? m.saldoFinal : -m.saldoFinal;
  const naturaleza = neto > 0 ? "SALDO DEUDOR" : neto < 0 ? "SALDO ACREEDOR" : "CUENTA SALDADA";
  inf.agregar([null, null, "TOTALES Y SALDO CUENTA:", m.td, m.th, [m.saldoFinal, naturaleza]], { estilo: "subtotal", derecha: true });
}
function informeMayor(cuentaId, desde, hasta) {
  const base = (nombre) => new Informe("LIBRO MAYOR", periodoTexto(desde, hasta),
    [col("Fecha", 11, "fecha"), col("As. N°", 7), col("Glosa / Descripción", 44), col("Debe", 14, "monto"), col("Haber", 14, "monto"), col("Saldo", 15, "monto", true)],
    nombre, { oficial: true, vacio: "-" });
  if (cuentaId) {
    const m = libroMayor(cuentaId, desde, hasta);
    const inf = base(`mayor_${m.cuenta.codigo}_${desde}_${hasta}`);
    seccionMayor(inf, m);
    return inf;
  }
  const inf = base(`libro_mayor_${desde}_${hasta}`);
  const mayores = cuentasConMovimiento(hasta).map((c) => libroMayor(c.id, desde, hasta)).filter((m) => m.movimientos.length || m.saldoInicial);
  for (const m of mayores) seccionMayor(inf, m);
  const td = mayores.reduce((s, m) => s + m.td, 0), th = mayores.reduce((s, m) => s + m.th, 0);
  inf.agregar([null, null, "TOTAL GENERAL LIBRO MAYOR:", td, th, td === th ? "(CONCORDADO)" : "(NO CUADRA)"], { estilo: "total", derecha: true });
  return inf;
}

function informeOcho(desde, hasta) {
  const b = balanceOcho(desde, hasta);
  const titulos = ["DEBE", "HABER", "DEUDOR", "ACREEDOR", "ACTIVO", "PASIVO", "PÉRDIDA", "GANANCIA"];
  const inf = new Informe("BALANCE DE 8 COLUMNAS", periodoTexto(desde, hasta), [col("COD.", 8), col("CUENTA CONTABLE", 30, "texto", true), ...titulos.map((t) => col(t, 12.5, "monto"))],
    `balance_8_columnas_${desde}_${hasta}`, { grupos: [["", 2], ["1. SUMAS", 2], ["2. SALDOS", 2], ["3. INVENTARIO", 2], ["4. RESULTADOS", 2]], horizontal: true, oficial: true, vacio: "-" });
  for (const f of b.filas) inf.agregar([f.codigo, f.nombre.toUpperCase(), f.debitos, f.creditos, ...b.cols.slice(2).map((k) => sinCeros(f[k]))]);
  inf.agregar([null, "SUBTOTALES:", ...b.cols.map((k) => b.totales[k])], { estilo: "subtotal" });
  inf.agregar([null, b.resultado >= 0 ? "RESULTADO (UTILIDAD):" : "RESULTADO (PÉRDIDA):", ...b.cols.map((k) => sinCeros(b.ajuste[k]))], { estilo: "subtotal" });
  inf.agregar([null, "TOTALES GENERALES:", ...b.cols.map((k) => b.iguales[k])], { estilo: "total" });
  return inf;
}
const hojasArbol = (a) => a.filas.filter((f) => !f.grupo && f.monto);

function informeGeneral(hasta) {

  for (const [titulo, arbolX, total] of [["ACTIVOS", bg.activo, "TOTAL ACTIVOS"], ["PASIVOS", bg.pasivo, "TOTAL PASIVOS"]]) {

function informeComprobante(a) {

  inf.agregar([null, null, "TOTALES:", a.lineas.reduce((s, l) => s + (l.debe || 0), 0), a.lineas.reduce((s, l) => s + (l.haber || 0), 0)], { estilo: "total", derecha: true });

  for (const c of S.cuentas) inf.agregar([c.codigo, c.nombre, c.imputable ? NOMBRES_TIPO_INFORME[c.tipo] : "Grupo", c.activa === false ? "Inactiva" : ""],
    { estilo: !c.imputable && !c.codigo.includes(".") ? "subtotal" : "", nivel: nivel(c.codigo) });

function informeF29(f = resultadoF29(), guardado = null) {
  const c = f.codigos;
  const inf = new Informe("BORRADOR FORMULARIO 29", `PERÍODO TRIBUTARIO: ${nombrePeriodo(f.periodo).toUpperCase()}`,
    [col("Código", 9), col("Concepto", 52), col("Cód.", 7), col("Cantidad", 10, "numero"), col("Monto", 16, "monto")], `borrador_f29_${f.periodo}`);
  for (const l of lineasF29Visibles(c, parametrosF29().completo ?? !sinIvaDe(c))) {
    if (l[0] === "titulo") { inf.agregar([l[1]], { estilo: "seccion", abarca: 0 }); continue; }
    const [cc, cm, concepto] = l;
    if (cm === "115") inf.agregar([cm, concepto, null, null, `${String(c["115"]).replace(".", ",")} %`]);
    else if (cc === "total") inf.agregar([cm, concepto, null, null, c[cm]], { estilo: cm === "91" ? "destacado" : "total" });
    else inf.agregar([cm, concepto, cc, cc ? c[cc] : null, c[cm]]);
  }
  inf.recuadro = [["TOTAL A PAGAR (código 91)", c["91"]]];
  if (c["77"]) inf.recuadro.push(["Remanente de crédito fiscal para el período siguiente (código 77)", c["77"]]);
  inf.notas.push("Borrador referencial calculado a partir del Registro de Compras y Ventas y de la contabilidad. Verifica los valores con la propuesta del SII antes de declarar.");
  inf.notas.push(...f.alertas);
  if (guardado) {
    inf.notas.push(`Borrador guardado el ${guardado.guardado_en ? fechaHora(guardado.guardado_en) : "—"}.${guardado.declarado ? ` Declarado en el SII${guardado.fecha_declaracion ? ` el ${fmtFecha(guardado.fecha_declaracion)}` : ""}${guardado.folio_sii ? `, folio ${guardado.folio_sii}` : ""}.` : ""}`);
    if (guardado.observacion) inf.notas.push(`Observaciones: ${guardado.observacion}`);

function informeRcv(periodo) {
  const mes = nombrePeriodo(periodo).toUpperCase();
  const inf = new Informe("REGISTRO DE COMPRAS Y VENTAS", `PERÍODO TRIBUTARIO: ${mes}`,
    [col("Tipo / Código", 10), col("Folio", 10), col("Fecha", 9, "fecha"), col("RUT", 12), col("Razón social / Cuenta", 34), col("Exento", 11, "monto"), col("Neto", 12, "monto"),
      col("IVA", 11, "monto"), col("Otros imp.", 10, "monto"), col("Total", 12, "monto")], `rcv_${periodo}`, { horizontal: true });
  const asientos = [];
  for (const [registro, titulo] of [["COMPRA", "REGISTRO DE COMPRAS"], ["VENTA", "REGISTRO DE VENTAS"]]) {
    inf.agregar([`${titulo} — ${mes}`], { estilo: "seccion", abarca: 0 });
    const docs = docsPeriodo(periodo, registro);
    const t = { exento: 0, neto: 0, iva: 0, otros: 0, total: 0 };
    let cantidad = 0;
    for (const d of docs) {
      const s = signoDoc(d.tipo_doc), otros = (d.iva_no_recuperable || 0) + (d.otros_impuestos || 0);
      const v = { exento: s * d.exento, neto: s * d.neto, iva: s * d.iva, otros: s * otros, total: s * d.total };
      for (const k in t) t[k] += v[k];
      cantidad += d.cantidad || 1;
      const a = pendiente(d) ? null : S.lista.find((x) => x.id === d.asiento);
      if (a && !asientos.includes(a)) asientos.push(a);
      inf.agregar([String(d.tipo_doc) + (s < 0 ? " NC" : ""), esResumen(d) ? `Resumen (${d.cantidad} doc.)` : String(d.folio), d.fecha, d.rut, d.razon_social,
        sinCeros(v.exento), sinCeros(v.neto), sinCeros(v.iva), sinCeros(v.otros), v.total]);
    }
    if (!docs.length) inf.agregar([null, null, null, null, "Sin documentos en el período."], { estilo: "nota" });
    inf.agregar([null, null, null, null, `TOTAL ${titulo.split(" ").at(-1)} (${cantidad} documentos)`, t.exento, t.neto, t.iva, t.otros, t.total], { estilo: "subtotal", derecha: true });
  }
  inf.agregar(["ASIENTOS CONTABLES DEL MES"], { estilo: "seccion", abarca: 0, bloque: true });
  let primero = true;
  const asiento = (enc, fecha, glosa, lineas, estado) => {
    inf.agregar([null, null, fecha, null, `${enc} · ${glosa.toUpperCase()}${estado ? ` (${estado})` : ""}`], { estilo: "glosa", abarca: 4, bloque: !primero });
    primero = false;
    inf.agregar(["Código", null, null, null, "Cuenta", null, null, null, "Debe", "Haber"], { estilo: "subtotal" });
    for (const l of lineas) { const c = cuentaDe(l.cuenta); inf.agregar([c.codigo, null, null, null, c.nombre, null, null, null, sinCeros(l.debe), sinCeros(l.haber)], { nivel: l.haber ? 2 : 0 }); }
    inf.agregar([null, null, null, null, "TOTALES", null, null, null, lineas.reduce((s, l) => s + (l.debe || 0), 0), lineas.reduce((s, l) => s + (l.haber || 0), 0)], { estilo: "subtotal", derecha: true });
  };
  for (const a of asientos) asiento(String(a.numero), a.fecha, a.glosa, a.lineas, "");
  let propuestas = 0;
  for (const registro of ["COMPRA", "VENTA"]) {
    if (!docsPeriodo(periodo, registro).some(pendiente)) continue;
    try { const p = propuestaCentralizacion(periodo, registro); asiento("Propuesta", p.fecha, p.glosa, p.lineas, "NO REGISTRADA"); propuestas++; }
    catch (e) { inf.notas.push(`No se pudo proponer el asiento de ${registro.toLowerCase()}s pendientes: ${e.message}`); }
  }
  if (!asientos.length && !propuestas) inf.agregar([null, null, null, null, "No hay asientos de centralización para este período."], { estilo: "nota" });
  inf.notas.unshift("Las notas de crédito se muestran con signo negativo. «Otros imp.» incluye el IVA no recuperable y otros impuestos. Los resúmenes de boletas y comprobantes de pago llevan el RUT de la empresa emisora.");
  return inf;
}

const LIBRERIAS = {
  jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  autotable: "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js",
  exceljs: "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js",
  pdflib: "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js",
};
const scriptsCargados = {};
function cargarScript(clave) {
  if (!scriptsCargados[clave]) scriptsCargados[clave] = new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = LIBRERIAS[clave]; s.onload = ok; s.onerror = () => { delete scriptsCargados[clave]; mal(new Error("No se pudo cargar la librería de exportación. Revisa tu conexión a internet.")); };
    document.head.appendChild(s);
  });
  return scriptsCargados[clave];
}
/* PDF del libro de caja idéntico al modelo del contador: hoja apaisada, una por mes (más si no caben las filas), con folio, saldo inicial como línea 1,
   egresos en negativo, saldos y totales al pie y firmas del representante legal y del contador. Los informes de control se pueden agregar al final (sin folio). */
async function aPdfLibroCaja(spec, folioInicial) {
  await cargarScript("jspdf"); await cargarScript("autotable");
  const { jsPDF } = window.jspdf, e = empresa(), T = textoPdf;
  const doc = new jsPDF({ unit: "pt", format: "letter", orientation: "landscape", compress: true });

  ws.pageSetup = { paperSize: 1, orientation: inf.horizontal ? "landscape" : "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    printTitlesRow: `${primeraEncabezado}:${filaTitulos}`, margins: { left: 0.5, right: 0.5, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } };
  ws.headerFooter = { oddFooter: `&L&7${nombrePrograma()}&R&7PÁGINA &P DE &N` };
  return new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ------------------------------------------------------------------ exportación: pantalla */
/* Informe de la pantalla actual (cada vista lo deja en S.informe). */
async function guardarArchivo(nombre, blob) {
  if (!S.descargas) throw new Error("La descarga de archivos no está disponible en esta vista.");
  try { await S.descargas.save({ filename: nombre, data: blob }); return true; }
  catch (err) { if (err?.code === "declined") return false; throw err; }
}
function nombreArchivo(inf, ext) { return `${nombreSeguro(empresa().razon_social)}_${inf.nombre}.${ext}`; }

async function exportar(formato) {
  if (!S.informe) return;
  const inf = S.informe();
  if (formato === "pdf" && inf.oficial) { S.folioPendiente = true; render(); $("#folio-inicial")?.select(); return; }
  await ocupado(async () => {
    aviso(formato === "pdf" ? "Generando PDF…" : "Generando Excel…");
    const blob = formato === "pdf" ? (await aPdf(inf)).blob : await aExcel(inf);
    if (await guardarArchivo(nombreArchivo(inf, formato === "pdf" ? "pdf" : "xlsx"), blob)) aviso(formato === "pdf" ? "PDF descargado." : "Excel descargado.");
  }, formato === "pdf" ? "No se pudo generar el PDF" : "No se pudo generar el Excel");
}

async function generarPdfConFolio() {
  const folio = Number($("#folio-inicial").value);
  if (!Number.isInteger(folio) || folio < 1) return aviso("Ingresa un número entero mayor o igual a 1.");
  const inf = S.informe(), libro = inf.libroCajaPdf;
  const extras = libro ? { res: !!$("#fo-res")?.checked, flujo: !!$("#fo-flujo")?.checked, ppm: !!$("#fo-ppm")?.checked } : null;
  if (extras) S.pdfExtras = extras;
  await ocupado(async () => {
    aviso("Generando PDF…");
    let r;
    if (libro) {
      r = await aPdfLibroCaja(libro, folio);
      const blobs = [r.blob];
      for (const [k, f] of [["res", informeControlResultados], ["flujo", informeControlFlujo], ["ppm", informeControlPpm]]) if (extras[k]) blobs.push((await aPdf(f(libro.anio))).blob);
      if (blobs.length > 1) r.blob = await unirPdfs(blobs);
    } else r = await aPdf(inf, folio);
    const { blob, paginas } = r;
    if (!(await guardarArchivo(nombreArchivo(inf, "pdf"), blob))) { aviso("Descarga cancelada: los folios no se usaron."); return; }
    const ultimo = folio + paginas - 1;
    const nuevo = { ...empresa() };
    if (ultimo > (nuevo.ultimo_folio || 0)) nuevo.ultimo_folio = ultimo;
    if (r.folios) nuevo.folios_caja = { ...(nuevo.folios_caja || {}), ...r.folios };
    await BD.setEmpresa(S.eid, nuevo);
    S.folioPendiente = false; render();
    aviso(`${paginas === 1 ? `PDF generado con el folio ${folio}.` : `PDF generado con los folios ${folio} al ${ultimo}.`} Próximo folio sugerido: ${Math.max(empresa().ultimo_folio || 0, ultimo) + 1}.`);
  }, "No se pudo generar el PDF");
}

  let libro = null; try { libro = S.informe?.().libroCajaPdf || null; } catch (_) { libro = null; }

const aniosDe = (lista) => [...new Set(lista.map((x) => x.periodo.slice(0, 4)))].sort().reverse();
const mesCap = (p) => nombrePeriodo(p).replace(/^./, (x) => x.toUpperCase());

/* ---------- Registro de Compras y Ventas ---------- */
function vistaRcv() {

  return pestanas("rcv") + ((S.pestana.rcv || "mes") === "historial" ? vistaRcvHistorial() : vistaRcvMes());
}

/* Resumen de un período del RCV: cantidades y montos con signo (las notas de crédito restan). */
function resumenRcv(periodo) {
  const docs = docsPeriodo(periodo);
  const compras = totalesRcv(docs.filter((d) => d.registro === "COMPRA")), ventas = totalesRcv(docs.filter((d) => d.registro === "VENTA"));
  const asientos = [...new Set(docs.filter((d) => !pendiente(d)).map((d) => d.asiento))].map((id) => S.lista.find((a) => a.id === id)).filter(Boolean);
  return { periodo, compras, ventas, pendientes: compras.pendientes + ventas.pendientes, documentos: docs.length, asientos };
}

function vistaRcvHistorial() {
  const anio = S.historialAnio.rcv ?? "";
  const periodos = [...new Set(S.rcv.map((d) => d.periodo))].filter((p) => !anio || p.startsWith(anio)).sort().reverse();
  const filas = periodos.map(resumenRcv);

    ...filas.map((f) => [f.periodo, f.compras.cantidad, f.compras.neto, f.compras.exento, f.compras.iva, f.compras.total, f.ventas.cantidad, f.ventas.neto, f.ventas.exento, f.ventas.iva, f.ventas.total, f.pendientes, f.asientos.map((a) => a.numero).join(" ")])] };
  const estado = (f) => !f.documentos ? "" : f.pendientes ? `<span class="etiqueta cerrado">${f.pendientes} pendiente${f.pendientes === 1 ? "" : "s"}</span>` : '<span class="etiqueta">centralizado</span>';

function informeHistorialRcv(filas) {
  const inf = new Informe("HISTORIAL REGISTRO DE COMPRAS Y VENTAS", `${filas.length} PERÍODO${filas.length === 1 ? "" : "S"}`,
    [col("Período", 14), col("Doc.", 6, "numero"), col("Compras neto+exento", 13, "monto"), col("IVA crédito", 11, "monto"), col("Compras total", 13, "monto"),
      col("Doc.", 6, "numero"), col("Ventas neto+exento", 13, "monto"), col("IVA débito", 11, "monto"), col("Ventas total", 13, "monto"), col("Estado", 11)],
    "historial_rcv", { horizontal: true, grupos: [["", 1], ["COMPRAS", 4], ["VENTAS", 4], ["", 1]] });
  for (const f of filas) inf.agregar([mesCap(f.periodo), f.compras.cantidad, f.compras.neto + f.compras.exento, f.compras.iva, f.compras.total,
    f.ventas.cantidad, f.ventas.neto + f.ventas.exento, f.ventas.iva, f.ventas.total, f.pendientes ? `${f.pendientes} pendientes` : "Centralizado"]);
  const suma = (reg, k) => filas.reduce((s, f) => s + f[reg][k], 0);
  inf.agregar(["TOTAL", suma("compras", "cantidad"), suma("compras", "neto") + suma("compras", "exento"), suma("compras", "iva"), suma("compras", "total"),
    suma("ventas", "cantidad"), suma("ventas", "neto") + suma("ventas", "exento"), suma("ventas", "iva"), suma("ventas", "total"), null], { estilo: "total" });
  inf.notas.push("Las notas de crédito restan.");
  return inf;
}

async function guardarEstadoF29() {

function pestanasDe(modulo, items) {

}

/* Número con decimales escrito a la chilena («1,62», «41.057,20») o con punto («1.62»). */
function decimal(texto) {
  const s = String(texto ?? "").trim().replace(/\s/g, "");
  if (!s) return null;
  const n = Number(s.includes(",") ? s.replace(/\./g, "").replace(",", ".") : s);
  return Number.isFinite(n) ? n : NaN;
}
const comaDecimal = (n) => String(n ?? "").replace(".", ",");
const mesesEntre = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
const sumaDe = (lista, k) => lista.reduce((s, x) => s + (x[k] || 0), 0);
const aniosDesde = (...fechas) => [...new Set(fechas.flat().filter(Boolean).map((f) => String(f).slice(0, 4)))].sort().reverse();
function opcionesAnio(anios, actual) { return anios.map((y) => `<option ${y === String(actual) ? "selected" : ""}>${y}</option>`).join(""); }

const CATEGORIAS_ACTIVO = [

  ["Vehículos (automóviles, camionetas, camiones)", 7], ["Muebles y enseres", 7], ["Equipos computacionales", 6], ["Otro (indica la vida útil)", 0],
];

const nombreVida = (m) => (m % 12 === 0 ? `${m / 12} año${m === 12 ? "" : "s"}` : `${m} meses`);

/* Depreciación lineal por meses, desde el mes de adquisición. La acumulada se calcula directamente, así el último mes absorbe el redondeo. */
function depAcum(a, periodo, vida = a.vida_meses) {
  let fin = periodo;
  if (a.estado === "baja" && a.fecha_baja && a.fecha_baja.slice(0, 7) < fin) fin = a.fecha_baja.slice(0, 7);
  const n = mesesEntre(a.fecha_adq.slice(0, 7), fin) + 1;
  if (n <= 0) return 0;
  const base = Math.max(a.costo - (a.residual || 0), 0);
  if (n >= vida) return base;
  return Math.floor((2 * n * base + vida) / (2 * vida));
}
const depMes = (a, p) => depAcum(a, p) - depAcum(a, periodoAnterior(p));

function periodoActivos() {
  if (!S.afPeriodo || S.afPeriodoEid !== S.eid) { S.afPeriodo = periodoRcvInicial(); S.afPeriodoEid = S.eid; }
  return S.afPeriodo;
}
function itemRegistrado(a, periodo) {
  const reg = S.depreciaciones.find((d) => d.id === periodo);
  return (reg?.items || []).find((i) => i.activo === a.id && contabilizado(i)) || null;
}

function propuestaDepreciacion(periodo) {
  const items = S.activos.map((a) => ({ activo: a.id, monto: depMes(a, periodo), a })).filter((x) => x.monto > 0 && !itemRegistrado(x.a, periodo));
  if (!items.length) throw new ErrorRcv(`No hay depreciación pendiente de contabilizar en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias(), total = sumaDe(items, "monto");
  return { periodo, items: items.map(({ activo, monto }) => ({ activo, monto })), cantidad: items.length, fecha: ultimoDia(periodo), glosa: `DEPRECIACIÓN ACTIVO FIJO ${mesMayus(periodo)}`,
    lineas: [{ cuenta: cuentaConcepto(ct, "depreciacion_gasto"), debe: total, haber: 0 }, { cuenta: cuentaConcepto(ct, "depreciacion_acumulada"), debe: 0, haber: total }] };
}
async function marcarDepreciacion(periodo, items, asientoId) {
  const reg = S.depreciaciones.find((d) => d.id === periodo);
  const previos = (reg?.items || []).filter((i) => contabilizado(i) && !items.some((n) => n.activo === i.activo));
  await S.almacen.set(`empresas/${S.eid}/depreciaciones/${periodo}`, { periodo, items: [...previos, ...items.map((i) => ({ activo: i.activo, monto: i.monto, asiento: asientoId }))] });
}
async function liberarDepreciacion(asientoId) {
  for (const d of S.depreciaciones) {
    const resto = (d.items || []).filter((i) => i.asiento !== asientoId);
    if (resto.length === (d.items || []).length) continue;
    if (resto.length) await S.almacen.set(`empresas/${S.eid}/depreciaciones/${d.id}`, { periodo: d.id, items: resto });
    else await S.almacen.del(`empresas/${S.eid}/depreciaciones/${d.id}`);
  }
}

/* ---------- fichas de activo fijo desde las compras marcadas ---------- */
const esNotaCredito = (d) => [60, 61, 112].includes(+d.tipo_doc);
function costoCompraActivo(d) { return (d.neto || 0) + (d.exento || 0) + (d.iva_no_recuperable || 0); }
/* Compras marcadas como activo fijo que aún no tienen ficha y no fueron anuladas por una nota de crédito. */
function comprasActivoSinFicha() {
  const conFicha = new Set(S.activos.map((a) => a.rcv).filter(Boolean));
  const anulada = (d) => S.rcv.some((n) => n.registro === "COMPRA" && esNotaCredito(n) && n.rut === d.rut && (n.nc_de === `${d.tipo_doc}-${d.folio}` || (n.neto === d.neto && n.total === d.total && n.fecha >= d.fecha)));
  return S.rcv.filter((d) => d.registro === "COMPRA" && d.activo_fijo && !esNotaCredito(d) && !conFicha.has(d.id) && !anulada(d) && costoCompraActivo(d) > 0).sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
}
function categoriaSugerida(d) { const t = String(d.razon_social || ""); return /transport|camion|vehic|automot|motor/i.test(t) ? 3 : /computa|notebook|inform|tecnolog/i.test(t) ? 5 : /mueble|oficina/i.test(t) ? 4 : 2; }
function bloqueComprasActivo() {
  const c = comprasActivoSinFicha(); if (!c.length || !S.puedeEscribir) return "";
  return `<section class="caja"><h2>Compras de activo fijo sin ficha (${c.length})</h2>
    <p class="ayuda">Son compras del RCV marcadas como activo fijo que todavía no tienen ficha (no incluye las anuladas por una nota de crédito). Revisa la descripción, la categoría y la vida útil, y crea las fichas. El costo es el neto de la factura; la fecha de adquisición es la del documento.</p>
    <div class="tabla"><table><thead><tr><th>Fecha</th><th>Proveedor y documento</th><th class="num">Costo</th><th>Descripción de la ficha</th><th>Categoría</th><th>Vida útil (años)</th><th></th></tr></thead><tbody>${c.map((d) => { const cat = categoriaSugerida(d);
      return `<tr><td>${fmtFecha(d.fecha)}</td><td>${esc(d.razon_social || d.rut)}<br><small class="ayuda">${esc(TIPOS_DOCUMENTO[+d.tipo_doc] || d.tipo_doc)} ${esc(d.folio)}</small></td><td class="num">${clp(costoCompraActivo(d))}</td>
        <td><input id="afc-nom-${esc(d.id)}" value="${esc(`Activo fijo · ${d.razon_social || d.rut} · ${TIPOS_DOCUMENTO[+d.tipo_doc] || "Doc."} ${d.folio}`)}"></td>
        <td><select id="afc-cat-${esc(d.id)}" data-afc="${esc(d.id)}">${CATEGORIAS_ACTIVO.map(([n], i) => `<option value="${i}" ${i === cat ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></td>
        <td><input id="afc-vida-${esc(d.id)}" inputmode="decimal" style="width:5em" value="${CATEGORIAS_ACTIVO[cat][1] || ""}"></td>
        <td><button class="btn enlace" type="button" data-n="afc-crear" data-id="${esc(d.id)}">Crear ficha</button></td></tr>`; }).join("")}</tbody></table></div>
    <div class="acciones"><button class="btn" type="button" data-n="afc-crear-todas">Crear las ${c.length} ficha(s)</button></div></section>`;
}
async function crearFichasDesdeCompras(ids) {
  const docs = comprasActivoSinFicha().filter((d) => ids.includes(d.id)), nums = S.activos.map((a) => +String(a.codigo).replace(/\D/g, "")).filter(Number.isFinite);
  let sig = (nums.length ? Math.max(...nums) : 0) + 1; const cuentaAf = cuentasTributarias().compras_activo_fijo || "", fichas = [];
  for (const d of docs) {
    const nombre = ($(`#afc-nom-${d.id}`)?.value || "").trim(), cat = +($(`#afc-cat-${d.id}`)?.value ?? categoriaSugerida(d)), vida = decimal($(`#afc-vida-${d.id}`)?.value);
    if (!nombre) return aviso("Escribe la descripción de cada ficha.");
    if (vida == null || Number.isNaN(vida) || vida <= 0 || vida > 100) return aviso(`Vida útil de «${nombre}»: indica los años, por ejemplo 9 o 2,5.`);
    const normal = Math.round(vida * 12);
    fichas.push({ id: "f" + nuevoId(), d, doc: { codigo: `AF-${String(sig++).padStart(3, "0")}`, nombre, cat, fecha_adq: d.fecha, costo: costoCompraActivo(d), residual: 0, vida_normal_meses: normal, vida_meses: normal, acelerada: false,
      cuenta: S.porId.has(cuentaAf) ? cuentaAf : "", documento: `${TIPOS_DOCUMENTO[+d.tipo_doc] || "Doc."} ${d.folio} de ${d.razon_social || d.rut}`, estado: "activo", fecha_baja: "", dep_trib: "igual", rcv: d.id } });
  }
  if (!fichas.length) return;
  await ocupado(async () => { for (const f of fichas) await S.almacen.set(`empresas/${S.eid}/activos/${f.id}`, f.doc); render(); aviso(`${fichas.length} ficha(s) de activo fijo creada(s).`); }, "No se pudieron crear las fichas");
}

async function guardarActivo() {
  const ae = S.activoEdit;
  const nombre = $("#af-nombre").value.trim(), fecha = $("#af-fecha").value, costo = parseMonto($("#af-costo").value || "0"), residual = parseMonto($("#af-residual").value || "0");
  const vidaAnios = decimal($("#af-vida").value), acelerada = $("#af-acelerada").checked, cat = +$("#af-cat").value;
  const estado = $("#af-estado")?.value || "activo", fechaBaja = $("#af-baja")?.value || "";
  Object.assign(ae, { nombre, cat, fecha_adq: fecha, acelerada, cuenta: $("#af-cuenta").value, documento: $("#af-doc").value.trim(), vida_anios: $("#af-vida").value, estado, fecha_baja: fechaBaja });
  if (!nombre) return aviso("Ingresa la descripción del bien.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return aviso("Ingresa la fecha de adquisición.");
  if (Number.isNaN(costo) || costo <= 0) return aviso("Costo: ingresa un monto en pesos enteros, mayor que cero.");
  if (Number.isNaN(residual) || residual < 0 || residual >= costo) return aviso("El valor residual debe ser un monto menor que el costo.");
  if (vidaAnios == null || Number.isNaN(vidaAnios) || vidaAnios <= 0 || vidaAnios > 100) return aviso("Vida útil: ingresa los años, por ejemplo 6 o 2,5.");
  const normal = Math.round(vidaAnios * 12);
  if (acelerada && normal < 36) return aviso("La depreciación acelerada no se permite si la vida útil normal es menor de 3 años.");
  if (estado === "baja" && (!/^\d{4}-\d{2}-\d{2}$/.test(fechaBaja) || fechaBaja < fecha)) return aviso("Ingresa la fecha de baja, posterior a la adquisición.");
  const vida = acelerada ? Math.max(Math.round(normal / 3), 1) : normal;
  if (ae.id) {
    const previo = activoPorId(ae.id), meses = S.depreciaciones.filter((d) => (d.items || []).some((i) => i.activo === ae.id && contabilizado(i))).map((d) => d.id).sort();
    if (meses.length) {
      if (previo.costo !== costo || (previo.residual || 0) !== residual || previo.fecha_adq !== fecha || previo.vida_meses !== vida)
        return aviso("Este bien ya tiene depreciación contabilizada: elimina primero esos asientos de depreciación para cambiar su costo, valor residual, vida útil o fecha de adquisición.");
      if (estado === "baja" && fechaBaja.slice(0, 7) < meses.at(-1)) return aviso(`La fecha de baja es anterior a ${nombrePeriodo(meses.at(-1))}, mes cuya depreciación ya está contabilizada.`);
    }
  }
  const numeros = S.activos.map((a) => +String(a.codigo).replace(/\D/g, "")).filter(Number.isFinite);
  const codigo = ae.id ? ae.codigo : `AF-${String((numeros.length ? Math.max(...numeros) : 0) + 1).padStart(3, "0")}`;
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/activos/${ae.id || "f" + nuevoId()}`, { codigo, nombre, cat, fecha_adq: fecha, costo, residual, vida_normal_meses: normal, vida_meses: vida, acelerada,
      cuenta: ae.cuenta, documento: ae.documento, estado, fecha_baja: estado === "baja" ? fechaBaja : "", dep_trib: $("#af-trib").value || "igual" });
    S.activoEdit = null; render(); aviso(`Activo ${codigo} guardado.`);
  }, "No se pudo guardar el activo");
}

      <td class="num">${clp(delMes.reduce((s, a) => s + depMes(a, p), 0))}</td><td class="num">${clp(delMes.reduce((s, a) => s + depAcum(a, p), 0))}</td><td class="num">${clp(delMes.reduce((s, a) => s + a.costo - depAcum(a, p), 0))}</td><td></td></tr></tfoot></table></div>
    <p class="ayuda">«Contabilizar» abre la propuesta del asiento (Depreciación del ejercicio / Depreciación acumulada) para revisarla antes de guardar. Si agregas un bien con fecha anterior a un mes ya contabilizado, ese mes queda con el bien pendiente.</p>`

  <h2>Estado de ${anio}</h2>

}

/* Libro auxiliar de activo fijo de un ejercicio, con conciliación contra la contabilidad. */
function datosLibroActivos(anio) {
  const ini = `${anio - 1}-12`, fin = `${anio}-12`;
  const baja = (a) => a.estado === "baja" && a.fecha_baja && a.fecha_baja.slice(0, 4) <= String(anio);
  const adquiridos = S.activos.filter((a) => a.fecha_adq.slice(0, 4) <= String(anio)).sort((a, b) => (a.codigo < b.codigo ? -1 : 1));
  const vigentes = adquiridos.filter((a) => !baja(a));
  const bajas = adquiridos.filter((a) => baja(a) && a.fecha_baja.slice(0, 4) === String(anio));
  const fila = (a) => ({ a, costo: a.costo, ini: depAcum(a, ini), ejercicio: depAcum(a, fin) - depAcum(a, ini), fin: depAcum(a, fin), libro: a.costo - depAcum(a, fin) });
  const filasVigentes = vigentes.map(fila), filasBajas = bajas.map(fila);
  const saldos = saldosPeriodo(`${anio}-01-01`, `${anio}-12-31`).cuentas;
  const saldoCuenta = (id) => { const x = saldos.find((s) => s.cuenta.id === id); return x ? x.debe - x.haber : 0; };
  const ct = cuentasTributarias();
  const porCuenta = new Map();
  for (const f of filasVigentes) if (f.a.cuenta) porCuenta.set(f.a.cuenta, (porCuenta.get(f.a.cuenta) || 0) + f.costo);
  const conciliacion = [...porCuenta].map(([id, aux]) => ({ cuenta: S.porId.get(id), auxiliar: aux, contable: saldoCuenta(id) }));
  if (ct.depreciacion_acumulada) conciliacion.push({ cuenta: S.porId.get(ct.depreciacion_acumulada), auxiliar: -sumaDe(filasVigentes, "fin"), contable: saldoCuenta(ct.depreciacion_acumulada) });
  return { anio, vigentes: filasVigentes, bajas: filasBajas, conciliacion: conciliacion.filter((c) => c.cuenta) };
}

  ${d.vigentes.length ? `<div class="tabla"><table>${cabeza}<tbody>${d.vigentes.map(fila).join("")}</tbody><tfoot>${total(d.vigentes, "Total activo fijo")}</tfoot></table></div>`

function informeActivos(anio) {
  const d = datosLibroActivos(anio);
  const inf = new Informe("LIBRO DE ACTIVO FIJO", `EJERCICIO ${anio} · DEPRECIACIÓN LINEAL`,
    [col("Código", 8), col("Descripción", 26), col("Adquisición", 10, "fecha"), col("Costo", 12, "monto"), col("Vida útil", 8), col(`Dep. acum. 31/12/${anio - 1}`, 12, "monto"), col(`Dep. ${anio}`, 11, "monto"), col(`Dep. acum. 31/12/${anio}`, 12, "monto"), col("Valor libro", 12, "monto")],

/* Lee el formulario del trabajador sin validar (se usa al guardar y al agregar o quitar filas). */
function leerTrabajador() {
  const te = S.trabEdit, v = (id) => $("#tb-" + id)?.value ?? "";
  const lista = (n, f) => { const out = []; for (let i = 0; $(`#tb-${n}-con-${i}`); i++) out.push(f(i)); return out; };
  const haberes = lista("hf", (i) => ({ concepto: v(`hf-con-${i}`).trim(), monto: parseMonto(v(`hf-monto-${i}`) || "0") || 0, imponible: $(`#tb-hf-imp-${i}`).checked, proporcional: $(`#tb-hf-prop-${i}`).checked }));
  const descuentos = lista("df", (i) => { const tipo = v(`df-tipo-${i}`); const x = decimal(v(`df-valor-${i}`)); return { concepto: v(`df-con-${i}`).trim(), tipo, valor: x == null || Number.isNaN(x) ? 0 : x }; });
  const d = { nombre: v("nombre").trim(), rut: v("rut").trim(), nacionalidad: v("nacionalidad").trim(), fecha_nac: v("fecha_nac"), domicilio: v("domicilio").trim(), comuna: v("comuna").trim(), cargo: v("cargo").trim(), funciones: v("funciones").trim(),
    lugar: v("lugar").trim(), fecha_ingreso: v("fecha_ingreso"), tipo: v("tipo"), fecha_termino: v("fecha_termino"), obra: v("obra").trim(), jornada: Number(v("jornada")), distribucion: v("distribucion").trim(),
    sueldo_base: parseMonto(v("sueldo_base") || "0"), gratificacion: v("gratificacion"), gratificacion_monto: parseMonto(v("gratificacion_monto") || "0"), colacion: parseMonto(v("colacion") || "0"), movilizacion: parseMonto(v("movilizacion") || "0"),
    semana_corrida: !!$("#tb-semana_corrida")?.checked, cargas: Number(v("cargas") || 0), forma_pago: v("forma_pago").trim(), afp: v("afp"), afp_comision: decimal(v("afp_comision")), salud: v("salud"), isapre: v("isapre").trim(), plan_uf: decimal(v("plan_uf")) || 0,
    trabajo_pesado: v("trabajo_pesado") || "ninguno", apv_monto: parseMonto(v("apv_monto") || "0"), apv_regimen: v("apv_regimen") || "B", sin_cesantia: !!$("#tb-sin_cesantia")?.checked, pensionado: !!$("#tb-pensionado")?.checked, sexo: v("sexo") || "", anios_previos: Number(v("anios_previos") || 0),
    haberes_fijos: haberes, descuentos_fijos: descuentos, vacaciones: te.vacaciones || [], activo: te.id ? !!$("#tb-activo")?.checked : true, fecha_finiquito: te.id ? v("fecha_finiquito") : "" };
  return d;
}
function actualizarFormTrabajador(cambio) { const d = leerTrabajador(); S.trabEdit = { ...S.trabEdit, ...d, afp_comision: $("#tb-afp_comision").value, plan_uf: $("#tb-plan_uf").value }; if (cambio) cambio(S.trabEdit); render(); }

async function guardarTrabajador() {
  const te = S.trabEdit, d = leerTrabajador();
  const { nombre, rut, sueldo_base: sueldo, jornada, afp_comision: comision, plan_uf: plan } = d;
  S.trabEdit = { ...te, ...d, afp_comision: $("#tb-afp_comision").value, plan_uf: $("#tb-plan_uf").value };
  if (!nombre) return aviso("Ingresa el nombre del trabajador.");
  if (!rutValido(rut)) return aviso("El RUT no es válido (revisa el dígito verificador).");
  if (!d.cargo) return aviso("Ingresa el cargo.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha_ingreso)) return aviso("Ingresa la fecha de ingreso.");
  for (const [n, x] of [["Sueldo base", sueldo], ["Gratificación fija", d.gratificacion_monto], ["Colación", d.colacion], ["Movilización", d.movilizacion], ["APV", d.apv_monto]]) if (Number.isNaN(x) || x < 0) return aviso(`${n}: ingresa un monto en pesos enteros, sin decimales.`);
  if (sueldo <= 0) return aviso("Ingresa el sueldo base mensual.");
  if (!Number.isFinite(jornada) || jornada < 1 || jornada > 45) return aviso("La jornada semanal debe estar entre 1 y 45 horas.");
  if (comision == null || Number.isNaN(comision) || comision < 0 || comision > 5) return aviso("Comisión de la AFP: ingresa un porcentaje, por ejemplo 1,27.");
  if (Number.isNaN(plan) || (plan ?? 0) < 0) return aviso("Plan de isapre: ingresa las UF, por ejemplo 3,5.");
  if (d.salud === "isapre" && !d.plan_uf) return aviso("Ingresa el valor del plan de isapre en UF.");
  if (!Number.isInteger(d.cargas) || d.cargas < 0 || d.cargas > 20) return aviso("Las cargas familiares deben ser un número entero, por ejemplo 2.");
  if (!Number.isFinite(d.anios_previos) || d.anios_previos < 0 || d.anios_previos > 60) return aviso("Años con otros empleadores: ingresa un número, por ejemplo 4.");
  if (d.tipo === "plazo_fijo" && (!d.fecha_termino || d.fecha_termino <= d.fecha_ingreso)) return aviso("Un contrato a plazo fijo necesita fecha de término posterior al ingreso.");
  if (d.tipo === "obra" && !d.obra) return aviso("Describe la obra o faena del contrato.");
  for (const h of d.haberes_fijos) if (!h.concepto || !(h.monto > 0)) return aviso("Cada haber fijo necesita un nombre y un monto mayor que cero.");
  for (const x of d.descuentos_fijos) if (!x.concepto || !(x.valor > 0) || (x.tipo === "pct" && x.valor > 50)) return aviso("Cada descuento fijo necesita un nombre y un valor mayor que cero (hasta 50 % si es porcentaje).");
  const r = formatoRut(rut);
  if (S.trabajadores.some((t) => t.rut === r && t.id !== te.id)) return aviso(`Ya existe un trabajador con el RUT ${r}.`);
  d.rut = r;
  const imm = parametrosPrev(d.fecha_ingreso.slice(0, 7)).imm, minimo = Math.round(imm * Math.min(d.jornada / 42, 1));
  const advertencia = sueldo < minimo ? ` Atención: el sueldo base es menor que el ingreso mínimo proporcional a la jornada ($${clp(minimo)}).` : "";
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/trabajadores/${te.id || "w" + nuevoId()}`, d);
    S.trabEdit = null; render(); aviso("Trabajador guardado." + advertencia);
  }, "No se pudo guardar el trabajador");
}

/* ---------- contrato de trabajo ---------- */
const fechaLarga = (f) => (f ? `${+f.slice(8, 10)} de ${MESES[+f.slice(5, 7) - 1].toLowerCase()} de ${f.slice(0, 4)}` : "");
function textoContrato(t) {

  cl("PRIMERO: Naturaleza de los servicios y lugar de trabajo.", `El trabajador se obliga a desempeñar el cargo de ${t.cargo}${t.funciones ? `, cuyas funciones consisten en: ${t.funciones}` : ""}. Los servicios se prestarán en ${t.lugar || dirEmp || "las dependencias del empleador"}, sin perjuicio de la facultad del empleador de alterar la naturaleza de los servicios o el sitio o recinto en que ellos deban prestarse, siempre que se trate de labores similares, que el nuevo sitio quede dentro del mismo lugar o ciudad y que ello no importe menoscabo para el trabajador, conforme al artículo 12 del Código del Trabajo.`);
  cl("SEGUNDO: Jornada de trabajo.", `La jornada ordinaria de trabajo será de ${t.jornada} horas semanales, distribuidas así: ${t.distribucion || "__________"}. Las horas extraordinarias solo podrán pactarse por escrito, para atender necesidades o situaciones temporales de la empresa, y se pagarán con el recargo legal del 50 % sobre el sueldo convenido para la jornada ordinaria.`);
  const grat = t.gratificacion === "legal" ? ` El empleador pagará gratificación legal conforme al artículo 50 del Código del Trabajo, a razón del 25 % de lo devengado en el respectivo ejercicio por concepto de remuneraciones mensuales, con el tope de 4,75 ingresos mínimos mensuales, pagadera mensualmente en forma proporcional.`
    : t.gratificacion === "fija" ? ` Además, el empleador pagará una gratificación mensual garantizada de $${clp(t.gratificacion_monto)}, que se imputará a la gratificación legal.` : " Las partes no pactan gratificación mensual, sin perjuicio de lo dispuesto en los artículos 46 y siguientes del Código del Trabajo.";
  const asig = [t.colacion ? `colación de $${clp(t.colacion)}` : "", t.movilizacion ? `movilización de $${clp(t.movilizacion)}` : ""].filter(Boolean);
  const fijos = (t.haberes_fijos || []).map((h) => `${h.concepto} de $${clp(h.monto)}${h.imponible ? "" : " (no imponible)"}`);
  const variable = t.semana_corrida ? " Como la remuneración del trabajador es variable, el empleador pagará además la semana corrida conforme al artículo 45 del Código del Trabajo." : "";
  cl("TERCERO: Remuneración.", `El empleador pagará al trabajador un sueldo base mensual de $${clp(t.sueldo_base)}.${grat}${fijos.length ? ` Además se pagará mensualmente: ${fijos.join("; ")}.` : ""}${variable}${asig.length ? ` Se pagará además una asignación de ${asig.join(" y una asignación de ")} mensual, por los días efectivamente trabajados, que conforme al artículo 41 del Código del Trabajo no constituye remuneración.` : ""} El pago se efectuará ${t.forma_pago ? t.forma_pago.charAt(0).toLowerCase() + t.forma_pago.slice(1) : "mensualmente"}. Del total se descontarán los impuestos, las cotizaciones previsionales y de salud, y las demás deducciones que autorice la ley o que el trabajador autorice por escrito.`);
  cl("CUARTO: Previsión y salud.", `El trabajador se encuentra afiliado a la AFP ${t.afp} y a ${t.salud === "isapre" ? `la isapre ${t.isapre || "__________"}` : "Fonasa"}${t.sin_cesantia ? "" : ", y cotizará en el Seguro de Cesantía de la Ley N° 19.728"}. El empleador descontará y enterará las cotizaciones en las instituciones respectivas y pagará de su cargo la cotización adicional de la Ley N° 21.735, el seguro de accidentes del trabajo y las demás cotizaciones que corresponden al empleador.`);

    : `El presente contrato se celebra por la duración de la obra o faena: ${t.obra}, y terminará al concluir esta, de acuerdo con el artículo 159 N° 5 del Código del Trabajo.`);
  cl("SEXTO: Fecha de ingreso.", `Las partes dejan constancia de que el trabajador ingresó a prestar servicios el ${fechaLarga(t.fecha_ingreso)}.`);
  cl("SÉPTIMO: Obligaciones del trabajador.", "El trabajador se obliga a cumplir fielmente las instrucciones del empleador relacionadas con sus labores, a respetar el Reglamento Interno de Orden, Higiene y Seguridad de la empresa, a mantener reserva sobre la información confidencial a que tenga acceso y a cuidar los bienes que se le confíen.");
  cl("OCTAVO: Ejemplares.", "El presente contrato se firma en dos ejemplares del mismo tenor y fecha, quedando uno en poder de cada parte. El trabajador declara haber recibido su ejemplar en este acto.");

/* PDF de un documento de texto (contrato, finiquito, carta): bloques con título, párrafos y cláusulas con rótulo en negrita. */
async function pdfDocumento(titulo, bloques, firmas) {
  await cargarScript("jspdf");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter", compress: true });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), m = 2.5 * CM, ancho = W - 2 * m, interlinea = 15;
  doc.setProperties({ title: `${titulo} – ${empresa().razon_social}`, author: empresa().razon_social });
  let y = m;
  const salto = (alto) => { if (y + alto > H - m) { doc.addPage(); y = m; } };
  for (const b of bloques) {
    if (b.tipo === "titulo") { doc.setFont("times", "bold"); doc.setFontSize(14); doc.text(textoPdf(b.texto), W / 2, y, { align: "center" }); y += 30; continue; }
    doc.setFontSize(11);
    if (b.tipo === "cl") {
      const rot = textoPdf(b.rotulo), texto = textoPdf(b.texto);
      doc.setFont("times", "bold"); const ancho1 = doc.getTextWidth(rot + " ") + 3;
      doc.setFont("times", "normal");
      const primera = doc.splitTextToSize(texto, ancho - ancho1)[0] || "";
      salto(interlinea * 2);
      doc.setFont("times", "bold"); doc.text(rot, m, y);
      doc.setFont("times", "normal"); doc.text(primera, m + ancho1, y); y += interlinea;
      for (const l of doc.splitTextToSize(texto.slice(primera.length).trim(), ancho)) { salto(interlinea); doc.text(l, m, y); y += interlinea; }
      y += 8; continue;
    }
    if (b.tipo === "fila") { salto(interlinea); doc.setFont("times", b.negrita ? "bold" : "normal"); doc.text(textoPdf(b.texto), m + 12, y); doc.text(textoPdf(b.valor), W - m, y, { align: "right" }); y += interlinea; continue; }
    const lineas = doc.setFont("times", "normal").splitTextToSize(textoPdf(b.texto), ancho);
    for (const l of lineas) { salto(interlinea); doc.text(l, m, y); y += interlinea; }
    y += 8;
  }
  salto(110); y += 50;
  doc.setFont("times", "normal");
  const mitad = ancho / 2;
  firmas.forEach(([a, b, c], i) => { const x = m + i * (mitad + 20); doc.line(x, y, x + mitad - 40, y); doc.setFontSize(10); doc.text(textoPdf(a), x, y + 14); doc.text(textoPdf(b), x, y + 27); doc.text(c, x, y + 40); });
  return doc.output("blob");
}
