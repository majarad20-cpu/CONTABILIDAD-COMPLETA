<style>
/* Libro contable en pantalla: menú lateral fijo con las secciones del programa local, hoja de trabajo a la derecha. */
:root {

  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #151d1a; --surface-2: #1b2622; --fg: #e3ebe8; --muted: #94a59f;
    --line: #2a3733; --accent: #5ec2a2; --accent-fg: #0b1a15; --accent-soft: #19302a; --neg: #f28b82;
    --warn-bg: #3a2f12; --warn-fg: #f3d58a; --ok-bg: #173226; --ok-fg: #9fdcbd; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --surface-2: #1b2622; --fg: #e3ebe8; --muted: #94a59f;
  --line: #2a3733; --accent: #5ec2a2; --accent-fg: #0b1a15; --accent-soft: #19302a; --neg: #f28b82;
  --warn-bg: #3a2f12; --warn-fg: #f3d58a; --ok-bg: #173226; --ok-fg: #9fdcbd; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.app { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.menu { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 14px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.marca { display: grid; gap: 4px; padding: 0 4px; }
.marca select { font: 600 14px var(--font-ui); width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); color: var(--fg); }
.marca small { color: var(--muted); font-size: 12px; }

nav button:hover { background: var(--surface-2); }

nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { padding-block: 24px 48px; padding-inline: 28px; min-width: 0; display: grid; gap: 18px; align-content: start; }
h1 { font-size: 22px; margin: 0; text-wrap: balance; letter-spacing: -.01em; }

.ayuda { color: var(--muted); font-size: 13px; max-width: 70ch; }

.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

input, select, textarea { font: 14px var(--font-ui); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; min-width: 0; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.btn { font: 500 14px var(--font-ui); cursor: pointer; border-radius: var(--radius); padding: 7px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); white-space: nowrap; }

dl.ficha { display: grid; grid-template-columns: max-content auto; gap: 6px 18px; margin: 0; }
dl.ficha dt { color: var(--muted); }
dl.ficha dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.confirmar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--neg); border-radius: var(--radius); }
.lineas input { width: 100%; }
.lineas td { padding: 4px 6px; }
.lineas .monto { text-align: right; font-family: var(--font-num); }
.lineas input.malo { border-color: var(--neg); }
.cuadre { font-family: var(--font-num); }
.cuadre.ok { color: var(--ok-fg); }
.toast { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--radius); max-width: min(420px, calc(100vw - 32px)); z-index: 5; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .menu { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 12px 16px; }
  nav { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav .seccion { display: none; }

}

<script>
"use strict";
/* ------------------------------------------------------------------ utilidades */
const PLAN_BASE = [["1","ACTIVO",0],["1.1","ACTIVO CIRCULANTE",0],["1.1.01","Caja",1],["1.1.02","Banco",1],["1.1.03","Depósitos a plazo",1],["1.1.04","Clientes",1],["1.1.05","Documentos por cobrar",1],["1.1.06","Deudores varios",1],["1.1.07","Provisión deudores incobrables",1],["1.1.08","Mercaderías",1],["1.1.09","IVA crédito fiscal",1],["1.1.10","Pagos provisionales mensuales (PPM)",1],["1.1.11","Anticipo a proveedores",1],["1.2","ACTIVO FIJO",0],["1.2.01","Terrenos",1],["1.2.02","Construcciones",1],["1.2.03","Maquinarias y equipos",1],["1.2.04","Vehículos",1],["1.2.05","Muebles y útiles",1],["1.2.06","Equipos computacionales",1],["1.2.07","Depreciación acumulada",1],["1.3","OTROS ACTIVOS",0],["1.3.01","Garantías entregadas",1],["1.3.02","Intangibles",1],["2","PASIVO",0],["2.1","PASIVO CIRCULANTE",0],["2.1.01","Proveedores",1],["2.1.02","Documentos por pagar",1],["2.1.03","Acreedores varios",1],["2.1.04","IVA débito fiscal",1],["2.1.05","Impuesto único por pagar",1],["2.1.06","Retención de honorarios por pagar",1],["2.1.07","PPM por pagar",1],["2.1.08","Remuneraciones por pagar",1],["2.1.09","Cotizaciones previsionales por pagar",1],["2.1.10","Impuesto a la renta por pagar",1],["2.1.11","Préstamos bancarios de corto plazo",1],["2.1.12","Anticipo de clientes",1],["2.2","PASIVO DE LARGO PLAZO",0],["2.2.01","Préstamos bancarios de largo plazo",1],["2.2.02","Obligaciones por leasing",1],["3","PATRIMONIO",0],["3.1","CAPITAL Y RESERVAS",0],["3.1.01","Capital",1],["3.1.02","Utilidades retenidas",1],["3.1.03","Pérdidas acumuladas",1],["3.1.04","Resultado del ejercicio",1],["3.1.05","Retiros de socios",1],["4","INGRESOS",0],["4.1","INGRESOS DE EXPLOTACIÓN",0],["4.1.01","Ventas",1],["4.1.02","Ingresos por servicios",1],["4.2","INGRESOS NO OPERACIONALES",0],["4.2.01","Intereses ganados",1],["4.2.02","Otros ingresos",1],["5","GASTOS",0],["5.1","COSTOS DE EXPLOTACIÓN",0],["5.1.01","Costo de ventas",1],["5.2","GASTOS DE ADMINISTRACIÓN Y VENTAS",0],["5.2.01","Remuneraciones",1],["5.2.02","Leyes sociales (aporte patronal)",1],["5.2.03","Honorarios",1],["5.2.04","Arriendos",1],["5.2.05","Servicios básicos",1],["5.2.06","Gastos de oficina",1],["5.2.07","Publicidad",1],["5.2.08","Mantención y reparaciones",1],["5.2.09","Seguros",1],["5.2.10","Depreciación del ejercicio",1],["5.2.11","Patentes y contribuciones",1],["5.2.12","Gastos generales",1],["5.3","GASTOS NO OPERACIONALES",0],["5.3.01","Intereses y gastos bancarios",1],["5.3.02","Multas e intereses fiscales",1],["5.3.03","Otros gastos",1],["5.4","IMPUESTO A LA RENTA",0],["5.4.01","Impuesto a la renta de primera categoría",1]];
const TIPO_POR_DIGITO = { "1": "ACTIVO", "2": "PASIVO", "3": "PATRIMONIO", "4": "INGRESO", "5": "GASTO" };
const NOMBRE_TIPO = { ACTIVO: "Activo", PASIVO: "Pasivo", PATRIMONIO: "Patrimonio", INGRESO: "Ingreso (ganancia)", GASTO: "Gasto (pérdida)" };
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const RESULTADO = new Set(["INGRESO", "GASTO"]);

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clp = (n) => (n < 0 ? "-" : "") + Math.round(Math.abs(n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const monto = (n) => n ? `<span class="${n < 0 ? "neg" : ""}">${clp(n)}</span>` : "";
const fmtFecha = (f) => f ? `${f.slice(8, 10)}/${f.slice(5, 7)}/${f.slice(0, 4)}` : "";
const hoy = () => new Date().toISOString().slice(0, 10);
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const porCodigo = (a, b) => (a.codigo < b.codigo ? -1 : a.codigo > b.codigo ? 1 : 0);
const saldoNatural = (tipo, d, h) => (tipo === "ACTIVO" || tipo === "GASTO" ? d - h : h - d);
const nivel = (codigo) => codigo.split(".").length - 1;

function limpiarRut(r) { return String(r || "").replace(/[^0-9kK]/g, "").toUpperCase(); }
function dv(cuerpo) { let s = 0, m = 2; for (const d of String(cuerpo).split("").reverse()) { s += +d * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (s % 11); return r === 11 ? "0" : r === 10 ? "K" : String(r); }
function rutValido(r) { const x = limpiarRut(r); return x.length >= 2 && /^\d+$/.test(x.slice(0, -1)) && dv(x.slice(0, -1)) === x.slice(-1); }
function formatoRut(r) { const x = limpiarRut(r); if (x.length < 2) return r || ""; return clp(+x.slice(0, -1)) + "-" + x.slice(-1); }
function parseMonto(t) {
  const s = String(t ?? "").replace(/[$\s.]/g, "").replace(",", ".");
  if (!s) return 0;
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n) : NaN;
}

function aviso(texto) {
  const t = $("#toast"); t.textContent = texto; t.hidden = false;
  clearTimeout(aviso.timer); aviso.timer = setTimeout(() => (t.hidden = true), 4200);
}
function recordar(clave, valor) { try { localStorage.setItem("cc-" + clave, JSON.stringify(valor)); } catch (_) {} }
function recuerdo(clave, defecto) { try { const v = localStorage.getItem("cc-" + clave); return v == null ? defecto : JSON.parse(v); } catch (_) { return defecto; } }

/* ------------------------------------------------------------------ almacenamiento */
async function reintentar(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const transitorio = e && (e.code === "unavailable" || e.code === "resource_exhausted");
      if (!transitorio || i >= 5) throw e;
      await new Promise((r) => setTimeout(r, 400 * (i + 1) + Math.random() * 300));
    }
  }
}

/* Subcolecciones de cada empresa (se borran junto con ella). */
const SUBCOLECCIONES = ["asientos", "cambios", "rcv", "f29", "socios", "sueldos", "honorarios"];

/* Acceso a datos por ruta («empresas/e1/asientos/a1»). Dos implementaciones con la misma interfaz:
   memoria (archivo abierto fuera del artefacto, para probar) y la base del artefacto de Claude. */
class AlmacenMemoria {
  constructor() { this.docs = new Map(); this.oyentes = new Set(); this.enLinea = false; }
  coleccion(ruta) {
    const n = ruta.split("/").length + 1;
    return [...this.docs].filter(([k]) => k.startsWith(ruta + "/") && k.split("/").length === n).map(([k, v]) => ({ ...v, id: k.split("/").pop() }));
  }
  avisar(ruta) {
    const padre = ruta.split("/").slice(0, -1).join("/");
    for (const o of this.oyentes) {
      if (o.tipo === "col" && o.ruta === padre) o.cb(this.coleccion(o.ruta));
      if (o.tipo === "doc" && o.ruta === ruta) o.cb(this.docs.has(ruta) ? { ...this.docs.get(ruta), id: ruta.split("/").pop() } : null);
    }
  }
  onCol(ruta, cb) { const o = { tipo: "col", ruta, cb }; this.oyentes.add(o); cb(this.coleccion(ruta)); return () => this.oyentes.delete(o); }
  onDoc(ruta, cb) { const o = { tipo: "doc", ruta, cb }; this.oyentes.add(o); cb(this.docs.has(ruta) ? { ...this.docs.get(ruta), id: ruta.split("/").pop() } : null); return () => this.oyentes.delete(o); }
  async leerCol(ruta) { return this.coleccion(ruta); }
  async set(ruta, d) { const { id: _i, numero: _n, ...cuerpo } = d; this.docs.set(ruta, JSON.parse(JSON.stringify(cuerpo))); this.avisar(ruta); }
  async del(ruta) { this.docs.delete(ruta); this.avisar(ruta); }
}

class AlmacenClaude {
  constructor(db) { this.db = db; this.enLinea = true; }
  onCol(ruta, cb, err) { return this.db.collection(ruta).onSnapshot((s) => cb(s.docs.map((d) => ({ ...d.data(), id: d.id }))), err); }
  onDoc(ruta, cb, err) { return this.db.doc(ruta).onSnapshot((d) => cb(d.exists ? { ...d.data(), id: d.id } : null), err); }
  async leerCol(ruta) { const s = await reintentar(() => this.db.collection(ruta).get()); return s.docs.map((d) => ({ ...d.data(), id: d.id })); }
  set(ruta, d) { const { id: _i, numero: _n, ...cuerpo } = d; return reintentar(() => this.db.doc(ruta).set(cuerpo)); }
  del(ruta) { return reintentar(() => this.db.doc(ruta).delete()); }
}

/* Operaciones de alto nivel, iguales para ambos almacenes. */
const BD = {
  onEmpresas: (cb, err) => S.almacen.onCol("empresas", cb, err),
  onAsientos: (eid, cb, err) => S.almacen.onCol(`empresas/${eid}/asientos`, cb, err),
  setEmpresa: (id, d) => S.almacen.set(`empresas/${id}`, d),
  setAsiento: (eid, id, d) => S.almacen.set(`empresas/${eid}/asientos/${id}`, d),
  deleteAsiento: (eid, id) => S.almacen.del(`empresas/${eid}/asientos/${id}`),
  async deleteEmpresa(id) {
    for (const sub of SUBCOLECCIONES) for (const d of await S.almacen.leerCol(`empresas/${id}/${sub}`)) await S.almacen.del(`empresas/${id}/${sub}/${d.id}`);
    await S.almacen.del(`empresas/${id}`);
  },
};

/* ------------------------------------------------------------------ estado */
const S = {
  almacen: null, puedeEscribir: true, descargas: null,
  empresas: [], eid: recuerdo("empresa", null), cargandoAsientos: true,
  cuentas: [], porId: new Map(), lista: [],
  vista: recuerdo("vista", "inicio"),
  periodo: null, filtros: { anio: null, mes: "", texto: "" },
  edit: null, cuentaEdit: null, confirmar: null, importacion: null, csv: null, mayorCuenta: "",
  ocupado: false, desuscribirAsientos: null,
  contador: { nombre: "", rut: "", firma: "" }, cambios: [], desuscribirCambios: null,
  periodosAnio: null, cierreAnio: null, apertura: null,
  f29Borradores: [], desuscribirF29: null, f29: null, utm: {},
  informe: null, folioPendiente: false,
  socios: [], sueldos: [], honorarios: [], desuscribirRem: [], remPeriodo: null, remPeriodoEid: null, socioEdit: null, boletaEdit: null,
  rcv: [], desuscribirRcv: null, rcvPeriodo: null, rcvPeriodoEid: null, rcvSel: new Set(), rcvMensajes: null, docEdit: null,
};

function empresa() { return S.empresas.find((e) => e.id === S.eid) || null; }

function prepararCuentas() {
  const e = empresa();
  S.cuentas = (e?.cuentas || []).map((c) => ({ ...c })).sort(porCodigo);
  S.porId = new Map(S.cuentas.map((c) => [c.id, c]));
}

/* Correlativo cronológico: se reinicia cada año; en una misma fecha la apertura va primero y el cierre al final. */
function numerar(asientos) {
  const lista = asientos.map((a) => ({ ...a, lineas: (a.lineas || []).map((l) => ({ ...l })) }));
  lista.sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0)
    || (b.apertura ? 1 : 0) - (a.apertura ? 1 : 0)
    || (a.cierre ? 1 : 0) - (b.cierre ? 1 : 0)
    || (a.creado || 0) - (b.creado || 0)
    || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  let anio = null, n = 0;
  for (const a of lista) {
    const y = a.fecha.slice(0, 4);
    if (y !== anio) { anio = y; n = 0; }
    a.numero = ++n;
    a.total = a.lineas.reduce((s, l) => s + (l.debe || 0), 0);
  }
  return lista;
}

/* ------------------------------------------------------------------ contabilidad */
function corte(fecha, incluida = true) {
  let c = "0000-00-00";
  for (const a of S.lista) if (a.apertura && (incluida ? a.fecha <= fecha : a.fecha < fecha) && a.fecha > c) c = a.fecha;
  return c;
}

function saldosPeriodo(desde, hasta) {
  const inicio = corte(hasta);
  const acc = new Map();
  let anterior = 0;
  for (const a of S.lista) {
    if (a.fecha < inicio || a.fecha > hasta) continue;
    for (const l of a.lineas) {
      const c = S.porId.get(l.cuenta);
      if (!c) continue;
      const res = RESULTADO.has(c.tipo);
      if (res && a.fecha < desde) anterior += (l.haber || 0) - (l.debe || 0);
      const incluir = res ? a.fecha >= desde && !a.cierre : !(a.cierre && a.fecha >= desde);
      if (!incluir) continue;
      const x = acc.get(c.id) || { cuenta: c, debe: 0, haber: 0 };
      x.debe += l.debe || 0; x.haber += l.haber || 0;
      acc.set(c.id, x);
    }
  }
  return { cuentas: [...acc.values()].sort((a, b) => porCodigo(a.cuenta, b.cuenta)), anterior };
}

function arbol(tipos, montos) {
  const hojas = new Map();
  for (const c of S.cuentas) if (c.imputable && tipos.includes(c.tipo) && montos.get(c.id)) hojas.set(c.codigo, montos.get(c.id));
  const filas = [];
  for (const c of S.cuentas) {
    if (c.imputable) {
      if (!hojas.has(c.codigo)) continue;
      filas.push({ codigo: c.codigo, nombre: c.nombre, grupo: false, monto: hojas.get(c.codigo) });
    } else {
      let s = 0, hay = false;
      for (const [cod, v] of hojas) if (cod.startsWith(c.codigo + ".")) { s += v; hay = true; }
      if (hay) filas.push({ codigo: c.codigo, nombre: c.nombre, grupo: true, monto: s });
    }
  }
  return { filas, total: [...hojas.values()].reduce((s, v) => s + v, 0) };
}

function balanceOcho(desde, hasta) {
  const cols = ["debitos", "creditos", "deudor", "acreedor", "activo", "pasivo", "perdidas", "ganancias"];
  const datos = saldosPeriodo(desde, hasta);
  const filas = [];
  const agregar = (codigo, nombre, enRes, debe, haber) => {
    const f = Object.fromEntries(cols.map((k) => [k, 0]));
    const deudor = Math.max(debe - haber, 0), acreedor = Math.max(haber - debe, 0);
    Object.assign(f, { codigo, nombre, debitos: debe, creditos: haber, deudor, acreedor });
    if (enRes) { f.perdidas = deudor; f.ganancias = acreedor; } else { f.activo = deudor; f.pasivo = acreedor; }
    filas.push(f);
  };
  for (const x of datos.cuentas) agregar(x.cuenta.codigo, x.cuenta.nombre, RESULTADO.has(x.cuenta.tipo) || x.cuenta.resultados_en_ocho, x.debe, x.haber);
  if (datos.anterior) agregar("", "Resultados de ejercicios anteriores no cerrados", false, Math.max(-datos.anterior, 0), Math.max(datos.anterior, 0));
  const totales = Object.fromEntries(cols.map((k) => [k, filas.reduce((s, f) => s + f[k], 0)]));
  const resultado = totales.ganancias - totales.perdidas;
  const ajuste = Object.fromEntries(cols.map((k) => [k, 0]));
  if (resultado >= 0) { ajuste.pasivo = ajuste.perdidas = resultado; } else { ajuste.activo = ajuste.ganancias = -resultado; }
  const iguales = Object.fromEntries(cols.map((k) => [k, totales[k] + ajuste[k]]));
  return { cols, filas, totales, resultado, ajuste, iguales };
}

function estadoResultados(desde, hasta) {
  const datos = saldosPeriodo(desde, hasta);
  const montos = new Map(datos.cuentas.filter((x) => RESULTADO.has(x.cuenta.tipo)).map((x) => [x.cuenta.id, saldoNatural(x.cuenta.tipo, x.debe, x.haber)]));
  const ingresos = arbol(["INGRESO"], montos), gastos = arbol(["GASTO"], montos);
  return { ingresos, gastos, resultado: ingresos.total - gastos.total };
}

function balanceGeneral(hasta) {
  const desde = hasta.slice(0, 4) + "-01-01";
  const datos = saldosPeriodo(desde, hasta);
  const montos = new Map(datos.cuentas.map((x) => [x.cuenta.id, saldoNatural(x.cuenta.tipo, x.debe, x.haber)]));
  const activo = arbol(["ACTIVO"], montos), pasivo = arbol(["PASIVO"], montos), patrimonio = arbol(["PATRIMONIO"], montos);
  let resultado = 0;
  for (const x of datos.cuentas) if (RESULTADO.has(x.cuenta.tipo)) resultado += montos.get(x.cuenta.id) * (x.cuenta.tipo === "INGRESO" ? 1 : -1);
  const totalPatrimonio = patrimonio.total + datos.anterior + resultado;
  return { desde, activo, pasivo, patrimonio, anterior: datos.anterior, resultado, totalPatrimonio, totalPasivoPatrimonio: pasivo.total + totalPatrimonio };
}

function libroMayor(cuentaId, desde, hasta) {
  const c = S.porId.get(cuentaId);
  if (!c) return null;
  const inicio = corte(desde, false);
  let d0 = 0, h0 = 0;
  for (const a of S.lista) if (a.fecha >= inicio && a.fecha < desde) for (const l of a.lineas) if (l.cuenta === cuentaId) { d0 += l.debe || 0; h0 += l.haber || 0; }
  let saldo = saldoNatural(c.tipo, d0, h0);
  const saldoInicial = saldo;
  const aperturas = [...new Set(S.lista.filter((a) => a.apertura && a.fecha >= desde && a.fecha <= hasta).map((a) => a.fecha))].sort();
  const movimientos = [];
  let td = 0, th = 0;
  for (const a of S.lista) {
    if (a.fecha < desde || a.fecha > hasta) continue;
    for (const l of a.lineas) {
      if (l.cuenta !== cuentaId) continue;
      while (aperturas.length && a.fecha >= aperturas[0]) {
        aperturas.shift();
        if (saldo) movimientos.push({ reinicio: true, fecha: a.fecha, anterior: saldo });
        saldo = 0;
      }
      saldo += saldoNatural(c.tipo, l.debe || 0, l.haber || 0);
      td += l.debe || 0; th += l.haber || 0;
      movimientos.push({ asiento: a, glosa: l.glosa || a.glosa, debe: l.debe || 0, haber: l.haber || 0, saldo });
    }
  }
  return { cuenta: c, saldoInicial, movimientos, td, th, saldoFinal: saldo };
}

function cuentasConMovimiento(hasta) {
  const ids = new Set();
  for (const a of S.lista) if (a.fecha <= hasta) for (const l of a.lineas) ids.add(l.cuenta);
  return S.cuentas.filter((c) => ids.has(c.id));
}

function disponible(hasta) {
  const datos = saldosPeriodo(hasta.slice(0, 4) + "-01-01", hasta);
  return datos.cuentas.filter((x) => x.cuenta.tipo === "ACTIVO" && /^(caja|banco)/i.test(x.cuenta.nombre)).reduce((s, x) => s + x.debe - x.haber, 0);
}

function movimientosPorCuenta() {
  const usadas = new Set();
  for (const a of S.lista) for (const l of a.lineas) usadas.add(l.cuenta);
  return usadas;
}

function cuentaDesdeTexto(texto) {
  const t = texto.trim();
  if (!t) return "";
  const cod = t.split(/[\s·]+/)[0];
  const imputables = S.cuentas.filter((c) => c.imputable);
  let c = imputables.find((x) => x.codigo === cod) || imputables.find((x) => etiquetaCuenta(x) === t);
  if (!c) { const m = imputables.filter((x) => x.nombre.toLowerCase() === t.toLowerCase()); if (m.length === 1) c = m[0]; }
  return c ? c.id : "";
}

function totalesEdicion() {
  let d = 0, h = 0, malo = false;
  for (const l of S.edit.lineas) {
    const vd = parseMonto(l.debe), vh = parseMonto(l.haber);
    if (Number.isNaN(vd) || Number.isNaN(vh)) malo = true; else { d += vd; h += vh; }
  }
  return { d, h, malo };
}

function actualizarCuadre() {
  if (!S.edit || !$("#cuadre")) return;
  const { d, h, malo } = totalesEdicion();
  $("#t-debe").textContent = clp(d); $("#t-haber").textContent = clp(h);
  const el = $("#cuadre");
  if (malo) { el.textContent = "· hay montos no válidos"; el.className = "cuadre neg"; }
  else if (d === h && d > 0) { el.textContent = "· cuadrado"; el.className = "cuadre ok"; }
  else { el.textContent = `· diferencia ${clp(d - h)}`; el.className = "cuadre neg"; }
}

function validarAsiento() {
  const ed = S.edit;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ed.fecha)) return "Ingresa una fecha válida.";
  if (!ed.glosa.trim()) return "La glosa es obligatoria.";
  const lineas = [];
  for (const [i, l] of ed.lineas.entries()) {
    const debe = parseMonto(l.debe), haber = parseMonto(l.haber);
    const vacia = !l.texto.trim() && !debe && !haber && !l.glosa.trim();
    if (vacia) continue;
    if (!l.cuenta) return `Línea ${i + 1}: elige una cuenta imputable del plan.`;
    if (Number.isNaN(debe) || Number.isNaN(haber) || debe < 0 || haber < 0) return `Línea ${i + 1}: los montos deben ser números positivos.`;
    if (debe && haber) return `Línea ${i + 1}: usa solo Debe o solo Haber.`;
    if (!debe && !haber) return `Línea ${i + 1}: falta el monto.`;
    lineas.push({ cuenta: l.cuenta, glosa: l.glosa.trim(), debe, haber });
  }
  if (lineas.length < 2) return "El asiento necesita al menos dos líneas.";
  const d = lineas.reduce((s, l) => s + l.debe, 0), h = lineas.reduce((s, l) => s + l.haber, 0);
  if (d !== h) return `El asiento no cuadra: diferencia de $${clp(d - h)}.`;
  return lineas;
}

async function guardarAsiento(confirmado = false) {
  const r = validarAsiento();
  if (typeof r === "string") { aviso(r); return; }
  const ed = S.edit;
  if (ed.apertura && ed.cierre) { aviso("Un asiento no puede ser de apertura y de cierre a la vez."); return; }
  const afectados = mesesCerradosAfectados();
  if (afectados.length && !confirmado) { S.confirmar = "cerrado"; render(); $("#a-motivo")?.focus(); return; }
  const id = ed.id || nuevoId();
  const datos = { fecha: ed.fecha, glosa: ed.glosa.trim(), apertura: ed.apertura, cierre: ed.cierre, lineas: r, creado: ed.creado || Date.now() };
  await ocupado(async () => {
    const nuevo = numeroPrevisto(id, datos);
    await BD.setAsiento(S.eid, id, datos);
    if (afectados.length) {
      let descripcion = describirAsiento(nuevo, datos.fecha, datos.glosa);
      if (ed.id && (ed.fechaOriginal !== datos.fecha || ed.numero !== nuevo)) descripcion = `${describirAsiento(ed.numero, ed.fechaOriginal, ed.glosaOriginal)} → ${descripcion}`;
      await registrarCambio(ed.id ? "Modificación" : "Creación", descripcion, afectados, ed.motivo);
    }
    if (ed.rcvIds) await marcarCentralizados(ed.rcvIds, id);
    if (ed.sueldoIds) await marcarContabilizados("sueldos", ed.sueldoIds, id);
    if (ed.honorarioIds) await marcarContabilizados("honorarios", ed.honorarioIds, id);
    S.confirmar = null;
    S.filtros.anio = ed.fecha.slice(0, 4);
    S.edit = null;
    ir(ed.rcvIds ? "rcv" : ed.sueldoIds ? "sueldos" : ed.honorarioIds ? "honorarios" : "asientos");
    aviso(`Asiento N° ${nuevo} guardado.`);
  }, "No se pudo guardar el asiento");
}

async function guardarCuenta() {
  const ce = S.cuentaEdit;
  const codigo = $("#c-codigo").value.trim(), nombre = $("#c-nombre").value.trim();
  const imputable = $("#c-imputable").checked, activa = $("#c-activa").checked, ocho = $("#c-ocho").checked;
  if (!/^\d+(\.\d+)*$/.test(codigo)) return aviso("El código debe tener el formato 1.1.01 (números separados por puntos).");
  if (!nombre) return aviso("El nombre es obligatorio.");
  const tipo = TIPO_POR_DIGITO[codigo[0]];
  if (!tipo) return aviso("El código debe comenzar con 1, 2, 3, 4 o 5.");
  if (S.cuentas.some((c) => c.codigo === codigo && c.id !== ce.id)) return aviso(`Ya existe la cuenta ${codigo}.`);
  const partes = codigo.split(".");
  if (partes.length > 1) {
    const padre = S.cuentas.find((c) => c.codigo === partes.slice(0, -1).join("."));
    if (!padre) return aviso(`Primero crea el grupo ${partes.slice(0, -1).join(".")}.`);
    if (padre.imputable) return aviso(`La cuenta ${padre.codigo} es imputable; no puede tener subcuentas.`);
  }
  const anterior = ce.id ? S.porId.get(ce.id) : null;
  const tieneHijas = anterior && S.cuentas.some((c) => c.codigo.startsWith(anterior.codigo + "."));
  if (anterior && tieneHijas && (codigo !== anterior.codigo || imputable)) return aviso("Esta cuenta tiene subcuentas: no se puede cambiar su código ni volverla imputable.");
  if (anterior && !imputable && movimientosPorCuenta().has(ce.id)) return aviso("La cuenta tiene movimientos: debe seguir siendo imputable.");
  if (anterior && anterior.tipo !== tipo && movimientosPorCuenta().has(ce.id)) return aviso("La cuenta tiene movimientos: no se puede cambiar a otro tipo (primer dígito).");
  const cuenta = { id: ce.id || "c" + nuevoId(), codigo, nombre, tipo, imputable, activa, resultados_en_ocho: tipo === "PATRIMONIO" && ocho };
  const cuentas = S.cuentas.filter((c) => c.id !== cuenta.id).concat(cuenta).sort(porCodigo);
  await ocupado(async () => {
    await BD.setEmpresa(S.eid, { ...empresa(), cuentas });
    S.cuentaEdit = null; render(); aviso(`Cuenta ${codigo} guardada.`);
  }, "No se pudo guardar la cuenta");
}

async function eliminarCuenta() {
  const ce = S.cuentaEdit;
  const c = S.porId.get(ce.id);
  if (!c) return;
  if (movimientosPorCuenta().has(c.id)) return aviso("La cuenta tiene movimientos: no se puede eliminar.");
  if (S.cuentas.some((x) => x.codigo.startsWith(c.codigo + "."))) return aviso("La cuenta tiene subcuentas: elimínalas primero.");
  await ocupado(async () => {
    await BD.setEmpresa(S.eid, { ...empresa(), cuentas: S.cuentas.filter((x) => x.id !== c.id) });
    S.cuentaEdit = null; render(); aviso(`Cuenta ${c.codigo} eliminada.`);
  }, "No se pudo eliminar la cuenta");
}

function leerEmpresa() {
  const d = {};
  for (const [k] of CAMPOS_EMPRESA) d[k] = $("#e-" + k).value.trim();
  d.ejercicio = parseInt($("#e-ejercicio").value, 10);
  if ($("#e-ultimo_folio")) {
    d.ultimo_folio = Number($("#e-ultimo_folio").value || 0);
    if (!Number.isInteger(d.ultimo_folio) || d.ultimo_folio < 0) return "El último folio debe ser un número entero, 0 o mayor.";
  }
  if (!d.razon_social) return "La razón social es obligatoria.";
  if (d.rut && !rutValido(d.rut)) return "El RUT no es válido (revisa el dígito verificador).";
  if (d.rut_representante && !rutValido(d.rut_representante)) return "El RUT del representante legal no es válido.";
  if (!(d.ejercicio >= 1900 && d.ejercicio <= 2100)) return "El ejercicio debe ser un año válido, por ejemplo 2026.";
  if (d.rut) d.rut = formatoRut(d.rut);
  if (d.rut_representante) d.rut_representante = formatoRut(d.rut_representante);
  return d;
}

function planBase() {

async function crearEmpresa() {
  const d = leerEmpresa();
  if (typeof d === "string") return aviso(d);
  if (d.rut && S.empresas.some((e) => e.rut === d.rut)) return aviso(`Ya existe una empresa con el RUT ${d.rut}.`);
  const id = "e" + nuevoId();
  await ocupado(async () => {
    await BD.setEmpresa(id, { ...d, cuentas: planBase(), creado: Date.now() });
    cambiarEmpresa(id); ir("inicio"); aviso(`Empresa ${d.razon_social} creada.`);
  }, "No se pudo crear la empresa");
}

async function guardarEmpresa() {
  const d = leerEmpresa();
  if (typeof d === "string") return aviso(d);
  if (d.rut && S.empresas.some((e) => e.rut === d.rut && e.id !== S.eid)) return aviso(`Ya existe otra empresa con el RUT ${d.rut}.`);
  await ocupado(async () => { await BD.setEmpresa(S.eid, { ...empresa(), ...d }); aviso("Datos de la empresa guardados."); }, "No se pudieron guardar los datos");
}

async function eliminarEmpresa() {
  const e = empresa();
  await ocupado(async () => {
    await BD.deleteEmpresa(e.id);
    S.confirmar = null; S.eid = null; recordar("empresa", null);
    ir("empresas"); aviso(`${e.razon_social} eliminada de la versión en línea.`);
  }, "No se pudo eliminar la empresa");
}

function leerArchivo(archivo) {
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const datos = JSON.parse(lector.result);
      if (datos.formato !== "contabilidad-completa/1" || !datos.empresa || !Array.isArray(datos.cuentas) || !Array.isArray(datos.asientos))
        throw new Error("El archivo no es una exportación del programa (Respaldos → «Descargar para la versión en línea»).");
      const anios = {};
      let descuadrados = 0;
      for (const a of datos.asientos) {
        anios[a.fecha.slice(0, 4)] = (anios[a.fecha.slice(0, 4)] || 0) + 1;
        const d = a.lineas.reduce((s, l) => s + l.debe, 0), h = a.lineas.reduce((s, l) => s + l.haber, 0);
        if (d !== h) descuadrados++;
      }
      const rut = datos.empresa.rut;
      S.importacion = { datos, descuadrados, repetida: !!rut && S.empresas.some((e) => e.rut === rut),
        resumenAnios: Object.entries(anios).sort().map(([y, n]) => `${y}: ${n}`).join(" · ") || "sin asientos" };
    } catch (err) {
      S.importacion = { error: err instanceof SyntaxError ? "El archivo no es un JSON válido." : err.message };
    }
    render();
  };
  lector.readAsText(archivo, "utf-8");
}

async function importar() {
  const imp = S.importacion;
  const { empresa: e, cuentas, asientos } = imp.datos;
  const eid = "e" + nuevoId();
  const mapa = new Map(cuentas.map((c) => [String(c.id), "c" + c.id]));
  const datosEmpresa = { razon_social: e.razon_social || "", rut: e.rut || "", giro: e.giro || "", direccion: e.direccion || "", comuna: e.comuna || "",
    representante: e.representante || "", rut_representante: e.rut_representante || "", regimen: e.regimen || "", ultimo_folio: +e.ultimo_folio || 0, ejercicio: +e.ejercicio || new Date().getFullYear(),
    creado: Date.now(), cerrados: imp.datos.cerrados || {}, tasa_ppm: +imp.datos.tasa_ppm || 0,
    tributarias: Object.fromEntries(Object.entries(imp.datos.tributarias || {}).map(([k, v]) => [k, "c" + v])),
    cuentas_rut: Object.fromEntries(Object.entries(imp.datos.cuentas_rut || {}).map(([k, v]) => [k, "c" + v])),
    cuentas: cuentas.map((c) => ({ id: mapa.get(String(c.id)), codigo: c.codigo, nombre: c.nombre, tipo: c.tipo, imputable: !!c.imputable, activa: c.activa !== false, resultados_en_ocho: !!c.resultados_en_ocho })) };
  imp.progreso = 0; render();
  try {
    await BD.setEmpresa(eid, datosEmpresa);
    for (const [i, a] of asientos.entries()) {
      await BD.setAsiento(eid, "a" + a.id, { fecha: a.fecha, glosa: a.glosa || "", apertura: !!a.apertura, cierre: !!a.cierre, creado: i + 1,
        lineas: a.lineas.map((l) => ({ cuenta: mapa.get(String(l.cuenta)) || "", glosa: l.glosa || "", debe: +l.debe || 0, haber: +l.haber || 0 })) });
      imp.progreso = i + 1;
      if (i % 10 === 9 && S.vista === "empresas") render();
    }
    for (const c of imp.datos.cambios || []) await S.almacen.set(`empresas/${eid}/cambios/${nuevoId()}`, c);
    for (const b of imp.datos.f29 || []) await S.almacen.set(`empresas/${eid}/f29/${b.periodo}`, { codigos: b.codigos, entradas: b.entradas, guardado_en: b.guardado_en });
    for (const x of imp.datos.socios || []) await S.almacen.set(`empresas/${eid}/socios/s${x.id}`, { nombre: x.nombre, rut: x.rut, sueldo_bruto: x.sueldo_bruto, activo: x.activo });
    for (const x of imp.datos.sueldos || []) await S.almacen.set(`empresas/${eid}/sueldos/s${x.socio}_${x.periodo}`, { ...x, socio: "s" + x.socio, asiento: x.asiento ? "a" + x.asiento : "" });
    for (const x of imp.datos.honorarios || []) await S.almacen.set(`empresas/${eid}/honorarios/h${x.id}`, { ...x, id: undefined, asiento: x.asiento ? "a" + x.asiento : "" });
    const utmNuevas = Object.fromEntries(Object.entries(imp.datos.utm || {}).filter(([k, v]) => UTM_OFICIALES[k] !== v && !S.utm[k]));
    if (Object.keys(utmNuevas).length) await S.almacen.set("config/utm", { valores: { ...S.utm, ...utmNuevas } });
    for (const d of imp.datos.rcv || []) await S.almacen.set(`empresas/${eid}/rcv/d${d.id}`, { ...d, id: undefined,
      cuenta: d.cuenta ? "c" + d.cuenta : "", asiento: d.asiento ? "a" + d.asiento : "" });
    S.importacion = null;
    cambiarEmpresa(eid); ir("inicio");
    aviso(`${e.razon_social} importada: ${asientos.length} asientos.`);
  } catch (err) {
    imp.progreso = null; render();
    aviso(`La importación se detuvo (${err?.code || err?.message || "error"}). La empresa quedó incompleta: elimínala y vuelve a importarla.`);
  }
}

const MESES_MIN = MESES.map((m) => m.toLowerCase());
function nombrePeriodo(p) { return `${MESES_MIN[+p.slice(5, 7) - 1]} ${p.slice(0, 4)}`; }
function cerrados() { return empresa()?.cerrados || {}; }
function mesCerrado(fecha) { return !!fecha && !!cerrados()[fecha.slice(0, 7)]; }
function mesesCerradosAfectados() {
  const ed = S.edit;
  if (!ed) return [];
  return [...new Set([ed.fecha, ed.fechaOriginal].filter(Boolean).map((f) => f.slice(0, 7)))].filter((p) => cerrados()[p]).sort();
}
function textoCerrados(periodos) {
  const nombres = periodos.map(nombrePeriodo).join(", ");
  return `${nombres.charAt(0).toUpperCase()}${nombres.slice(1)} ${periodos.length === 1 ? "está cerrado" : "están cerrados"}.`;
}
function describirAsiento(numero, fecha, glosa) { return `N° ${numero} del ${fmtFecha(fecha)} · ${glosa}`; }
function numeroPrevisto(id, d) {
  const lista = numerar(S.lista.filter((a) => a.id !== id).concat({ ...d, id }));
  return lista.find((a) => a.id === id)?.numero;
}
async function registrarCambio(accion, comprobante, periodos, motivo) {

}

async function cambiarMes(periodo, cerrar) {
  const actual = { ...cerrados() };
  if (cerrar) actual[periodo] = actual[periodo] || new Date().toISOString(); else delete actual[periodo];
  await ocupado(async () => {
    await BD.setEmpresa(S.eid, { ...empresa(), cerrados: actual });
    S.confirmar = null;
    aviso(`${nombrePeriodo(periodo).replace(/^./, (c) => c.toUpperCase())} ${cerrar ? "cerrado" : "reabierto"}.`);

async function cerrarHasta() {
  const anio = S.periodosAnio, hasta = +$("#per-hasta").value;

  for (let m = 1; m <= hasta; m++) { const p = `${anio}-${String(m).padStart(2, "0")}`; actual[p] = actual[p] || new Date().toISOString(); }

}

/* ------------------------------------------------------------------ cierre del ejercicio */
function cuentasPatrimonio() { return S.cuentas.filter((c) => c.tipo === "PATRIMONIO" && c.imputable); }
function cuentaResultadoSugerida() {
  const cs = cuentasPatrimonio();
  const exacta = cs.find((c) => c.codigo === "3.1.04");
  if (exacta) return exacta.id;
  for (const patron of [/resultado del ejercicio/i, /utilidad.*del ejercicio/i, /p[ée]rdida y ganancia/i, /utilidades? acumuladas?/i]) {
    const c = cs.find((x) => patron.test(x.nombre));
    if (c) return c.id;
  }
  return cs[0]?.id || "";
}
function cuentaPorNombre(patrones) {
  const cs = cuentasPatrimonio();
  for (const patron of patrones) { const c = cs.find((x) => patron.test(x.nombre)); if (c) return c.id; }
  return cuentaResultadoSugerida();
}
function asientoCierre(anio) { return S.lista.find((a) => a.cierre && a.fecha.startsWith(String(anio))); }

function lineasCierre(anio, destinoId) {
  const fin = `${anio}-12-31`;
  const inicio = [`${anio}-01-01`, corte(fin)].sort().at(-1);
  const netos = new Map();
  for (const a of S.lista) {
    if (a.cierre || a.fecha < inicio || a.fecha > fin) continue;
    for (const l of a.lineas) {
      const c = S.porId.get(l.cuenta);
      if (c && RESULTADO.has(c.tipo)) netos.set(c.id, (netos.get(c.id) || 0) + (l.debe || 0) - (l.haber || 0));
    }
  }
  const lineas = [];
  for (const [cuenta, neto] of netos) {
    if (neto > 0) lineas.push({ cuenta, glosa: "Cierre", debe: 0, haber: neto });
    else if (neto < 0) lineas.push({ cuenta, glosa: "Cierre", debe: -neto, haber: 0 });
  }
  const resultado = lineas.reduce((s, l) => s + l.debe - l.haber, 0);
  if (resultado > 0) lineas.push({ cuenta: destinoId, glosa: "Utilidad del ejercicio", debe: 0, haber: resultado });
  else if (resultado < 0) lineas.push({ cuenta: destinoId, glosa: "Pérdida del ejercicio", debe: -resultado, haber: 0 });
  return { lineas, resultado };
}

function propuestaApertura(anio, utilidad, perdida) {
  const anterior = +anio - 1;
  const bg = balanceGeneral(`${anterior}-12-31`);
  const saldos = saldosPeriodo(`${anterior}-01-01`, `${anterior}-12-31`);
  const netos = new Map();
  for (const x of saldos.cuentas) if (!RESULTADO.has(x.cuenta.tipo) && x.debe !== x.haber) netos.set(x.cuenta.id, x.debe - x.haber);
  if (!netos.size) throw new Error(`No hay saldos de cuentas de balance al 31/12/${anterior} para abrir ${anio}.`);
  const resultado = bg.resultado + bg.anterior;
  let destino = null;
  if (resultado) {
    destino = S.porId.get(resultado > 0 ? utilidad : perdida);
    if (!destino || destino.tipo !== "PATRIMONIO" || !destino.imputable) throw new Error("Selecciona una cuenta imputable de patrimonio para el resultado del año anterior.");
    netos.set(destino.id, (netos.get(destino.id) || 0) - resultado);
  }
  const orden = (ids) => ids.sort((a, b) => porCodigo(S.porId.get(a), S.porId.get(b)));
  const deudoras = orden([...netos.keys()].filter((id) => netos.get(id) > 0));
  const acreedoras = orden([...netos.keys()].filter((id) => netos.get(id) < 0));
  const lineas = [...deudoras.map((id) => ({ cuenta: id, debe: netos.get(id), haber: 0 })), ...acreedoras.map((id) => ({ cuenta: id, debe: 0, haber: -netos.get(id) }))];
  return { anio: +anio, anterior, lineas, total: lineas.reduce((s, l) => s + l.debe, 0), resultado, destino,
    totalActivo: bg.activo.total, totalPasivo: bg.pasivo.total, totalPatrimonio: bg.totalPatrimonio,
    existentes: S.lista.filter((a) => a.apertura && a.fecha.startsWith(String(anio))), glosa: `APERTURA CUENTAS DE BALANCE AÑO COMERCIAL ${anio}` };
}

function cargarFirma(archivo) {
  if (archivo.size > 5 * 1024 * 1024) return aviso("La imagen es demasiado grande (máximo 5 MB).");
  const url = URL.createObjectURL(archivo);
  const img = new Image();
  img.onload = () => {
    let ancho = Math.min(img.width, 800), dato = "";
    for (let i = 0; i < 4; i++) {
      const lienzo = document.createElement("canvas");
      lienzo.width = ancho; lienzo.height = Math.round(img.height * ancho / img.width);
      lienzo.getContext("2d").drawImage(img, 0, 0, lienzo.width, lienzo.height);
      dato = lienzo.toDataURL("image/png");
      if (dato.length < 180000) break;
      ancho = Math.round(ancho * 0.7);
    }
    URL.revokeObjectURL(url);
    guardarContador(dato);
  };
  img.onerror = () => { URL.revokeObjectURL(url); aviso("El archivo no es una imagen válida (usa PNG o JPG)."); };
  img.src = url;
}

}

class ErrorRcv extends Error {}
function normalizar(t) { return String(t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function enteroCsv(valor) {
  let t = String(valor ?? "").trim().replace(/\$/g, "").replace(/ /g, "");
  if (t === "" || t === "-") return 0;
  if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t.replace(",", "."));
  if (!Number.isFinite(n) || t === "") throw new ErrorRcv(`Monto inválido en el archivo: «${valor}».`);
  return redondearPar(n);
}
function fechaCsv(valor) {
  const t = String(valor || "").trim();
  let a, m, d, x = t.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
  if (x) { [d, m, a] = [+x[1], +x[2], +x[3]]; }
  else { x = t.slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!x) throw new ErrorRcv(`Fecha inválida en el archivo: «${valor}».`); [a, m, d] = [+x[1], +x[2], +x[3]]; }
  const f = new Date(Date.UTC(a, m - 1, d));
  if (f.getUTCFullYear() !== a || f.getUTCMonth() !== m - 1 || f.getUTCDate() !== d) throw new ErrorRcv(`Fecha inválida en el archivo: «${valor}».`);
  return f.toISOString().slice(0, 10);
}
function filasCsv(texto, sep) {
  const filas = []; let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else comillas = false; } else campo += c; }

const COLUMNAS_RCV = {

  razon_social: ["razon social"], folio: ["folio"], fecha: ["fecha docto", "fecha documento", "fecha emision"], exento: ["monto exento"],
  neto: ["monto neto"], iva_recuperable: ["monto iva recuperable"], iva: ["monto iva"], iva_no_recuperable: ["monto iva no recuperable"],
  total: ["monto total"], neto_activo_fijo: ["monto neto activo fijo"], otro_impuesto: ["valor otro impuesto", "valor otro imp"], sin_credito: ["impto sin derecho a credito"],

function leerResumen(filas, enc) {

    throw new ErrorRcv("Es un resumen de compras: para las compras importa el CSV de detalle, que trae cada documento.");
  const idx = {};
  for (const n of ["tipo documento", "total documentos", "monto exento", "monto neto", "monto iva", "monto total"]) {
    if (!enc.includes(n)) throw new ErrorRcv(`El resumen no tiene la columna «${n}».`);
    idx[n] = enc.indexOf(n);
  }
  const res = [];
  filas.slice(1).forEach((fila, i) => {
    if (!fila.some((c) => c.trim())) return;
    const codigo = (fila[idx["tipo documento"]] || "").match(/\((\d+)\)/);
    if (!codigo) return;
    try {
      const d = { tipo_doc: +codigo[1], cantidad: enteroCsv(fila[idx["total documentos"]]), exento: enteroCsv(fila[idx["monto exento"]]),
        neto: enteroCsv(fila[idx["monto neto"]]), iva: enteroCsv(fila[idx["monto iva"]]), total: enteroCsv(fila[idx["monto total"]]) };

function leerCsvRcv(texto) {
  if (!texto.trim()) throw new ErrorRcv("El archivo está vacío.");
  const primera = texto.split(/\r?\n/)[0] || "";
  const sep = (primera.match(/;/g) || []).length >= (primera.match(/,/g) || []).length ? ";" : ",";
  const filas = filasCsv(texto, sep);
  if (filas.length < 2) throw new ErrorRcv("El archivo no tiene documentos.");
  const enc = filas[0].map(normalizar);
  if (enc.includes("total documentos") && !enc.includes("rut proveedor") && !enc.includes("rut cliente")) return { registro: "RESUMEN", documentos: leerResumen(filas, enc) };
  const col = (clave, obligatoria = true) => {
    for (const c of COLUMNAS_RCV[clave]) if (enc.includes(c)) return enc.indexOf(c);
    if (obligatoria) throw new ErrorRcv(`No se encontró la columna «${COLUMNAS_RCV[clave][0]}». ¿Es el CSV de detalle del Registro de Compras y Ventas del SII?`);
    return null;
  };
  let registro, rutCol, ivaCol;
  if (col("rut_proveedor", false) != null) { registro = "COMPRA"; rutCol = col("rut_proveedor"); ivaCol = col("iva_recuperable"); }
  else if (col("rut_cliente", false) != null) { registro = "VENTA"; rutCol = col("rut_cliente"); ivaCol = col("iva"); }
  else throw new ErrorRcv("No se reconoce el archivo: debe tener la columna «RUT Proveedor» (compras) o «Rut cliente» (ventas), como el CSV del Registro de Compras y Ventas del SII.");
  const idx = Object.fromEntries(["tipo_doc", "razon_social", "folio", "fecha", "exento", "neto", "total"].map((k) => [k, col(k)]));
  const opc = Object.fromEntries(["iva_no_recuperable", "neto_activo_fijo", "otro_impuesto", "sin_credito"].map((k) => [k, col(k, false)]));
  const v = (fila, i) => (i != null && i < fila.length ? fila[i] : "");
  const documentos = [];
  filas.slice(1).forEach((fila, i) => {
    if (!fila.some((c) => c.trim())) return;
    let d;
    try {
      d = { tipo_doc: enteroCsv(v(fila, idx.tipo_doc)), rut: formatoRut(v(fila, rutCol).trim()), razon_social: v(fila, idx.razon_social).trim(),
        folio: v(fila, idx.folio).trim(), fecha: fechaCsv(v(fila, idx.fecha)), exento: enteroCsv(v(fila, idx.exento)), neto: enteroCsv(v(fila, idx.neto)),
        iva: enteroCsv(v(fila, ivaCol)), iva_no_recuperable: enteroCsv(v(fila, opc.iva_no_recuperable)),
        otros_impuestos: enteroCsv(v(fila, opc.otro_impuesto)) + enteroCsv(v(fila, opc.sin_credito)),
        total: enteroCsv(v(fila, idx.total)), activo_fijo: enteroCsv(v(fila, opc.neto_activo_fijo)) > 0 };
    } catch (e) { throw new ErrorRcv(`Fila ${i + 2}: ${e.message}`); }
    if (!d.folio) throw new ErrorRcv(`Fila ${i + 2}: falta el folio.`);
    d.otros_impuestos += d.total - (d.exento + d.neto + d.iva + d.iva_no_recuperable + d.otros_impuestos);

/* ------------------------------------------------------------------ documentos del RCV */
function docsPeriodo(periodo, registro) {
  return S.rcv.filter((d) => d.periodo === periodo && (!registro || d.registro === registro))
    .sort((a, b) => (a.registro < b.registro ? -1 : a.registro > b.registro ? 1 : 0) || (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0)
      || a.tipo_doc - b.tipo_doc || String(a.folio).localeCompare(String(b.folio)));
}
function pendiente(d) { return !d.asiento || !S.lista.some((a) => a.id === d.asiento); }
function totalesRcv(docs) {
  const t = { exento: 0, neto: 0, iva: 0, iva_no_recuperable: 0, otros_impuestos: 0, total: 0, cantidad: 0, pendientes: 0 };
  for (const d of docs) {
    const s = signoDoc(d.tipo_doc);
    for (const k of ["exento", "neto", "iva", "iva_no_recuperable", "otros_impuestos", "total"]) t[k] += s * (d[k] || 0);
    t.cantidad += d.cantidad || 1; t.pendientes += pendiente(d) ? 1 : 0;
  }
  return t;
}
function rutEmisor() { return empresa().rut || RUT_CONSUMIDOR_FINAL; }
function buscarDoc(registro, tipo, rut, folio, excepto) {
  return S.rcv.find((d) => d.registro === registro && +d.tipo_doc === +tipo && d.rut === rut && String(d.folio) === String(folio) && d.id !== excepto);
}
const guardarDoc = (id, d) => S.almacen.set(`empresas/${S.eid}/rcv/${id}`, d);

async function registrarResumen(periodo, tipo, cantidad, total, exento = 0, neto = null, iva = null) {
  if (!TIPOS_RESUMEN[tipo]) throw new ErrorRcv("Tipo de documento inválido para un resumen de ventas.");
  if (!(cantidad >= 1)) throw new ErrorRcv("Indica la cantidad de documentos emitidos en el mes.");
  if (!(total > 0)) throw new ErrorRcv("Indica el monto total del mes.");
  exento = exento || 0;
  if (BOLETAS_EXENTAS.has(tipo)) { exento = total; neto = 0; iva = 0; }
  else if (neto == null && iva == null) {
    if (!(exento >= 0 && exento <= total)) throw new ErrorRcv("El monto exento no puede ser mayor que el total.");
    neto = redondearPar((total - exento) / (1 + TASA_IVA)); iva = total - exento - neto;
  } else if (neto == null || iva == null) throw new ErrorRcv("Si ingresas el neto o el IVA, ingresa ambos.");
  if (exento + neto + iva !== total) throw new ErrorRcv(`Exento + neto + IVA ($${clp(exento + neto + iva)}) no coincide con el total ($${clp(total)}).`);
  const folio = `RESUMEN ${periodo}`;
  const existente = S.rcv.find((d) => d.registro === "VENTA" && +d.tipo_doc === tipo && d.folio === folio);
  if (existente && !pendiente(existente)) throw new ErrorRcv(`El resumen de ${TIPOS_RESUMEN[tipo].toLowerCase()} de ${nombrePeriodo(periodo)} ya está centralizado; elimina primero el asiento de centralización para cambiarlo.`);
  const base = existente || { registro: "VENTA", periodo, tipo_doc: tipo, folio, fecha: ultimoDia(periodo), razon_social: `Resumen ${TIPOS_RESUMEN[tipo].toLowerCase()}`,
    iva_no_recuperable: 0, otros_impuestos: 0, activo_fijo: false, cuenta: "", asiento: "" };
  await guardarDoc(existente?.id || "d" + nuevoId(), { ...base, cantidad, exento, neto, iva, total, rut: rutEmisor() });
}

async function importarArchivoRcv(archivo, base) {
  let periodo = base;
  const nombre = archivo.name.match(/_(\d{7,8})_(\d{4})(\d{2})\.csv$/i);
  let aviso_periodo = "";
  if (nombre) {
    const rutEmpresa = limpiarRut(empresa().rut).slice(0, -1);
    if (rutEmpresa && nombre[1] !== rutEmpresa)
      throw new ErrorRcv(`${archivo.name}: es del RUT ${clp(+nombre[1])} y la empresa activa es ${empresa().razon_social} (${empresa().rut}). No se importó: cambia a la empresa correcta en el selector del menú.`);
    const p = `${nombre[2]}-${nombre[3]}`;
    if (p !== periodo) { aviso_periodo = ` El archivo corresponde a ${nombrePeriodo(p)}; se importó en ese período.`; periodo = p; }
  }
  const { registro, documentos } = leerCsvRcv(textoArchivo(await archivo.arrayBuffer()));
  if (registro === "RESUMEN") {
    const resumenes = documentos.filter((d) => TIPOS_RESUMEN[d.tipo_doc]);
    for (const d of resumenes) {
      const ex = S.rcv.find((x) => x.registro === "VENTA" && +x.tipo_doc === d.tipo_doc && x.folio === `RESUMEN ${periodo}`);
      if (ex && !pendiente(ex)) throw new ErrorRcv(`El resumen de ${TIPOS_RESUMEN[d.tipo_doc].toLowerCase()} de ${nombrePeriodo(periodo)} ya está centralizado; elimina primero el asiento de centralización.`);
    }
    for (const d of resumenes) await registrarResumen(periodo, d.tipo_doc, d.cantidad, d.total, d.exento, d.neto, d.iva);
    let texto = resumenes.length ? `Resumen de ventas de ${nombrePeriodo(periodo)}: ${resumenes.length} tipo(s) de boletas o comprobantes de pago registrados.`
      : `El resumen de ventas de ${nombrePeriodo(periodo)} no trae boletas ni comprobantes de pago.`;
    if (documentos.length - resumenes.length) texto += ` Se omitieron ${documentos.length - resumenes.length} línea(s) de facturas o notas, que se importan con el CSV de detalle.`;
    return { periodo, texto: texto + aviso_periodo };
  }
  const habituales = empresa().cuentas_rut || {};
  let nuevos = 0;
  for (const d of documentos) {
    if (buscarDoc(registro, d.tipo_doc, d.rut, d.folio)) continue;
    const cuenta = habituales[`${registro}|${d.rut}`] || "";
    await guardarDoc("d" + nuevoId(), { ...d, registro, periodo, cantidad: 1, cuenta: S.porId.has(cuenta) ? cuenta : "", asiento: "" });
    nuevos++;
  }
  let texto = `${registro === "COMPRA" ? "Compras" : "Ventas"} de ${nombrePeriodo(periodo)}: ${nuevos} documento(s) importado(s).`;
  if (documentos.length - nuevos) texto += ` ${documentos.length - nuevos} ya estaban registrados y se omitieron.`;
  return { periodo, texto: texto + aviso_periodo };
}

async function importarArchivosRcv(archivos) {
  if (S.ocupado) return;
  S.ocupado = true;
  const mensajes = [], base = S.rcvPeriodo;
  let ultimo = base;
  try {
    for (const a of archivos) {
      try { const r = await importarArchivoRcv(a, base); mensajes.push(r.texto); ultimo = r.periodo; }
      catch (e) { mensajes.push(e instanceof ErrorRcv ? e.message : `${a.name}: no se pudo importar (${e?.code || e?.message || "error"}).`); }
    }
  } finally { S.ocupado = false; }
  S.rcvPeriodo = ultimo; S.rcvMensajes = mensajes; render();
}

function defectoDoc(d) {
  const t = cuentasTributarias();
  return d.registro === "COMPRA" ? (d.activo_fijo ? t.compras_activo_fijo : t.compras_neto) : (d.neto ? t.ventas_neto : t.ventas_exento);
}

/* Propuesta del asiento que centraliza los documentos pendientes del mes (no guarda nada). */
function propuestaCentralizacion(periodo, registro) {
  const docs = docsPeriodo(periodo, registro).filter(pendiente);
  const nombreRegistro = registro === "COMPRA" ? "compras" : "ventas";
  if (!docs.length) throw new ErrorRcv(`No hay documentos de ${nombreRegistro} pendientes de centralizar en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias();
  const cuenta = (k) => { if (!ct[k]) throw new ErrorRcv(`Falta configurar la cuenta «${CONCEPTOS[k][0]}» en Tributario → Cuentas tributarias.`); return ct[k]; };
  const netos = new Map();
  const sumar = (c, v) => netos.set(c, (netos.get(c) || 0) + v);
  const propia = (d) => (d.cuenta && S.porId.has(d.cuenta) ? d.cuenta : "");
  for (const d of docs) {
    const s = signoDoc(d.tipo_doc);
    if (registro === "COMPRA") {
      sumar(propia(d) || cuenta(d.activo_fijo ? "compras_activo_fijo" : "compras_neto"), s * (d.neto + d.exento + (d.iva_no_recuperable || 0)));
      if (d.iva) sumar(cuenta("iva_credito"), s * d.iva);
      if (d.otros_impuestos) sumar(cuenta("compras_otros_impuestos"), s * d.otros_impuestos);
      sumar(cuenta("proveedores"), -s * d.total);
    } else {
      sumar(cuenta(TIPOS_RESUMEN[d.tipo_doc] ? "ventas_boletas" : "clientes"), s * d.total);
      if (d.neto) sumar(propia(d) || cuenta("ventas_neto"), -s * d.neto);
      if (d.exento) sumar(propia(d) || cuenta("ventas_exento"), -s * d.exento);
      if (d.iva) sumar(cuenta("iva_debito"), -s * d.iva);
      if (d.otros_impuestos) sumar(cuenta("ventas_otros_impuestos"), -s * d.otros_impuestos);
    }
  }
  const orden = (ids) => ids.sort((a, b) => porCodigo(S.porId.get(a), S.porId.get(b)));
  const deudoras = orden([...netos.keys()].filter((c) => netos.get(c) > 0)), acreedoras = orden([...netos.keys()].filter((c) => netos.get(c) < 0));
  const lineas = [...deudoras.map((c) => ({ cuenta: c, debe: netos.get(c), haber: 0 })), ...acreedoras.map((c) => ({ cuenta: c, debe: 0, haber: -netos.get(c) }))];

    glosa: `CENTRALIZACIÓN ${registro === "COMPRA" ? "COMPRAS" : "VENTAS"} ${MESES[+periodo.slice(5) - 1].toUpperCase()} ${periodo.slice(0, 4)}` };
}

function centralizar(registro) {
  try {
    const p = propuestaCentralizacion(S.rcvPeriodo, registro);
    abrirPropuesta(p.fecha, p.glosa, p.lineas, `Centralización de ${p.cantidad} documento(s) de ${registro === "COMPRA" ? "compras" : "ventas"} de ${nombrePeriodo(p.periodo)}.`, { rcvIds: p.documentos });
  } catch (e) { aviso(e.message); }
}

/* Al registrar la centralización, los documentos quedan ligados al asiento; al eliminarlo, vuelven a quedar pendientes. */

}
async function liberarDocumentos(asientoId) {

}

function abrirDoc(id, registro) {
  if (id) {
    const d = S.rcv.find((x) => x.id === id);
    const montos = Object.fromEntries(["exento", "neto", "iva", "iva_no_recuperable", "otros_impuestos"].map((k) => [k, d[k] ? clp(d[k]) : ""]));
    S.docEdit = { id, registro: d.registro, editable: pendiente(d) && S.puedeEscribir, asiento: pendiente(d) ? "" : d.asiento, datos: { ...d, ...montos } };
  } else {
    S.docEdit = { id: null, registro, editable: true, datos: { tipo_doc: registro === "COMPRA" ? 33 : 33, folio: "", fecha: `${S.rcvPeriodo}-01`, rut: "", razon_social: "", cantidad: 1,
      exento: "", neto: "", iva: "", iva_no_recuperable: "", otros_impuestos: "", activo_fijo: false, cuenta: "" } };
  }
  S.confirmar = null; render(); $("#form-documento")?.scrollIntoView({ block: "start" });
}

function leerFormularioDoc() {
  const de = S.docEdit, d = de.datos;
  for (const k of ["tipo_doc", "folio", "fecha", "rut", "razon_social", "cantidad", "exento", "neto", "iva", "iva_no_recuperable", "otros_impuestos", "cuenta"]) { const el = $("#doc-" + k); if (el) d[k] = el.value; }
  const af = $("#doc-activo_fijo"); if (af) d.activo_fijo = af.checked;
}

async function guardarDocumento() {
  leerFormularioDoc();
  const de = S.docEdit, d = de.datos, registro = de.registro;
  const actual = de.id ? S.rcv.find((x) => x.id === de.id) : null;
  if (actual && !pendiente(actual)) return aviso("El documento ya está centralizado; elimina primero el asiento de centralización para poder modificarlo.");
  const tipo = parseInt(d.tipo_doc, 10);
  if (!(tipo >= 1 && tipo <= 999)) return aviso("Selecciona el tipo de documento.");
  const folio = String(d.folio || "").trim();
  if (!folio) return aviso("El folio es obligatorio.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha || "")) return aviso("Ingresa una fecha válida.");
  if (!rutValido(d.rut)) return aviso("El RUT no es válido (revisa el dígito verificador).");
  const rut = formatoRut(d.rut);
  const razon = String(d.razon_social || "").trim();
  if (!razon) return aviso("La razón social es obligatoria.");
  const montos = {};
  for (const k of ["exento", "neto", "iva", "iva_no_recuperable", "otros_impuestos"]) {
    const v = parseMonto(d[k]);
    if (Number.isNaN(v) || v < 0) return aviso("Los montos deben ser pesos enteros, sin decimales ni signo negativo.");
    montos[k] = v;
  }
  if (registro === "VENTA") montos.iva_no_recuperable = 0;
  const total = Object.values(montos).reduce((s, v) => s + v, 0);
  if (total <= 0) return aviso("El documento debe tener algún monto.");
  const cantidad = Math.max(parseInt(d.cantidad, 10) || 1, 1);
  if (buscarDoc(registro, tipo, rut, folio, de.id)) return aviso(`Ya existe ${nombreTipo(tipo).toLowerCase()} folio ${folio} del RUT ${rut}.`);
  const datos = { registro, periodo: actual?.periodo || S.rcvPeriodo, tipo_doc: tipo, folio, fecha: d.fecha, rut, razon_social: razon, ...montos, total,
    activo_fijo: registro === "COMPRA" && !!d.activo_fijo, cantidad, cuenta: d.cuenta || "", asiento: "" };
  await ocupado(async () => {
    await guardarDoc(de.id || "d" + nuevoId(), datos);
    S.docEdit = null; render(); aviso(de.id ? "Documento guardado." : "Documento agregado.");
  }, "No se pudo guardar el documento");
}

async function eliminarDocs(ids) {
  const borrables = ids.map((id) => S.rcv.find((d) => d.id === id)).filter((d) => d && pendiente(d));
  await ocupado(async () => {
    for (const d of borrables) await S.almacen.del(`empresas/${S.eid}/rcv/${d.id}`);
    S.rcvSel.clear(); S.docEdit = null; S.confirmar = null; render();
    aviso(`${borrables.length} documento(s) eliminado(s).`);
  }, "No se pudieron eliminar los documentos");
}

async function cambiarCuentaDoc(id, cuenta) {
  const d = S.rcv.find((x) => x.id === id);

  await ocupado(async () => {
    await guardarDoc(id, { ...d, cuenta });

}

function csvRcv() {
  const p = S.rcvPeriodo, filas = [["Registro", "Tipo", "Documento", "Folio", "Cantidad", "Fecha", "RUT", "Razón social", "Exento", "Neto", "IVA", "IVA no recuperable", "Otros impuestos", "Total", "Asiento"]];
  const asientos = [];
  for (const [registro, nombre] of [["COMPRA", "Compra"], ["VENTA", "Venta"]]) {
    for (const d of docsPeriodo(p, registro)) {
      const s = signoDoc(d.tipo_doc), a = pendiente(d) ? null : S.lista.find((x) => x.id === d.asiento);
      if (a && !asientos.includes(a)) asientos.push(a);
      filas.push([nombre, d.tipo_doc, nombreTipo(d.tipo_doc), d.folio, d.cantidad || 1, d.fecha, d.rut, d.razon_social,
        s * d.exento, s * d.neto, s * d.iva, s * (d.iva_no_recuperable || 0), s * (d.otros_impuestos || 0), s * d.total, a ? a.numero : "pendiente"]);
    }
  }
  filas.push([], ["ASIENTOS CONTABLES"], ["Asiento", "Fecha", "Glosa", "Estado", "Código", "Cuenta", "Debe", "Haber"]);
  const lineasCsv = (enc, fecha, glosa, lineas, estado) => { for (const l of lineas) { const c = S.porId.get(l.cuenta) || {}; filas.push([enc, fecha, glosa, estado, c.codigo, c.nombre, l.debe || 0, l.haber || 0]); } };
  for (const a of asientos) lineasCsv(a.numero, a.fecha, a.glosa, a.lineas, "registrado");
  for (const registro of ["COMPRA", "VENTA"]) {
    if (!docsPeriodo(p, registro).some(pendiente)) continue;
    try { const pr = propuestaCentralizacion(p, registro); lineasCsv("Propuesta", pr.fecha, pr.glosa, pr.lineas, "NO REGISTRADA"); } catch (_) {}
  }
  return { archivo: `rcv_${slug()}_${p}.csv`, filas };
}

const UTM_OFICIALES = {
  "2026-01": 69751, "2026-02": 69611, "2026-03": 69889, "2026-04": 69889, "2026-05": 70588,
  "2026-06": 71506, "2026-07": 71649, "2026-08": 71649, "2026-09": 71721, "2026-10": 72151,
};
/* Valor de la UTM del mes: el ingresado en el programa o, si no hay, el oficial cargado. */
function utm(periodo) { return S.utm[periodo] || UTM_OFICIALES[periodo] || null; }

/* ------------------------------------------------------------------ borrador del F29 */
const FACTURAS = new Set([29, 30, 33, 43, 45, 46]);
const BOLETAS = new Set([35, 39]);
const COMPROBANTES_PAGO = new Set([48]);
const NOTAS_DEBITO = new Set([55, 56, 111]);
const IMPORTACIONES = new Set([914]);

/* Aproximación desde 5 de a/b con enteros exactos (a, b ≥ 0). */
function divisionHaciaArriba(a, b) {
  const A = BigInt(a), B = BigInt(b), q = A / B, r = A - q * B;
  return Number(2n * r >= B ? q + 1n : q);
}
/* Remanente expresado en UTM con dos decimales, aproximando desde 5, como el SII (ver programa de escritorio). */
function reajustarRemanente(remanente, utmAnterior) {
  return divisionHaciaArriba(Math.round(remanente) * 10000, Math.round(utmAnterior * 100)) / 100;
}
/* UTM a pesos enteros, aproximando desde 5. */
function pesosDesdeUtm(cantidadUtm, valorUtm) {
  return divisionHaciaArriba(Math.round(cantidadUtm * 100) * Math.round(valorUtm * 100), 10000);
}

/* (debe, haber) de la cuenta en el mes. Con `excluirSoloIva` se omiten los asientos que solo usan esas cuentas. */
function movimientoMes(cuentaId, periodo, excluirSoloIva) {
  if (!cuentaId) return [0, 0];
  let d = 0, h = 0;
  const fin = ultimoDia(periodo);
  for (const a of S.lista) {
    if (a.fecha < `${periodo}-01` || a.fecha > fin) continue;
    if (excluirSoloIva && !a.lineas.some((l) => !excluirSoloIva.has(l.cuenta))) continue;
    for (const l of a.lineas) if (l.cuenta === cuentaId) { d += l.debe || 0; h += l.haber || 0; }
  }
  return [d, h];
}

/* Retenciones e impuesto único del mes según los módulos de remuneraciones (etapa 4). */
function totalesModulos(periodo) {
  const boletas = (S.honorarios || []).filter((b) => b.periodo === periodo);
  const liq = (S.sueldos || []).filter((l) => l.periodo === periodo);
  return { retencion_honorarios: boletas.reduce((s, b) => s + (b.retencion || 0), 0), boletas: boletas.length,
    impuesto_unico: liq.reduce((s, l) => s + (l.impuesto_unico || 0), 0), liquidaciones: liq.length };
}

function borradorF29(periodo) { return S.f29Borradores.find((b) => b.id === periodo) || null; }

function valoresInicialesF29(periodo) {
  const propio = borradorF29(periodo);
  if (propio) return { remanente_anterior: propio.entradas.remanente_anterior, utm_anterior: propio.entradas.utm_anterior, utm_actual: propio.entradas.utm_actual,
    origen_remanente: propio.entradas.origen_remanente || "borrador guardado" };
  const anterior = periodoAnterior(periodo);
  const previo = borradorF29(anterior);
  if (previo) return { remanente_anterior: previo.codigos["77"] || 0, utm_anterior: previo.entradas.utm_actual || utm(periodo), utm_actual: utm(periodoSiguiente(periodo)),
    origen_remanente: `código 77 del borrador de ${nombrePeriodo(anterior)}` };
  const cuenta = cuentasTributarias().remanente_iva;
  let remanente = 0;
  if (cuenta) { const m = libroMayor(cuenta, `${anterior}-01`, ultimoDia(anterior)); remanente = m ? Math.max(m.saldoFinal, 0) : 0; }
  const u = ultimoDia(anterior);
  return { remanente_anterior: remanente, utm_anterior: utm(periodo), utm_actual: utm(periodoSiguiente(periodo)),
    origen_remanente: `saldo contable de la cuenta de remanente al ${u.slice(8)}/${anterior.slice(5)}/${anterior.slice(0, 4)}` };
}

  ["total", "91", "TOTAL A PAGAR"],
];

function calcularF29(periodo, remanenteAnterior = 0, utmAnterior = null, utmActual = null) {
  const tasa = +(empresa().tasa_ppm || 0);
  const docs = docsPeriodo(periodo);
  const ventas = docs.filter((d) => d.registro === "VENTA"), compras = docs.filter((d) => d.registro === "COMPRA");
  const suma = (lista, tipos, cond = () => true) => {
    const el = lista.filter((d) => tipos.has(+d.tipo_doc) && cond(d));
    return [el.reduce((s, d) => s + (d.cantidad || 1), 0), el.reduce((s, d) => s + (d.iva || 0), 0)];
  };
  const c = {};
  [c["503"], c["502"]] = suma(ventas, FACTURAS);
  [c["110"], c["111"]] = suma(ventas, BOLETAS);
  [c["758"], c["759"]] = suma(ventas, COMPROBANTES_PAGO);
  [c["512"], c["513"]] = suma(ventas, NOTAS_DEBITO);
  [c["509"], c["510"]] = suma(ventas, NOTAS_CREDITO);
  c["538"] = c["502"] + c["111"] + c["759"] + c["513"] - c["510"];
  c["142"] = ventas.reduce((s, d) => s + signoDoc(d.tipo_doc) * (d.exento || 0), 0);
  const sinCredito = (d) => (d.iva_no_recuperable || 0) > 0 && !d.iva;
  [c["519"], c["520"]] = suma(compras, FACTURAS, (d) => !d.activo_fijo && !sinCredito(d));
  [c["524"], c["525"]] = suma(compras, FACTURAS, (d) => d.activo_fijo && !sinCredito(d));
  const afectasSin = compras.filter((d) => (d.iva_no_recuperable || 0) > 0);
  c["564"] = afectasSin.reduce((s, d) => s + (d.cantidad || 1), 0);
  c["521"] = afectasSin.reduce((s, d) => s + signoDoc(d.tipo_doc) * d.neto, 0);
  const exentas = compras.filter((d) => (d.exento || 0) > 0);
  c["584"] = exentas.reduce((s, d) => s + (d.cantidad || 1), 0);
  c["562"] = exentas.reduce((s, d) => s + signoDoc(d.tipo_doc) * d.exento, 0);
  [c["531"], c["532"]] = suma(compras, NOTAS_DEBITO);
  [c["527"], c["528"]] = suma(compras, NOTAS_CREDITO);
  [c["534"], c["535"]] = suma(compras, IMPORTACIONES);
  const remanente = Math.trunc(+remanenteAnterior || 0);
  let reajuste = 0, remanenteUtm = null;
  if (remanente && utmAnterior && utmActual) { remanenteUtm = reajustarRemanente(remanente, utmAnterior); reajuste = pesosDesdeUtm(remanenteUtm, utmActual) - remanente; }
  c["504"] = remanente + reajuste;
  c["537"] = c["520"] + c["525"] + c["532"] + c["535"] - c["528"] + c["504"];
  c["89"] = Math.max(c["538"] - c["537"], 0);
  c["77"] = Math.max(c["537"] - c["538"], 0);
  c["563"] = ventas.reduce((s, d) => s + signoDoc(d.tipo_doc) * (d.neto + d.exento), 0);
  c["115"] = tasa;
  c["62"] = Math.max(redondearPar(c["563"] * tasa / 100), 0);
  const ct = cuentasTributarias();
  c["151"] = movimientoMes(ct.retencion_honorarios, periodo)[1];
  c["48"] = movimientoMes(ct.impuesto_unico, periodo)[1];
  c["91"] = c["89"] + c["62"] + c["151"] + c["48"];

  const alertas = [];
  const pendientes = docs.filter(pendiente);
  if (pendientes.length) alertas.push(`Hay ${pendientes.length} documento(s) del RCV sin centralizar en ${nombrePeriodo(periodo)}.`);
  if (!docs.length) alertas.push(`No hay documentos del RCV importados para ${nombrePeriodo(periodo)}.`);
  const cuentasIva = new Set(["iva_debito", "iva_credito", "remanente_iva"].map((k) => ct[k]).filter(Boolean));
  const comparacion = [];
  if (ct.iva_debito) { const [d, h] = movimientoMes(ct.iva_debito, periodo, cuentasIva); comparacion.push(["IVA débito fiscal", c["538"], h - d]); }
  if (ct.iva_credito) { const [d, h] = movimientoMes(ct.iva_credito, periodo, cuentasIva); comparacion.push(["IVA crédito fiscal del mes", c["537"] - c["504"], d - h]); }
  const modulos = totalesModulos(periodo);
  if (modulos.boletas) comparacion.push(["Retención de honorarios (cód. 151)", modulos.retencion_honorarios, c["151"]]);
  if (modulos.liquidaciones) comparacion.push(["Impuesto único sueldo empresarial (cód. 48)", modulos.impuesto_unico, c["48"]]);
  for (const [concepto, rcv, cont] of comparacion)
    if (rcv !== cont) alertas.push(`${concepto}: el RCV indica $${clp(rcv)} y la contabilidad $${clp(cont)} (diferencia $${clp(rcv - cont)}).`);
  for (const k of ["iva_debito", "iva_credito"]) if (!ct[k]) alertas.push(`Falta configurar la cuenta «${CONCEPTOS[k][0]}» para comparar con la contabilidad.`);
  if (!tasa) alertas.push("La tasa de PPM es 0 %. Configúrala en Tributario → Cuentas tributarias.");
  if (remanente && !(utmAnterior && utmActual)) alertas.push("Ingresa la UTM del mes en que se presentó el F29 anterior y la del mes en que se presenta este F29, para reajustar el remanente.");
  return { periodo, codigos: c, alertas, comparacion, reajuste, remanenteUtm, documentos: docs.length, pendientes: pendientes.length,
    entradas: { remanente_anterior: remanente, utm_anterior: utmAnterior, utm_actual: utmActual, tasa_ppm: tasa } };
}

function parametrosF29() {
  if (!S.f29 || S.f29.eid !== S.eid) {
    const ej = String(empresa().ejercicio);
    const conDocs = S.rcv.map((d) => d.periodo).filter((p) => p.startsWith(ej)).sort();
    S.f29 = { eid: S.eid, periodo: S.rcvPeriodo && S.rcvPeriodoEid === S.eid ? S.rcvPeriodo : conDocs.at(-1) || periodoRcvInicial(), manual: null };
  }
  return S.f29;
}
const numeroF29 = (t, esUtm) => {
  const s = String(t ?? "").trim();
  if (!s) return null;
  const n = Number(s.replace(/\$/g, "").replace(/\./g, "").replace(",", "."));
  return Number.isFinite(n) ? (esUtm ? n : Math.round(n)) : NaN;
};

function resultadoF29() {
  const p = parametrosF29();
  const ini = valoresInicialesF29(p.periodo);
  const m = p.manual || {};
  const remanente = m.remanente_anterior ?? (ini.remanente_anterior || 0);

  r.entradas.origen_remanente = remanente !== (ini.remanente_anterior || 0) ? "ingresado manualmente" : ini.origen_remanente;

}

/* ------------------------------------------------------------------ remuneraciones: cálculos */
/* Impuesto Único de Segunda Categoría, tabla mensual en UTM: [hasta (décimas de UTM), factor (milésimas), rebaja (centésimas de UTM)]. */
const TRAMOS_IMPUESTO_UNICO = [[135, 0, 0], [300, 40, 54], [500, 80, 174], [700, 135, 449], [900, 230, 1114], [1200, 304, 1780], [3100, 350, 2332], [null, 400, 3882]];
/* Retención de honorarios según el año de emisión de la boleta (%). */
const TASAS_RETENCION = { 2020: 10.75, 2021: 11.5, 2022: 12.25, 2023: 13.0, 2024: 13.75, 2025: 14.5, 2026: 15.25, 2027: 16.0, 2028: 17.0 };
const TIPOS_BOLETA = { BHE: "Boleta de honorarios recibida", BTE: "Boleta de prestación de servicios de terceros emitida" };

/* Aproximación desde 5 de a/b con enteros exactos (b > 0; a puede ser negativo). */
function divisionRedondeada(a, b) {
  const A = BigInt(a), B = BigInt(b);
  if (A < 0n) return -divisionHaciaArriba(Number(-A), Number(B));
  return divisionHaciaArriba(Number(A), Number(B));
}

function impuestoUnico(base, valorUtm) {
  if (base <= 0) return 0;
  for (const [hasta, factor, rebaja] of TRAMOS_IMPUESTO_UNICO) {
    if (hasta === null || base * 10 <= hasta * valorUtm) {
      // base × factor − rebaja × UTM, en cien milésimas de peso
      return Math.max(divisionRedondeada(BigInt(base) * BigInt(factor) * 100n - BigInt(rebaja) * 1000n * BigInt(valorUtm), 100000), 0);
    }
  }
  return 0;
}
function calcularLiquidacion(bruto, afp, salud, valorUtm) {
  const base = bruto - afp - salud;
  if (base < 0) throw new ErrorRcv("Las cotizaciones no pueden superar el sueldo bruto.");
  const impuesto = impuestoUnico(base, valorUtm);
  return { bruto, afp, salud, base, utm: valorUtm, impuesto_unico: impuesto, liquido: base - impuesto };
}
function tasaRetencion(anio) {
  if (TASAS_RETENCION[anio] != null) return TASAS_RETENCION[anio];
  const anios = Object.keys(TASAS_RETENCION).map(Number);
  return anio > Math.max(...anios) ? TASAS_RETENCION[Math.max(...anios)] : TASAS_RETENCION[Math.min(...anios)];
}
/* [bruto, retención, líquido]. Con `esLiquido`, el monto es lo que se paga y el bruto es líquido / (1 − tasa). */
function calcularBoleta(monto, esLiquido, tasa) {
  const t = Math.round(tasa * 100); // centésimas de punto porcentual: 15,25 % → 1525 / 10000
  let bruto, retencion;
  if (esLiquido) { bruto = divisionRedondeada(BigInt(monto) * 10000n, 10000 - t); retencion = bruto - monto; }
  else { bruto = monto; retencion = divisionRedondeada(BigInt(monto) * BigInt(t), 10000); }
  return [bruto, retencion, bruto - retencion];
}
const mesMayus = (p) => `${MESES[+p.slice(5) - 1].toUpperCase()} ${p.slice(0, 4)}`;

function periodoRemuneraciones() {
  if (!S.remPeriodo || S.remPeriodoEid !== S.eid) {
    const ej = String(empresa().ejercicio);
    const usados = [...S.sueldos, ...S.honorarios].map((x) => x.periodo).filter((p) => p.startsWith(ej)).sort();
    S.remPeriodo = usados.at(-1) || periodoRcvInicial(); S.remPeriodoEid = S.eid;
  }
  return S.remPeriodo;
}
function contabilizado(x) { return !!x.asiento && S.lista.some((a) => a.id === x.asiento); }
async function guardarUtm(periodo, valor) {
  if (!Number.isInteger(valor) || valor < 1000 || valor > 1000000) throw new ErrorRcv("Ingresa el valor de la UTM en pesos, por ejemplo 72.151.");
  await S.almacen.set("config/utm", { valores: { ...S.utm, [periodo]: valor } });
  S.utm = { ...S.utm, [periodo]: valor };
}
function lineasNetas(netos) {
  const orden = (ids) => ids.sort((a, b) => porCodigo(S.porId.get(a), S.porId.get(b)));
  const deudoras = orden([...netos.keys()].filter((c) => netos.get(c) > 0)), acreedoras = orden([...netos.keys()].filter((c) => netos.get(c) < 0));
  return [...deudoras.map((c) => ({ cuenta: c, debe: netos.get(c), haber: 0 })), ...acreedoras.map((c) => ({ cuenta: c, debe: 0, haber: -netos.get(c) }))];
}
function cuentaConcepto(ct, k) { if (!ct[k]) throw new ErrorRcv(`Falta configurar la cuenta «${CONCEPTOS[k][0]}» en Tributario → Cuentas tributarias.`); return ct[k]; }

/* ------------------------------------------------------------------ sueldo empresarial */
const socioPorId = (id) => S.socios.find((s) => s.id === id);
function liquidacionesMes(periodo) {
  return S.sueldos.filter((l) => l.periodo === periodo).sort((a, b) => (socioPorId(a.socio)?.nombre || "").localeCompare(socioPorId(b.socio)?.nombre || ""));
}

function propuestaSueldos(periodo) {
  const pendientes = liquidacionesMes(periodo).filter((l) => !contabilizado(l));
  if (!pendientes.length) throw new ErrorRcv(`No hay liquidaciones de sueldo empresarial pendientes en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias(), netos = new Map(), sumar = (c, v) => netos.set(c, (netos.get(c) || 0) + v);
  for (const l of pendientes) {
    sumar(cuentaConcepto(ct, "sueldo_empresarial"), l.bruto);
    if (l.impuesto_unico) sumar(cuentaConcepto(ct, "impuesto_unico"), -l.impuesto_unico);
    if (l.afp) sumar(cuentaConcepto(ct, "afp_por_pagar"), -l.afp);
    if (l.salud) sumar(cuentaConcepto(ct, "salud_por_pagar"), -l.salud);
    sumar(cuentaConcepto(ct, "pago_sueldos"), -l.liquido);
  }
  return { ids: pendientes.map((l) => l.id), lineas: lineasNetas(netos), fecha: ultimoDia(periodo), glosa: `SUELDO EMPRESARIAL ${mesMayus(periodo)}`, cantidad: pendientes.length, periodo };
}

         <td class="num">${entrada("bruto", l ? l.bruto : s.sueldo_bruto)}</td><td class="num">${entrada("afp", l?.afp)}</td><td class="num">${entrada("salud", l?.salud)}</td>`}

async function guardarSocio() {
  const se = S.socioEdit;
  const nombre = $("#so-nombre").value.trim(), rut = $("#so-rut").value.trim(), sueldo = parseMonto($("#so-sueldo").value || "0");
  if (!nombre) return aviso("Ingresa el nombre del socio.");
  if (!rutValido(rut)) return aviso("El RUT del socio no es válido (revisa el dígito verificador).");
  if (Number.isNaN(sueldo) || sueldo < 0) return aviso("Sueldo bruto: ingresa un monto en pesos enteros, sin decimales.");
  const r = formatoRut(rut);
  if (S.socios.some((s) => s.rut === r && s.id !== se.id)) return aviso(`Ya existe un socio con el RUT ${r}.`);
  const activo = se.id ? $("#so-activo").checked : true;
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/socios/${se.id || "s" + nuevoId()}`, { nombre, rut: r, sueldo_bruto: sueldo, activo });
    S.socioEdit = null; render(); aviso("Socio guardado.");
  }, "No se pudo guardar el socio");
}

async function eliminarSocio(id) {
  if (S.sueldos.some((l) => l.socio === id)) { S.confirmar = null; render(); return aviso("El socio tiene liquidaciones registradas; desactívalo en lugar de eliminarlo."); }
  await ocupado(async () => { await S.almacen.del(`empresas/${S.eid}/socios/${id}`); S.confirmar = null; render(); aviso("Socio eliminado."); }, "No se pudo eliminar el socio");
}

async function liquidar() {
  const periodo = periodoRemuneraciones();
  const textoUtm = $("#rem-utm").value.trim();
  const elegidos = S.socios.filter((s) => $(`#li-incluir-${s.id}`)?.checked);
  const leer = (campo, s) => { const t = $(`#li-${campo}-${s.id}`)?.value.trim() || ""; return t ? parseMonto(t) : 0; };
  await ocupado(async () => {
    try {
      if (textoUtm) { const v = parseMonto(textoUtm); if (v !== utm(periodo)) await guardarUtm(periodo, v); }
      if (!elegidos.length) throw new ErrorRcv("Marca al menos un socio para calcular su liquidación.");
      const valorUtm = utm(periodo);
      if (!valorUtm) throw new ErrorRcv(`Falta el valor de la UTM de ${nombrePeriodo(periodo)}.`);
      const calculadas = [];
      for (const s of elegidos) {
        const bruto = leer("bruto", s), afp = leer("afp", s), salud = leer("salud", s);
        for (const [n, v] of [["Sueldo bruto", bruto], ["AFP", afp], ["Salud", salud]]) if (Number.isNaN(v) || v < 0) throw new ErrorRcv(`${n}: ingresa un monto en pesos enteros, sin decimales.`);
        if (bruto <= 0) throw new ErrorRcv(`${s.nombre}: el sueldo bruto debe ser mayor que cero.`);
        const actual = S.sueldos.find((l) => l.socio === s.id && l.periodo === periodo);
        if (actual && contabilizado(actual)) throw new ErrorRcv(`La liquidación de ${s.nombre} de ${nombrePeriodo(periodo)} ya está contabilizada; elimina primero su asiento para modificarla.`);
        calculadas.push([`${s.id}_${periodo}`, { socio: s.id, periodo, ...calcularLiquidacion(bruto, afp, salud, valorUtm), asiento: "" }]);
      }
      for (const [id, d] of calculadas) await S.almacen.set(`empresas/${S.eid}/sueldos/${id}`, d);
      render(); aviso(`Liquidaciones de ${nombrePeriodo(periodo)} calculadas.`);
    } catch (e) { if (e instanceof ErrorRcv) aviso(e.message); else throw e; }
  }, "No se pudieron guardar las liquidaciones");
}

/* ------------------------------------------------------------------ honorarios */
function boletasMes(periodo) {
  return S.honorarios.filter((b) => b.periodo === periodo).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : String(a.folio).localeCompare(String(b.folio))));
}
function propuestaHonorarios(periodo) {
  const pendientes = boletasMes(periodo).filter((b) => !contabilizado(b));
  if (!pendientes.length) throw new ErrorRcv(`No hay boletas de honorarios pendientes en ${nombrePeriodo(periodo)}.`);
  const ct = cuentasTributarias(), netos = new Map(), sumar = (c, v) => netos.set(c, (netos.get(c) || 0) + v);
  for (const b of pendientes) {
    sumar(cuentaConcepto(ct, "honorarios_gasto"), b.bruto);
    if (b.retencion) sumar(cuentaConcepto(ct, "retencion_honorarios"), -b.retencion);
    sumar(cuentaConcepto(ct, "honorarios_pago"), -b.liquido);
  }
  return { ids: pendientes.map((b) => b.id), lineas: lineasNetas(netos), fecha: ultimoDia(periodo), glosa: `HONORARIOS ${mesMayus(periodo)}`, cantidad: pendientes.length, periodo };
}
