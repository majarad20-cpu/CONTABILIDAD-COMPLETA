async function liquidarMes() {
  const periodo = periodoLiquidaciones(), textoUtm = $("#lq-utm").value.trim(), textoUf = $("#lq-uf").value.trim(), textoFest = $("#lq-festivos").value.trim();
  const elegidos = S.trabajadores.filter((t) => $(`#lq-incluir-${t.id}`)?.checked);
  await ocupado(async () => {
    try {
      if (textoUtm) { const v = parseMonto(textoUtm); if (v !== utm(periodo)) await guardarUtm(periodo, v); }
      if (textoUf) {
        const v = decimal(textoUf);
        if (!Number.isFinite(v) || v < 1000 || v > 1000000) throw new ErrorRcv("Ingresa el valor de la UF en pesos, por ejemplo 41.057,20.");
        if (v !== valorUf(periodo)) { S.prev = { ...S.prev, uf: { ...S.prev.uf, [periodo]: v } }; await S.almacen.set("config/previsional", S.prev); }
      }
      const festivos = textoFest ? Number(textoFest) : 0;
      if (!Number.isInteger(festivos) || festivos < 0 || festivos > 10) throw new ErrorRcv("Festivos del mes: ingresa un número entero, por ejemplo 1.");
      recordar("festivos-" + periodo, textoFest);
      if (!elegidos.length) throw new ErrorRcv("Marca al menos un trabajador para calcular su liquidación.");
      const leer = (campo, t) => { const x = $(`#lq-${campo}-${t.id}`)?.value.trim() || ""; return x ? parseMonto(x) : 0; };
      const calculadas = [];
      for (const t of elegidos) {
        const dias = Number($(`#lq-dias-${t.id}`).value), he = decimal($(`#lq-he-${t.id}`).value) ?? 0, he100 = decimal($(`#lq-he100-${t.id}`)?.value ?? "") ?? 0;
        if (!Number.isInteger(dias) || dias < 0 || dias > 30) throw new ErrorRcv(`${t.nombre}: los días trabajados van de 0 a 30.`);
        if (Number.isNaN(he) || he < 0 || Number.isNaN(he100) || he100 < 0) throw new ErrorRcv(`${t.nombre}: las horas extra deben ser un número, por ejemplo 4 o 2,5.`);
        const e = { dias, horas_extra: he, horas_extra_100: he100, festivos, comisiones: leer("comis", t), bonos: leer("bonos", t), no_imponibles: leer("noimp", t), anticipos: leer("ant", t), otros_desc: leer("otros", t) };
        for (const [n, x] of [["Comisiones", e.comisiones], ["Bonos", e.bonos], ["Haberes no imponibles", e.no_imponibles], ["Anticipos", e.anticipos], ["Otros descuentos", e.otros_desc]]) if (Number.isNaN(x) || x < 0) throw new ErrorRcv(`${t.nombre}: ${n}: ingresa un monto en pesos enteros, sin decimales.`);
        const actual = S.liquidaciones.find((l) => l.trabajador === t.id && l.periodo === periodo);
        if (actual && contabilizado(actual)) throw new ErrorRcv(`La liquidación de ${t.nombre} de ${nombrePeriodo(periodo)} ya está contabilizada; elimina primero su asiento para modificarla.`);
        calculadas.push([`${t.id}_${periodo}`, calcularLiquidacionTrabajador(t, periodo, e)]);
      }
      for (const [id, d] of calculadas) await S.almacen.set(`empresas/${S.eid}/liquidaciones/${id}`, d);
      render(); aviso(`Liquidaciones de ${nombrePeriodo(periodo)} calculadas.`);
    } catch (err) { if (err instanceof ErrorRcv) aviso(err.message); else throw err; }
  }, "No se pudieron guardar las liquidaciones");
}

    raiIni, raiIniReaj: Math.round(raiIni * (1 + V)), rai0, raiFinal: rai0 - sum("aRai"), sacIni: saiIni, sacIniReaj, sacAntes, creditos, sacFinal: sacAntes - creditos, exceso: sum("exceso"),
    aRai: sum("aRai"), aDdan: sum("aDdan"), aRex: sum("aRex") };
}

/* ---------- renta líquida imponible, impuesto y créditos ---------- */
function calcularRenta(r) {
  completarRenta(r);
  const anio = r.anio, er = estadoResultadosEmp(`${anio}-01-01`, `${anio}-12-31`), V = (r.vipc || 0) / 100;
  const cpt = calcularCpt(r), auto = esSimplificada() ? [] : ajustesAuto(r, cpt);
  const suma = (lista, tipo) => lista.filter((a) => a.tipo === tipo).reduce((s, a) => s + (a.monto || 0), 0);
  const autoOn = auto.filter((a) => a.activo);
  const agregadosAuto = suma(autoOn, "agregado"), deduccionesAuto = suma(autoOn, "deduccion");
  const agregados = agregadosAuto + suma(r.ajustes, "agregado"), deducciones = deduccionesAuto + suma(r.ajustes, "deduccion");
  const antes = er.resultado + agregados - deducciones;
  const perdidaReaj = Math.round((r.perdida_anterior || 0) * (1 + V));
  const perdidaUsada = antes > 0 ? Math.min(perdidaReaj, antes) : 0;
  const rli = Math.max(antes - perdidaUsada, 0);
  const perdidaSiguiente = perdidaReaj - perdidaUsada + (antes < 0 ? -antes : 0);
  const idpc = r.regimen === "d8" ? 0 : Math.round((rli * Math.round(r.tasa * 100)) / 10000);
  const ppm = ppmDelAnio(anio), ppmMonto = r.ppm_manual ?? ppm.total;
  const otros = r.creditos.reduce((s, c) => s + (c.monto || 0), 0), creditos = ppmMonto + otros;
  const atribuida = r.propietarios.map((p) => ({ ...p, monto: Math.round((rli * Math.round((p.porcentaje || 0) * 100)) / 10000) }));
  const reg = calcularRegistros(r, cpt, idpc);
  const c = { er, cpt, auto, autoOn, agregadosAuto, deduccionesAuto, agregados, deducciones, antes, perdidaReaj, perdidaUsada, rli, perdidaSiguiente, idpc, ppm, ppmMonto, otros, creditos,
    resultado: idpc - creditos, atribuida, reg, caja: baseCaja(r.regimen) && !esSimplificada() ? cuentasCaja(r) : [] };
  c.alertas = alertasRenta(r, c);
  return c;
}
function alertasRenta(r, c) {
  const a = esSimplificada() ? ["Contabilidad simplificada: la renta líquida se calcula con los montos del Libro de caja que afectan la base imponible (ingresos percibidos menos egresos pagados). Revisa la columna «Afecta base» de cada movimiento."] : [], necesitaVipc = c.cpt.inicial || r.perdida_anterior || c.reg.capitalIni || c.reg.rexIni || c.reg.raiIni || c.reg.sacIni || r.capital.movimientos.length || r.retiros.length;
  if (necesitaVipc && r.vipc == null) a.push("Falta la VIPC anual del año comercial (variación del IPC entre noviembre del año anterior y noviembre del año). Sin ella no se reajustan el capital propio inicial, la pérdida de arrastre ni los saldos de los registros: se asume 0 %.");
  if (c.ppm.desdeCaja && r.ppm_manual == null && (c.ppm.faltan.length || c.ppm.sinPeriodo)) a.push(`${c.ppm.faltan.length ? `No hay pago de PPM registrado en el libro de caja para los F29 de ${c.ppm.faltan.map((m) => mesCap(m)).join(", ")}. ` : ""}${c.ppm.sinPeriodo ? `Hay ${c.ppm.sinPeriodo} pago(s) de PPM sin período del F29: asígnalos con «Editar» en el libro de caja. ` : ""}El crédito por PPM puede estar incompleto; si no se pagó PPM esos meses, ignóralo.`);
  else if (!c.ppm.desdeCaja && c.ppm.faltan.length && r.ppm_manual == null) a.push(`No hay borrador de F29 guardado para ${c.ppm.faltan.map((m) => mesCap(m)).join(", ")}: el crédito por PPM puede estar incompleto. Guarda esos F29 o ingresa el PPM pagado a mano.`);
  if (r.regimen === "d8" && !r.propietarios.length) a.push("En el régimen transparente la renta se atribuye a los propietarios: agrégalos con su porcentaje.");
  if (r.regimen === "d8" && r.propietarios.length && Math.abs(r.propietarios.reduce((s, p) => s + (p.porcentaje || 0), 0) - 100) > 0.001) a.push("Los porcentajes de los propietarios no suman 100 %.");
  if (c.antes < 0) a.push(`El ejercicio termina con pérdida tributaria de $${clp(-c.antes)}; se arrastra a los años siguientes.`);
  if (S.activos.length && !cuentasTributarias().depreciacion_gasto) a.push("Hay fichas de activo fijo pero falta configurar la cuenta «Depreciación del ejercicio» en Cuentas tributarias: no se puede agregar la depreciación contable.");
  if (S.activos.length) {
    const dep = cuentasTributarias().depreciacion_acumulada, conc = dep ? datosLibroActivos(r.anio).conciliacion.find((x) => x.cuenta?.id === dep) : null;
    if (conc && conc.auxiliar !== conc.contable) a.push(`La depreciación acumulada contabilizada ($${clp(-conc.contable)}) difiere de la de las fichas ($${clp(-conc.auxiliar)}): el ajuste de activo fijo a valor tributario supone que la contabilidad sigue las fichas. Contabiliza la depreciación pendiente.`);
  }
  if (c.er.gastos.total && !c.er.ingresos.total) a.push("El ejercicio tiene gastos pero ningún ingreso registrado.");
  if (c.cpt.cpt < 0) a.push("El capital propio tributario es negativo: revisa el tratamiento de las cuentas y los ajustes a valor tributario.");
  if (c.reg.rai0 < 0 && r.regimen !== "d8") a.push("El saldo del RAI sale negativo: el capital propio es menor que el capital aportado más el REX. Revisa los ajustes del capital propio, el capital aportado y los saldos iniciales.");
  if (c.reg.exceso > 0) a.push(`Hay retiros por $${clp(c.reg.exceso)} que superan los saldos de los registros: se imputan al capital aportado o se tratan como retiros en exceso, según corresponda.`);
  if (r.regimen === "a" && S.activos.some((x) => x.dep_trib === "instantanea")) a.push("La depreciación instantánea de bienes del activo fijo se permite en el régimen Pro Pyme; en el 14 A revisa que corresponda.");
  return a;
}

  r.retiros = r.retiros.map((x, i) => ({ fecha: tx(`#rn-rt-fecha-${i}`, x.fecha), nombre: tx(`#rn-rt-nom-${i}`, x.nombre), rut: tx(`#rn-rt-rut-${i}`, x.rut), monto: m(`#rn-rt-monto-${i}`) ?? x.monto,
    pct: $(`#rn-rt-pct-${i}`) ? dc(`#rn-rt-pct-${i}`) : x.pct ?? null, credito: m(`#rn-rt-cred-${i}`) ?? (x.credito || 0) }));

    return `<h3>${rotulo}</h3>${filas ? `<div class="tabla"><table><tbody>${filas}</tbody></table></div>` : `<p class="ayuda">Sin ajustes.</p>`}${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-ajuste" data-id="${tipo}">+ Agregar</button></div>`)}`;
  };
  const auto = c.auto.length ? `<div class="tabla"><table><thead><tr><th></th><th>Ajuste</th><th>Efecto</th><th class="num">Monto</th></tr></thead><tbody>${c.auto.map((a) => `<tr class="${a.activo ? "" : "inactiva"}">
      <td><input type="checkbox" id="rn-au-${a.key}" ${a.activo ? "checked" : ""} ${S.puedeEscribir ? "" : "disabled"} aria-label="Aplicar ${esc(a.concepto)}"></td>
      <td>${esc(a.concepto)}<br><small class="ayuda">${esc(a.ref)}</small></td><td id="rn-au-tipo-${a.key}">${a.tipo === "agregado" ? "Agrega" : "Deduce"}</td><td class="num" id="rn-au-monto-${a.key}">${clp(a.monto)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="ayuda">No hay ajustes automáticos para este ejercicio.</p>`;
  const caja = baseCaja(r.regimen) ? `<h2>3. Conversión a base de caja (Pro Pyme)</h2>
    <p class="ayuda">El régimen Pro Pyme determina la renta con ingresos percibidos y egresos pagados. El programa parte de la contabilidad devengada y corrige por la variación del año de las cuentas que miden lo cobrado y lo pagado. Con «IVA» marcado, el monto se convierte a neto (÷ 1,19). Es una estimación: contrástala con los documentos del año.</p>
    ${c.caja.length ? `<div class="tabla"><table><thead><tr><th>Cuenta</th><th class="num">Saldo inicial</th><th class="num">Saldo final</th><th class="num">Variación</th><th>Incluir</th><th>Con IVA</th><th class="num">Efecto en la renta</th></tr></thead><tbody>
      ${c.caja.map((x) => `<tr><td>${esc(etiquetaCuenta(x.cuenta))}<br><small class="ayuda">${x.tipo === "activo" ? "Si sube, baja la renta" : "Si sube, sube la renta"}</small></td><td class="num">${clp(x.inicial)}</td><td class="num">${clp(x.final)}</td><td class="num">${clp(x.delta)}</td>
        <td><input type="checkbox" id="rn-cj-inc-${x.cuenta.id}" ${x.incluir ? "checked" : ""} ${S.puedeEscribir ? "" : "disabled"} aria-label="Incluir"></td>
        <td><input type="checkbox" id="rn-cj-iva-${x.cuenta.id}" ${x.iva ? "checked" : ""} ${S.puedeEscribir ? "" : "disabled"} aria-label="Con IVA"></td><td class="num" id="rn-cj-efecto-${x.cuenta.id}">${clp(x.efecto)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="ayuda">No hay cuentas por cobrar ni por pagar con movimiento.</p>`}
    ${puedeEditar(`<div class="barra"><label>Agregar otra cuenta de balance<select id="rn-caja-extra"><option value="">— Elegir —</option>${S.cuentas.filter((x) => x.imputable && (x.tipo === "ACTIVO" || x.tipo === "PASIVO") && !c.caja.some((y) => y.cuenta.id === x.id)).map((x) => `<option value="${esc(x.id)}">${esc(etiquetaCuenta(x))}</option>`).join("")}</select></label><button class="btn sec" type="button" data-n="rn-add-caja">Agregar</button></div>`)}` : "";
  return `<h2>1. Resultado del ejercicio</h2>
    <div class="tabla"><table><tbody><tr class="titulo"><td colspan="3">Ingresos</td></tr>${cuentas(c.er.ingresos)}<tr class="sub"><td colspan="2">Total ingresos</td><td class="num">${clp(c.er.ingresos.total)}</td></tr>
      <tr class="titulo"><td colspan="3">Gastos</td></tr>${cuentas(c.er.gastos)}<tr class="sub"><td colspan="2">Total gastos</td><td class="num">${clp(c.er.gastos.total)}</td></tr>
      <tr class="total"><td colspan="2">${c.er.resultado < 0 ? "Pérdida" : "Utilidad"} del ejercicio</td><td class="num">${clp(c.er.resultado)}</td></tr></tbody></table></div>
    <h2>2. Ajustes automáticos</h2>
    <p class="ayuda">Salen de la contabilidad y de las fichas de activo fijo. Desmarca los que no correspondan.</p>${auto}
    ${caja}
    <h2>${baseCaja(r.regimen) ? "4" : "3"}. Otros ajustes manuales</h2>
    <datalist id="dl-agregado">${AJUSTES_SUGERIDOS.agregado.map((x) => `<option value="${esc(x)}">`).join("")}</datalist><datalist id="dl-deduccion">${AJUSTES_SUGERIDOS.deduccion.map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
    ${bloqueManual("agregado", "Agregados (aumentan la renta)")}${bloqueManual("deduccion", "Deducciones (la disminuyen)")}
    <h2>${baseCaja(r.regimen) ? "5" : "4"}. Pérdida tributaria de años anteriores</h2>
    <div class="form"><label>Pérdida al 31/12/${r.anio - 1}, valor histórico ($)<input id="rn-perdida" inputmode="numeric" value="${r.perdida_anterior ? clp(r.perdida_anterior) : ""}" ${inputRo()}>
      <small>${rentaPrevia(r.anio)?.perdida_siguiente ? `Según el borrador guardado de ${r.anio - 1}: $${clp(rentaPrevia(r.anio).perdida_siguiente)}.` : "Si no hay borrador del año anterior, ingrésala a mano."}</small></label></div>
    <div id="rn-calculo">${htmlCalculoRenta(r, c)}</div>
    <h2>${baseCaja(r.regimen) ? "6" : "5"}. Créditos</h2>
    <div class="form"><label>PPM pagados en el año ($)<input id="rn-ppm" inputmode="numeric" placeholder="${clp(c.ppm.total)}" value="${r.ppm_manual == null ? "" : clp(r.ppm_manual)}" ${inputRo()}>
      <small>Si lo dejas vacío se usan los F29 guardados: $${clp(c.ppm.total)} (código 62).</small></label></div>
    ${r.creditos.length ? `<div class="tabla"><table><tbody>${r.creditos.map((x, i) => `<tr><td><input id="rn-cr-con-${i}" value="${esc(x.concepto)}" placeholder="Ej. Crédito por capacitación SENCE" style="width:100%" ${inputRo()}></td>
      <td class="num"><input id="rn-cr-monto-${i}" class="monto" inputmode="numeric" value="${x.monto ? clp(x.monto) : ""}" ${inputRo()}></td><td>${puedeEditar(`<button class="btn enlace" type="button" data-n="rn-del-credito" data-id="${i}">Quitar</button>`)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-credito">+ Otro crédito</button></div>`)}
    <div id="rn-final">${htmlFinalRenta(r, c)}</div>
    <h2>${baseCaja(r.regimen) ? "7" : "6"}. Propietarios${r.regimen === "d8" ? " (atribución de la renta)" : ""}</h2>
    ${r.propietarios.length ? `<div class="tabla"><table><thead><tr><th>Nombre</th><th>RUT</th><th class="num">Participación (%)</th><th class="num">Renta atribuida</th><th></th></tr></thead><tbody>${r.propietarios.map((p, i) => `<tr>
      <td><input id="rn-pr-nom-${i}" value="${esc(p.nombre)}" ${inputRo()}></td><td><input id="rn-pr-rut-${i}" value="${esc(p.rut)}" ${inputRo()}></td>
      <td class="num"><input id="rn-pr-pct-${i}" class="monto" style="width:6em" inputmode="decimal" value="${comaDecimal(p.porcentaje)}" ${inputRo()}></td><td class="num" id="rn-pr-monto-${i}">${clp(c.atribuida[i]?.monto || 0)}</td>
      <td>${puedeEditar(`<button class="btn enlace" type="button" data-n="rn-del-prop" data-id="${i}">Quitar</button>`)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="ayuda">Sin propietarios registrados.</p>`}
    ${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-prop">+ Agregar propietario</button></div>`)}
    <label class="campo-largo">Observaciones<textarea id="rn-obs" rows="2" ${inputRo()}>${esc(r.observacion)}</textarea></label>`;
}

function cuerpoCpt(r, c) {
  const k = c.cpt;
  const filas = k.filas.map((x) => `<tr class="${x.trat === "excluir" ? "inactiva" : ""}"><td class="cod">${esc(x.cuenta.codigo)}</td><td>${esc(x.cuenta.nombre)}</td><td>${x.cuenta.tipo === "ACTIVO" ? "Activo" : "Pasivo"}</td><td class="num">${clp(x.final)}</td>
    <td><select id="rn-cpt-t-${x.cuenta.id}" ${S.puedeEscribir ? "" : "disabled"} aria-label="Tratamiento de ${esc(x.cuenta.nombre)}"><option value="incluir" ${x.trat === "incluir" ? "selected" : ""}>${x.cuenta.tipo === "ACTIVO" ? "Inversión efectiva" : "Pasivo exigible"}</option><option value="excluir" ${x.trat === "excluir" ? "selected" : ""}>Excluir (intangible, nominal o transitorio)</option></select></td>
    <td class="num"><input id="rn-cpt-aj-${x.cuenta.id}" class="monto" inputmode="numeric" value="${x.ajuste ? clp(x.ajuste) : ""}" ${inputRo()} aria-label="Ajuste a valor tributario"></td><td class="num" id="rn-cpt-valor-${x.cuenta.id}">${clp(x.valor)}</td></tr>`).join("");
  return `<h2>Capital propio tributario al 31/12/${r.anio}</h2>
    <p class="ayuda">Capital propio tributario = activos que representan inversión efectiva, a valor tributario, menos el pasivo exigible (art. 41 N° 1 LIR). Quedan fuera los valores intangibles, nominales, transitorios y de orden. El programa parte del balance, propone el tratamiento de cada cuenta por su nombre y calcula el ajuste de los bienes del activo fijo con las fichas. Si una cuenta tiene otro valor tributario, anota la diferencia en «Ajuste». Si es negativo, se informa como CPT negativo.</p>
    ${k.filas.length ? `<div class="tabla"><table><thead><tr><th>Código</th><th>Cuenta</th><th>Tipo</th><th class="num">Saldo contable</th><th>Tratamiento</th><th class="num">Ajuste a valor tributario</th><th class="num">Valor tributario</th></tr></thead><tbody>${filas}</tbody></table></div>`
      : `<div class="caja vacio"><p>No hay saldos de balance en ${r.anio}.</p></div>`}
    <div class="form"><label class="check"><input type="checkbox" id="rn-cpt-af" ${r.cpt.af_auto ? "checked" : ""} ${S.puedeEscribir ? "" : "disabled"}> Ajustar el activo fijo a valor tributario según las fichas (depreciación tributaria)</label>
      <label>Capital propio tributario inicial ($, valor al 31/12/${r.anio - 1})<input id="rn-cpt-ini" inputmode="numeric" placeholder="${k.inicialPrevio != null ? clp(k.inicialPrevio) : "0"}" value="${r.cpt.inicial == null ? "" : clp(r.cpt.inicial)}" ${inputRo()}>
        <small>${k.inicialPrevio != null ? `Si lo dejas vacío se usa el del borrador guardado de ${r.anio - 1}.` : `No hay borrador de ${r.anio - 1}: ingrésalo a mano (negativo si el capital propio era negativo).`}</small></label></div>
    <div id="rn-cpt-res">${htmlResumenCpt(r, c)}</div>
    <p class="ayuda">El capital propio inicial reajustado se usa en el régimen 14 A para la corrección monetaria de la renta líquida imponible y, en los registros, para determinar el RAI. Guarda el borrador: el CPT al cierre pasa a ser el inicial del año siguiente.</p>`;
}

function cuerpoRegistros(r, c) {
  const g = c.reg, ro = inputRo();
  const previa = rentaPrevia(r.anio);
  const mov = (x, i) => `<tr><td><input type="date" id="rn-cm-fecha-${i}" value="${esc(x.fecha || "")}" ${ro}></td><td><input id="rn-cm-con-${i}" value="${esc(x.concepto || "")}" placeholder="Aporte, aumento o devolución de capital" style="width:100%" ${ro}></td>
    <td class="num"><input id="rn-cm-monto-${i}" class="monto" inputmode="numeric" value="${x.monto ? clp(x.monto) : ""}" ${ro}></td><td class="num"><input id="rn-cm-pct-${i}" class="monto" style="width:5.5em" inputmode="decimal" placeholder="${comaDecimal((g.movs[i]?.pct ?? 0).toFixed(2))}" value="${x.pct == null ? "" : comaDecimal(x.pct)}" ${ro}></td>
    <td>${puedeEditar(`<button class="btn enlace" type="button" data-n="rn-del-capital" data-id="${i}">Quitar</button>`)}</td></tr>`;
  const ret = (x, i) => { const s = g.retiros.find((y) => y.i === i) || {}; return `<tr><td><input type="date" id="rn-rt-fecha-${i}" value="${esc(x.fecha || "")}" ${ro}></td><td><input id="rn-rt-nom-${i}" value="${esc(x.nombre || "")}" placeholder="Socio o accionista" ${ro}></td><td><input id="rn-rt-rut-${i}" value="${esc(x.rut || "")}" style="width:8.5em" ${ro}></td>
    <td class="num"><input id="rn-rt-monto-${i}" class="monto" inputmode="numeric" value="${x.monto ? clp(x.monto) : ""}" ${ro}></td><td class="num"><input id="rn-rt-pct-${i}" class="monto" style="width:5.5em" inputmode="decimal" placeholder="${comaDecimal((s.pct ?? 0).toFixed(2))}" value="${x.pct == null ? "" : comaDecimal(x.pct)}" ${ro}></td>
    <td class="num"><input id="rn-rt-cred-${i}" class="monto" inputmode="numeric" placeholder="${clp(s.sugerido || 0)}" value="${x.credito ? clp(x.credito) : ""}" ${ro}></td>
    <td>${puedeEditar(`<button class="btn enlace" type="button" data-n="rn-del-retiro" data-id="${i}">Quitar</button>`)}</td></tr>`; };
  const rex = (x, i) => `<tr><td><input id="rn-rx-con-${i}" value="${esc(x.concepto || "")}" placeholder="Ingreso no constitutivo de renta o renta exenta del año" style="width:100%" ${ro}></td>
    <td class="num"><input id="rn-rx-monto-${i}" class="monto" inputmode="numeric" value="${x.monto ? clp(x.monto) : ""}" ${ro}></td><td>${puedeEditar(`<button class="btn enlace" type="button" data-n="rn-del-rex" data-id="${i}">Quitar</button>`)}</td></tr>`;
  if (r.regimen === "d8") return `<h2>Registros de rentas empresariales</h2>${htmlRegistros(r, c)}`;
  return `<h2>Registros de rentas empresariales ${r.anio}</h2>
    <p class="ayuda">${r.regimen === "a" ? "Régimen 14 A: RAI, DDAN, REX y SAC." : "Régimen Pro Pyme general: RAI, REX y SAC (sin DDAN)."} El RAI se determina al cierre con el capital propio tributario (art. 14 LIR) y los retiros se imputan en orden cronológico al RAI, luego al DDAN y luego al REX. Los saldos iniciales se toman del borrador guardado del año anterior; en el primer año ingrésalos tú, tal como los propone el SII. Compara el resultado con los recuadros de registros del F22.</p>
    <div class="form"><label>RAI inicial ($)<input id="rn-rai-ini" inputmode="numeric" placeholder="${clp(previa?.rai_final ?? 0)}" value="${r.registros.rai_inicial == null ? "" : clp(r.registros.rai_inicial)}" ${ro}></label>
      <label>REX inicial ($)<input id="rn-rex-ini" inputmode="numeric" placeholder="${clp(previa?.rex_final ?? 0)}" value="${r.registros.rex_inicial == null ? "" : clp(r.registros.rex_inicial)}" ${ro}></label>
      <label>SAC inicial ($)<input id="rn-sac-ini" inputmode="numeric" placeholder="${clp(previa?.sac_final ?? 0)}" value="${r.registros.sac_inicial == null ? "" : clp(r.registros.sac_inicial)}" ${ro}></label>
      ${r.regimen === "a" ? `<label>DDAN ($)<input id="rn-ddan" inputmode="numeric" placeholder="${clp(ddanFichas(r.anio))}" value="${r.registros.ddan_manual == null ? "" : clp(r.registros.ddan_manual)}" ${ro}><small>Vacío: según las fichas con depreciación acelerada.</small></label>` : ""}
      <label>Otros saldos a deducir para el RAI ($)<input id="rn-otros-rai" inputmode="numeric" value="${r.registros.otros_rai ? clp(r.registros.otros_rai) : ""}" ${ro}><small>Solo si las instrucciones del F22 piden restar otras partidas.</small></label>
      <label class="check"><input type="checkbox" id="rn-rex-reaj" ${r.registros.reajusta_rex ? "checked" : ""} ${S.puedeEscribir ? "" : "disabled"}> Reajustar el REX inicial con la VIPC</label></div>
    ${previa ? puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-traer-previos">Usar los saldos finales de ${r.anio - 1}</button></div>`) : ""}
    <h3>Capital aportado</h3>
    <div class="form"><label>Capital aportado inicial ($)<input id="rn-cap-ini" inputmode="numeric" placeholder="${clp(previa?.capital_final ?? 0)}" value="${r.capital.inicial == null ? "" : clp(r.capital.inicial)}" ${ro}></label></div>
    ${r.capital.movimientos.length ? `<div class="tabla"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Monto (aumento +, disminución −)</th><th class="num">Reajuste %</th><th></th></tr></thead><tbody>${r.capital.movimientos.map(mov).join("")}</tbody></table></div>` : ""}
    ${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-capital">+ Aumento o disminución de capital</button></div>`)}
    <h3>Ingresos del año para el REX</h3>
    ${r.registros.rex_ingresos.length ? `<div class="tabla"><table><tbody>${r.registros.rex_ingresos.map(rex).join("")}</tbody></table></div>` : `<p class="ayuda">Sin ingresos no constitutivos de renta ni rentas exentas en el año.</p>`}
    ${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-rex">+ Ingreso para el REX</button></div>`)}
    <h3>Retiros, remesas y distribuciones del año</h3>
    ${r.retiros.length ? `<div class="tabla"><table><thead><tr><th>Fecha</th><th>Beneficiario</th><th>RUT</th><th class="num">Monto</th><th class="num">Reajuste %</th><th class="num">Crédito del SAC ($)</th><th></th></tr></thead><tbody>${r.retiros.map(ret).join("")}</tbody></table></div>` : `<p class="ayuda">Sin retiros en el año.</p>`}
    ${puedeEditar(`<div class="acciones"><button class="btn sec" type="button" data-n="rn-add-retiro">+ Retiro o distribución</button></div>`)}
    <p class="ayuda">El reajuste de cada retiro y de cada movimiento de capital va con la variación del IPC entre el mes anterior al movimiento y el mes anterior al cierre; si lo dejas vacío se estima proporcional a los meses restantes con la VIPC anual. El crédito del SAC por cada retiro se calcula con las reglas de los arts. 56 y 63 de la LIR; el valor sugerido es proporcional (saldo del SAC ÷ RAI) y debes confirmarlo.</p>
    <h3>Saldos al cierre</h3><div id="rn-registros">${htmlRegistros(r, c)}</div>`;
}

/* ---------- actualización en pantalla sin volver a dibujar los campos ---------- */
function actualizarRenta() {
  leerFormularioRenta();
  const r = S.rentaEdit, c = calcularRenta(r);
  const poner = (id, html) => { const el = $("#" + id); if (el) el.innerHTML = html; };
  poner("rn-tarjetas", htmlTarjetasRenta(r, c)); poner("rn-calculo", htmlCalculoRenta(r, c)); poner("rn-final", htmlFinalRenta(r, c)); poner("rn-cpt-res", htmlResumenCpt(r, c)); poner("rn-registros", htmlRegistros(r, c));
  for (const a of c.auto) { const m = $(`#rn-au-monto-${a.key}`), t = $(`#rn-au-tipo-${a.key}`); if (m) m.textContent = clp(a.monto); if (t) t.textContent = a.tipo === "agregado" ? "Agrega" : "Deduce"; }
  for (const x of c.caja) { const e = $(`#rn-cj-efecto-${x.cuenta.id}`); if (e) e.textContent = clp(x.efecto); }
  for (const x of c.cpt.filas) { const e = $(`#rn-cpt-valor-${x.cuenta.id}`); if (e) e.textContent = clp(x.valor); }
  c.atribuida.forEach((p, i) => { const el = $(`#rn-pr-monto-${i}`); if (el) el.textContent = clp(p.monto); });
  const t = pestanaActual("renta", "rli");
  const inf = () => ({ rli: informeRenta, cpt: informeCpt, registros: informeRegistros }[t] || informeRenta)(r);
  S.informe = inf; S.csv = csvDeInforme(inf());
}
function csvDeInforme(inf) {
  return { archivo: `${inf.nombre}_${slug()}.csv`, filas: [inf.columnas.map((c) => c.titulo), ...inf.filas.map((f) => f.valores.map((v) => (Array.isArray(v) ? v[0] : v ?? "")))] };
}

/* ---------- informes ---------- */
function informeRenta(r) {
  const c = calcularRenta(r);
  const inf = new Informe("RENTA LÍQUIDA IMPONIBLE E IMPUESTO DE PRIMERA CATEGORÍA", `AÑO COMERCIAL ${r.anio} · AÑO TRIBUTARIO ${r.anio + 1} · ${REGIMENES_RENTA[r.regimen][0].toUpperCase()}`,
    [col("Concepto", 62), col("Monto", 18, "monto")], `renta_anual_${r.anio}`, { firmas: ["CONTADOR GENERAL", "REPRESENTANTE LEGAL"] });
  const sec = (t) => inf.agregar([t], { estilo: "seccion", abarca: 0 });
  sec("Resultado del ejercicio");
  inf.agregar(["Ingresos", c.er.ingresos.total]); inf.agregar(["Gastos", c.er.gastos.total]); inf.agregar([c.er.resultado < 0 ? "Pérdida del ejercicio" : "Utilidad del ejercicio", c.er.resultado], { estilo: "subtotal" });
  sec("Renta líquida imponible");
  inf.agregar(["Resultado contable", c.er.resultado]);
  for (const a of c.autoOn) inf.agregar([`${a.tipo === "agregado" ? "(+)" : "(−)"} ${a.concepto}`, a.monto]);
  for (const a of r.ajustes) inf.agregar([`${a.tipo === "agregado" ? "(+)" : "(−)"} ${a.concepto || "(sin detalle)"}`, a.monto]);
  inf.agregar(["Renta líquida imponible antes de la pérdida", c.antes], { estilo: "subtotal" });
  if (c.perdidaUsada) inf.agregar(["(−) Pérdida tributaria de años anteriores imputada (reajustada)", c.perdidaUsada]);
  inf.agregar(["RENTA LÍQUIDA IMPONIBLE", c.rli], { estilo: "total" });
  sec("Impuesto y créditos");
  inf.agregar([`Impuesto de primera categoría (${comaDecimal(r.tasa)} %)`, c.idpc]);
  inf.agregar(["(−) Pagos provisionales mensuales (PPM)", sinCeros(c.ppmMonto)]); for (const x of r.creditos) inf.agregar([`(−) ${x.concepto || "Otro crédito"}`, x.monto]);
  inf.agregar([c.resultado < 0 ? "DEVOLUCIÓN ESTIMADA" : "SALDO A PAGAR", Math.abs(c.resultado)], { estilo: "destacado" });

function filas1887(anio) {

    filas.push({ rut: t.rut, nombre: t.nombre, tipo: "Trabajador", periodo: l.periodo, imponible: l.imponible, no_imponible: l.no_imponible, cotizaciones: l.afp + l.salud + l.cesantia, tributable: l.base_tributable, impuesto: l.impuesto_unico, liquido: l.liquido });
  }
  for (const q of S.finiquitos.filter((x) => x.fecha.startsWith(y))) {

function perceptores1887(anio) {
  const m = new Map();
  for (const f of filas1887(anio)) {
    const x = m.get(f.rut) || { rut: f.rut, nombre: f.nombre, tipo: f.tipo, meses: 0, imponible: 0, no_imponible: 0, cotizaciones: 0, tributable: 0, impuesto: 0, liquido: 0 };

    m.set(f.rut, x);

  return [...m.values()].sort((a, b) => a.nombre.localeCompare(b.nombre));
}
function filas1879(anio) { return S.honorarios.filter((b) => b.tipo === "BHE" && b.fecha.startsWith(String(anio))); }
function prestadores1879(anio) {
  const m = new Map();
  for (const b of filas1879(anio)) {

/* ------------------------------------------------------------------ respaldo y restauración */
const FORMATO_RESPALDO = "contabilidad-completa-artefacto/1";
const ID_VALIDO = /^[A-Za-z0-9_-]+$/;
S.restauracion = null;

/* Todos los datos de la empresa activa, leídos de nuevo desde el almacén, más la configuración compartida. */
async function datosRespaldo() {
  const { id, ...empresaDoc } = empresa();
  const colecciones = {};
  for (const sub of SUBCOLECCIONES) colecciones[sub] = await S.almacen.leerCol(`empresas/${id}/${sub}`);
  return { formato: FORMATO_RESPALDO, version: VERSION, creado: new Date().toISOString(), empresa: empresaDoc, colecciones,
    config: { utm: S.utm, previsional: S.prev, contador: S.contador } };
}
async function descargarRespaldo() {
  if (!S.descargas) return aviso("La descarga de archivos no está disponible en esta vista.");
  await ocupado(async () => {
    const d = await datosRespaldo();
    const total = Object.values(d.colecciones).reduce((s, l) => s + l.length, 0);
    try { await S.descargas.save({ filename: `respaldo_${slug()}_${hoy()}.json`, data: JSON.stringify(d) }); aviso(`Respaldo descargado: ${total} registros.`); }
    catch (e) { if (e?.code !== "declined") throw e; }
  }, "No se pudo generar el respaldo");
}

function panelRespaldo() {
  return `<section class="caja"><h2>Respaldo</h2>
    <p class="ayuda">Descarga todos los datos de ${esc(empresa().razon_social)} (plan de cuentas, asientos, RCV, F29, remuneraciones, activo fijo y renta) en un archivo .json. Guárdalo en un lugar seguro: sirve para recuperar la empresa si se elimina por error o se modifica algo sin querer.</p>
    <div class="acciones">${S.descargas ? `<button class="btn" type="button" data-n="descargar-respaldo">Descargar respaldo</button>` : `<span class="ayuda">La descarga de archivos no está disponible en esta vista.</span>`}</div></section>`;
}

/* Valida el archivo antes de tocar nada: formato, identificadores y asientos que cuadran. */
function analizarRespaldo(texto) {
  let d;
  try { d = JSON.parse(texto); } catch (_) { return { error: "El archivo no es un JSON válido." }; }
  if (d?.formato !== FORMATO_RESPALDO || !d.empresa || typeof d.colecciones !== "object") return { error: "El archivo no es un respaldo de este artefacto (Datos de la empresa → «Descargar respaldo»)." };
  if (!d.empresa.razon_social || !Array.isArray(d.empresa.cuentas)) return { error: "El respaldo está incompleto: faltan los datos de la empresa o su plan de cuentas." };
  const colecciones = {};
  for (const sub of SUBCOLECCIONES) {
    const lista = d.colecciones[sub] ?? [];
    if (!Array.isArray(lista)) return { error: `El respaldo está dañado: «${sub}» no es una lista.` };
    for (const x of lista) if (!x || typeof x.id !== "string" || !ID_VALIDO.test(x.id)) return { error: `El respaldo está dañado: hay un registro de «${sub}» con identificador inválido.` };
    colecciones[sub] = lista;
  }
  const suma = (a, k) => (a.lineas || []).reduce((s, l) => s + (+l[k] || 0), 0);
  const descuadrados = colecciones.asientos.filter((a) => suma(a, "debe") !== suma(a, "haber")).length;
  const rut = d.empresa.rut, repetida = rut ? S.empresas.find((e) => e.rut === rut) : null;
  return { datos: { ...d, colecciones }, total: Object.values(colecciones).reduce((s, l) => s + l.length, 0), descuadrados, repetida: repetida?.id || null, progreso: null };
}
function leerRespaldo(archivo) {
  if (archivo.size > 50 * 1024 * 1024) { S.restauracion = { error: "El archivo es demasiado grande para un respaldo." }; render(); return; }
  const lector = new FileReader();
  lector.onload = () => { S.restauracion = analizarRespaldo(String(lector.result)); render(); };
  lector.onerror = () => { S.restauracion = { error: "No se pudo leer el archivo." }; render(); };
  lector.readAsText(archivo, "utf-8");
}

/* Con `reemplazar` se vacía la empresa existente con el mismo RUT (sin borrarla, para no perder la selección) y se escribe el respaldo. */
async function restaurar(reemplazar) {
  const r = S.restauracion, d = r.datos;
  if (r.repetida && !reemplazar) return;
  const eid = reemplazar ? r.repetida : "e" + nuevoId();
  r.progreso = 0; render();
  try {
    if (reemplazar) for (const sub of SUBCOLECCIONES) for (const x of await S.almacen.leerCol(`empresas/${eid}/${sub}`)) await S.almacen.del(`empresas/${eid}/${sub}/${x.id}`);
    await BD.setEmpresa(eid, { ...d.empresa, creado: d.empresa.creado || Date.now() });
    let n = 0;
    for (const sub of SUBCOLECCIONES) for (const { id, ...doc } of d.colecciones[sub]) { await S.almacen.set(`empresas/${eid}/${sub}/${id}`, doc); r.progreso = ++n; if (n % 10 === 0 && S.vista === "empresas") render(); }
    const cfg = d.config || {};
    const utmNuevas = Object.fromEntries(Object.entries(cfg.utm || {}).filter(([k, v]) => Number.isFinite(+v) && UTM_OFICIALES[k] !== +v && !S.utm[k]).map(([k, v]) => [k, +v]));
    if (Object.keys(utmNuevas).length) { await S.almacen.set("config/utm", { valores: { ...S.utm, ...utmNuevas } }); S.utm = { ...S.utm, ...utmNuevas }; }
    const uf = { ...(cfg.previsional?.uf || {}), ...S.prev.uf };
    const propios = new Set((S.prev.parametros || []).map((x) => x.desde));
    const parametros = [...(S.prev.parametros || []), ...(cfg.previsional?.parametros || []).filter((x) => x && /^\d{4}-\d{2}$/.test(x.desde) && !propios.has(x.desde))];
    if (Object.keys(uf).length !== Object.keys(S.prev.uf).length || parametros.length !== (S.prev.parametros || []).length) { S.prev = { ...S.prev, uf, parametros }; await S.almacen.set("config/previsional", S.prev); }
    if (!S.contador.nombre && !S.contador.firma && cfg.contador && (cfg.contador.nombre || cfg.contador.firma)) {
      const c = { nombre: String(cfg.contador.nombre || ""), rut: String(cfg.contador.rut || ""), firma: String(cfg.contador.firma || "") };
      await S.almacen.set("config/contador", c); S.contador = c;
    }
    S.restauracion = null; cambiarEmpresa(eid); ir("inicio");
    aviso(`${d.empresa.razon_social} restaurada: ${n} registros.`);
  } catch (err) {
    r.progreso = null; render();
    aviso(`La restauración se detuvo (${err?.code || err?.message || "error"}). Los datos de la empresa pueden haber quedado incompletos: vuelve a restaurar el mismo archivo.`);
  }
}

function panelRestauracion() {
  const r = S.restauracion;
  const previa = !r ? "" : r.error ? `<div class="aviso">${esc(r.error)}</div>` : `<div class="caja">
      <h2>Revisar restauración</h2>

function slug() { return (empresa()?.razon_social || "empresa").normalize("NFD").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase(); }

async function descargarCsv() {
  const csv = S.csv || (S.vista === "cuentas" ? datosCsvCuentas() : null);
  if (!csv || !S.descargas) return;
  const texto = "﻿" + csv.filas.map((f) => f.map((v) => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\r\n");
  try { await S.descargas.save({ filename: csv.archivo, data: texto }); aviso("CSV descargado."); }
  catch (e) { if (e?.code !== "declined") aviso("No se pudo descargar el archivo."); }
}

async function ocupado(fn, mensaje) {
  if (S.ocupado) return;
  S.ocupado = true;
  try { await fn(); }
  catch (e) {
    if (e?.code === "invalid_argument" && S.almacen.enLinea) { S.puedeEscribir = false; render(); aviso("No tienes permiso para modificar datos en este artefacto."); }
    else aviso(`${mensaje}${e?.code === "quota_exceeded" ? ": se llenó el espacio del artefacto." : ". Inténtalo de nuevo."}`);
  } finally { S.ocupado = false; }
}

  }, "No se pudo registrar el movimiento");

async function registrarPagoF29() {

const estilosPropios = () => { const l = recuerdo("estilos", []); return Array.isArray(l) ? l.filter((x) => x && typeof x.nombre === "string" && x.valores) : []; };
const mismoEstilo = (a, b) => Object.keys(APARIENCIA_BASE).every((k) => k === "acentoPersonal" && a.acento !== "personal" ? true : a[k] === b[k]);
function vistaApariencia() {
  const a = apariencia(), propios = estilosPropios(), b = (campo, valor, texto) => `<button type="button" data-ap="${campo}" data-v="${esc(valor)}" aria-pressed="${a[campo] === valor}">${esc(texto)}</button>`;
  const grupo = (campo, mapa, f = (v) => v) => `<div class="ap-grupo">${Object.entries(mapa).map(([k, v]) => b(campo, k, f(v))).join("")}</div>`;
  const activo = ESTILOS.find((e) => mismoEstilo(a, { ...APARIENCIA_BASE, ...e[3] }));
  const mini = (v) => { const t = TEMAS[v.tema && v.tema !== "sistema" ? v.tema : "light"], ac = v.acento === "personal" ? v.acentoPersonal : ACENTOS[v.acento || "verde"][1]; return `<span class="ap-mini"><span style="background:${t[1]}"></span><span style="background:${t[2]}"></span><span style="background:${ac}"></span></span>`; };
  return `${cabecera("Apariencia", "Se guarda en este navegador")}
  <p class="ayuda">Personaliza cómo se ve el sistema. Los cambios se aplican al instante y no afectan los datos ni los informes en PDF o Excel.</p>
  <section class="caja"><h2>Estilos predeterminados</h2>
    <div class="ap-tarjetas">${ESTILOS.map(([id, nombre, desc, v]) => `<button type="button" class="ap-tarjeta" data-estilo="${id}" aria-pressed="${activo?.[0] === id}">${mini({ ...APARIENCIA_BASE, ...v })}<strong>${esc(nombre)}</strong><small>${esc(desc)}</small></button>`).join("")}</div>
    ${propios.length ? `<h2>Mis estilos</h2><div class="ap-tarjetas">${propios.map((x, i) => `<div class="ap-tarjeta" style="cursor:default">${mini({ ...APARIENCIA_BASE, ...x.valores })}<strong>${esc(x.nombre)}</strong><span class="ap-grupo"><button type="button" data-mio="${i}">Aplicar</button><button type="button" data-mio-del="${i}">Eliminar</button></span></div>`).join("")}</div>` : ""}
    <form class="ap-grupo" data-form="ap-guardar"><input id="ap-nombre" maxlength="40" placeholder="Nombre para guardar el estilo actual" style="min-width:240px"><button type="submit">Guardar mi estilo</button><button type="button" data-ap-reset>Restablecer todo</button></form></section>
  <section class="caja"><h2>Tema</h2><div class="ap-grupo"><button type="button" class="ap-tema" data-ap="tema" data-v="sistema" aria-pressed="${a.tema === "sistema"}"><span class="ap-mini"><span style="background:#f3f6f5"></span><span style="background:#0e1412"></span></span>Del sistema</button>
    ${Object.entries(TEMAS).map(([k, t]) => `<button type="button" class="ap-tema" data-ap="tema" data-v="${k}" aria-pressed="${a.tema === k}"><span class="ap-mini"><span style="background:${t[1]}"></span><span style="background:${t[2]}"></span><span style="background:${t[3]}"></span></span>${t[0]}</button>`).join("")}</div>
    <p class="ayuda">«Del sistema» cambia solo entre claro y oscuro según tu dispositivo.</p></section>
  <section class="caja"><h2>Color de acento</h2><div class="ap-grupo">${Object.entries(ACENTOS).map(([k, [n, c]]) => `<button type="button" class="ap-color" data-ap="acento" data-v="${k}" title="${n}" aria-label="${n}" aria-pressed="${a.acento === k}" style="background:${c}"></button>`).join("")}
    <label class="ap-grupo" style="gap:6px">Personalizado <input type="color" class="ap-color-input" id="ap-color" value="${esc(/^#[0-9a-f]{6}$/i.test(a.acentoPersonal) ? a.acentoPersonal : "#1b6a55")}"></label></div></section>
  <section class="caja"><h2>Letra</h2><div class="ap-rejilla">
    <div><h3>Texto</h3>${grupo("fuente", FUENTES_UI, (v) => v[0])}</div>
    <div><h3>Números y cuentas</h3>${grupo("fuenteNum", FUENTES_NUM, (v) => v[0])}</div>
    <div><h3>Tamaño del texto: <span id="ap-texto-val">${a.texto} %</span></h3><input type="range" id="ap-texto" min="85" max="130" step="5" value="${a.texto}"></div></div></section>
  <section class="caja"><h2>Forma y espacio</h2><div class="ap-rejilla">
    <div><h3>Esquinas</h3>${grupo("radio", RADIOS, (v) => v[0])}</div>
    <div><h3>Densidad de las tablas</h3><div class="ap-grupo">${b("densidad", "compacta", "Compacta")}${b("densidad", "normal", "Normal")}${b("densidad", "amplia", "Amplia")}</div></div>
    <div><h3>Ancho del contenido</h3><div class="ap-grupo">${b("ancho", "completo", "Completo")}${b("ancho", "centrado", "Centrado")}${b("ancho", "estrecho", "Estrecho")}</div></div>
    <div><h3>Menú lateral</h3>${grupo("menu", MENUS)}</div>
    <div><h3>Bordes</h3><div class="ap-grupo">${b("bordes", "sutil", "Sutiles")}${b("bordes", "marcado", "Marcados")}</div></div>
    <div><h3>Sombras</h3><div class="ap-grupo">${b("sombras", "ninguna", "Sin sombra")}${b("sombras", "suave", "Suave")}${b("sombras", "media", "Media")}</div></div>
    <div><h3>Filas alternadas en tablas</h3><div class="ap-grupo">${b("cebra", "no", "No")}${b("cebra", "si", "Sí")}</div></div>
    <div><h3>Animaciones</h3><div class="ap-grupo">${b("movimiento", "normal", "Normales")}${b("movimiento", "reducido", "Reducidas")}</div></div></div></section>
  <section class="caja"><h2>Vista previa</h2>
    <div class="acciones"><button class="btn" type="button">Botón principal</button><button class="btn sec" type="button">Secundario</button><button class="btn peligro" type="button">Eliminar</button><span class="etiqueta">etiqueta</span><span class="etiqueta cerrado">cerrado</span></div>
    <div class="tabla"><table><thead><tr><th>Cuenta</th><th>Glosa</th><th class="num">Debe</th><th class="num">Haber</th></tr></thead><tbody>
      <tr><td class="cod">1.1.02</td><td>Banco · pago de cliente</td><td class="num">1.250.000</td><td class="num"></td></tr>
      <tr><td class="cod">1.1.04</td><td>Clientes</td><td class="num"></td><td class="num">1.250.000</td></tr>
      <tr><td class="cod">4.1.01</td><td>Ventas del mes</td><td class="num"></td><td class="num neg">-84.500</td></tr></tbody></table></div>
    <div class="aviso">Así se ven los avisos del sistema.</div></section>`;
}
aplicarApariencia();
document.addEventListener("DOMContentLoaded", aplicarApariencia);
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", aplicarApariencia); } catch (_) {}
document.addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.closest("#ap-rapido")) { const a = apariencia(), orden = ["sistema", "light", "dark"]; fijarApariencia({ tema: orden[(Math.max(orden.indexOf(a.tema), 0) + 1) % 3] }); return; }
  const e = t.closest("[data-estilo]"); if (e) { fijarApariencia(ESTILOS.find((x) => x[0] === e.dataset.estilo)[3], true); return; }
  const m = t.closest("[data-mio]"); if (m) { const x = estilosPropios()[+m.dataset.mio]; if (x) fijarApariencia(x.valores, true); return; }
  const d = t.closest("[data-mio-del]"); if (d) { recordar("estilos", estilosPropios().filter((_, i) => i !== +d.dataset.mioDel)); render(); return; }
  if (t.closest("[data-ap-reset]")) { recordar("apariencia", {}); aplicarApariencia(); render(); return; }
  const b = t.closest("button[data-ap]"); if (b) fijarApariencia({ [b.dataset.ap]: b.dataset.v });
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "cj-neto" || el.id === "cj-exento" || el.id === "cj-iva") { actualizarCalculoCaja(); return; }
  if (el.id === "ap-texto") { recordar("apariencia", { ...apariencia(), texto: +el.value }); aplicarApariencia(); $("#ap-texto-val").textContent = `${el.value} %`; }
  else if (el.id === "ap-color") { recordar("apariencia", { ...apariencia(), acento: "personal", acentoPersonal: el.value }); aplicarApariencia(); document.querySelectorAll('button[data-ap="acento"]').forEach((x) => x.setAttribute("aria-pressed", "false")); }
});
document.addEventListener("submit", (ev) => {
  if (ev.target.dataset?.form !== "ap-guardar") return;
  ev.preventDefault();
  const nombre = $("#ap-nombre").value.trim(); if (!nombre) return aviso("Escribe un nombre para el estilo.");
  recordar("estilos", [...estilosPropios().filter((x) => x.nombre !== nombre), { nombre, valores: apariencia() }]); render(); aviso("Estilo guardado.");
});

async function iniciar() {
  render();
  const [db, usuario, descargas] = await Promise.all([
    window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null, window.claude?.use?.("downloads") ?? null,
  ]).catch(() => [null, null, null]);
  S.almacen = db ? new AlmacenClaude(db) : new AlmacenMemoria();
  S.descargas = descargas;
  if (usuario) { try { const p = await usuario.can("data.write"); if (p === false) S.puedeEscribir = false; } catch (_) {} }
  S.almacen.onDoc("config/utm", (d) => {
    S.utm = d?.valores || {};
    if (["f29", "sueldos", "honorarios"].includes(S.vista) && !S.ocupado) render();
  }, () => {});
  S.almacen.onDoc("config/previsional", (d) => {
    S.prev = { uf: d?.uf || {}, parametros: d?.parametros || [], feriados: d?.feriados || [] };
    if (S.vista === "rrhh" && !S.ocupado && !S.trabEdit) render();
  }, () => {});
  S.almacen.onDoc("config/contador", (d) => {
    S.contador = { nombre: d?.nombre || "", rut: d?.rut || "", firma: d?.firma || "" };
    if (S.vista === "contador") render();
  }, () => {});
  let primera = true;
  BD.onEmpresas((empresas) => {
    S.empresas = empresas;
    if (!S.empresas.some((e) => e.id === S.eid)) {
      const siguiente = S.empresas[0]?.id || null;
      if (siguiente !== S.eid || primera) cambiarEmpresa(siguiente);
    } else if (primera) { const eid = S.eid; S.eid = null; cambiarEmpresa(eid); }
    primera = false;
    prepararCuentas();
    S.lista = S.lista.length ? numerar(S.lista) : S.lista;
    if (S.vista === "editor" || S.importacion?.progreso != null || S.restauracion?.progreso != null) { renderMenu(); return; }
    render();
  }, (e) => { aviso("No se pudo leer la lista de empresas. Recarga la página."); console.error(e); });
}
iniciar();
</script>
