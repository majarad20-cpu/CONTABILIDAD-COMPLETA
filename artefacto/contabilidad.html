async function guardarBoleta() {
  const periodo = periodoRemuneraciones(), be = S.boletaEdit || {};
  const d = { tipo: $("#bo-tipo").value, folio: $("#bo-folio").value.trim(), fecha: $("#bo-fecha").value, rut: $("#bo-rut").value.trim(), nombre: $("#bo-nombre").value.trim(),
    monto: $("#bo-monto").value, base: $("#bo-base").value, sin_retencion: $("#bo-sin").checked, glosa: $("#bo-glosa").value.trim() };
  S.boletaEdit = { ...be, ...d };
  if (!TIPOS_BOLETA[d.tipo]) return aviso("Indica si es una boleta de honorarios recibida o una de prestación de servicios de terceros.");
  if (!d.folio) return aviso("El folio es obligatorio.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.fecha)) return aviso("Ingresa una fecha válida.");
  if (!rutValido(d.rut)) return aviso("El RUT del prestador no es válido (revisa el dígito verificador).");
  if (!d.nombre) return aviso("Ingresa el nombre del prestador.");
  const monto = parseMonto(d.monto || "0");
  if (Number.isNaN(monto) || monto < 0) return aviso("Monto: ingresa un monto en pesos enteros, sin decimales.");
  if (monto <= 0) return aviso("Ingresa el monto de la boleta.");
  const rut = formatoRut(d.rut);
  if (be.id) { const actual = S.honorarios.find((b) => b.id === be.id); if (actual && contabilizado(actual)) return aviso("La boleta ya está contabilizada; elimina primero su asiento para modificarla."); }
  if (S.honorarios.some((b) => b.tipo === d.tipo && b.rut === rut && String(b.folio) === d.folio && b.id !== be.id)) return aviso(`Ya existe la boleta folio ${d.folio} del RUT ${rut}.`);
  const tasa = d.sin_retencion ? 0 : tasaRetencion(+d.fecha.slice(0, 4));
  const [bruto, retencion, liquido] = calcularBoleta(monto, d.base === "liquido" && tasa > 0, tasa);
  await ocupado(async () => {
    await S.almacen.set(`empresas/${S.eid}/honorarios/${be.id || "h" + nuevoId()}`, { periodo, tipo: d.tipo, folio: d.folio, fecha: d.fecha, rut, nombre: d.nombre, bruto, tasa, retencion, liquido, glosa: d.glosa, asiento: "" });
    S.boletaEdit = null; render(); aviso("Boleta guardada.");
  }, "No se pudo guardar la boleta");
}

function contabilizarRemuneraciones(tipo) {
  const periodo = periodoRemuneraciones();
  try {
    if (tipo === "sueldos") { const p = propuestaSueldos(periodo); abrirPropuesta(p.fecha, p.glosa, p.lineas, `Sueldo empresarial de ${nombrePeriodo(periodo)}: ${p.cantidad} liquidación(es).`, { sueldoIds: p.ids }); }
    else { const p = propuestaHonorarios(periodo); abrirPropuesta(p.fecha, p.glosa, p.lineas, `Honorarios de ${nombrePeriodo(periodo)}: ${p.cantidad} boleta(s).`, { honorarioIds: p.ids }); }
  } catch (e) { if (e instanceof ErrorRcv) aviso(e.message); else throw e; }
}
async function marcarContabilizados(coleccion, ids, asientoId) {
  const lista = coleccion === "sueldos" ? S.sueldos : S.honorarios;
  for (const id of ids) { const x = lista.find((y) => y.id === id); if (x && !contabilizado(x)) await S.almacen.set(`empresas/${S.eid}/${coleccion}/${id}`, { ...x, asiento: asientoId }); }
}
async function liberarRemuneraciones(asientoId) {
  for (const [coleccion, lista] of [["sueldos", S.sueldos], ["honorarios", S.honorarios]])
    for (const x of lista.filter((y) => y.asiento === asientoId)) await S.almacen.set(`empresas/${S.eid}/${coleccion}/${x.id}`, { ...x, asiento: "" });
}

/* ------------------------------------------------------------------ exportación: modelo de informe */
/* Cada informe se describe una vez (columnas y filas con un estilo) y se convierte a PDF o Excel,
   con el mismo formato del programa de escritorio. Estilos de fila: "" normal, seccion, glosa,
   subtotal, total, nota, destacado. */
const NOMBRE_PROGRAMA = "CONTABILIDAD COMPLETA";
const ARTICULO_100 = "Artículo 100 Código Tributario: Declaración jurada de que los datos corresponden a los registros contables de la empresa.";
const MESES_MAYUS = MESES.map((m) => m.toUpperCase());
const NEGRITA_FILA = new Set(["seccion", "glosa", "subtotal", "total", "destacado"]);
const NOMBRES_TIPO_INFORME = { ACTIVO: "Activo", PASIVO: "Pasivo", PATRIMONIO: "Patrimonio", INGRESO: "Ingreso (ganancia)", GASTO: "Gasto (pérdida)" };

const col = (titulo, ancho, tipo = "texto", negrita = false) => ({ titulo, ancho, tipo, negrita });
class Informe {
  constructor(titulo, subtitulo, columnas, nombre, opciones = {}) {
    Object.assign(this, { titulo, subtitulo, columnas, nombre, filas: [], grupos: [], horizontal: false, oficial: false, firmas: [], vacio: "", notas: [], recuadro: null }, opciones);
  }
  agregar(valores, opciones = {}) { this.filas.push({ valores, estilo: "", nivel: 0, abarca: null, derecha: false, bloque: false, ...opciones }); }
}
const periodoTexto = (desde, hasta) => `PERÍODO: ${fmtFecha(desde)} a ${fmtFecha(hasta)}`;
const pesosTexto = (v) => (v < 0 ? `-$${clp(-v)}` : `$${clp(v)}`);
const sinCeros = (v) => v || null;
const nombreSeguro = (t) => (t || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60) || "empresa";
const cuentaDe = (id) => S.porId.get(id) || { codigo: "?", nombre: "(cuenta eliminada)", tipo: "ACTIVO" };

function informeDiario(desde, hasta) {
  const inf = new Informe("LIBRO DIARIO", periodoTexto(desde, hasta),
    [col("Fecha", 11, "fecha"), col("As. N°", 7), col("Código", 10), col("Cuenta / Glosa / Detalle", 46), col("Debe", 15, "monto"), col("Haber", 15, "monto")],
    `libro_diario_${desde}_${hasta}`, { oficial: true });
  let mes = null, td = 0, th = 0;
  for (const a of S.lista.filter((x) => x.fecha >= desde && x.fecha <= hasta)) {
    if (a.fecha.slice(0, 7) !== mes) { mes = a.fecha.slice(0, 7); inf.agregar([`--- ${MESES_MAYUS[+mes.slice(5) - 1]} ${mes.slice(0, 4)} ---`], { estilo: "seccion", abarca: 0 }); }
    const marca = a.apertura ? " (APERTURA)" : a.cierre ? " (CIERRE)" : "";
    inf.agregar([a.fecha, String(a.numero), `GLOSA: ${a.glosa.toUpperCase()}${marca}`], { estilo: "glosa", abarca: 2 });
    for (const l of a.lineas) {
      const c = cuentaDe(l.cuenta);
      inf.agregar([null, null, c.codigo, c.nombre + (l.glosa ? ` · ${l.glosa}` : ""), sinCeros(l.debe), sinCeros(l.haber)], { nivel: l.haber ? 2 : 0 });
      td += l.debe || 0; th += l.haber || 0;
    }
    inf.agregar([null, null, null, "TOTAL ASIENTO:", a.lineas.reduce((s, l) => s + (l.debe || 0), 0), a.lineas.reduce((s, l) => s + (l.haber || 0), 0)], { estilo: "subtotal", derecha: true });
  }
  inf.agregar([null, null, null, "TOTAL GENERAL LIBRO DIARIO:", td, th], { estilo: "total", derecha: true });
  return inf;
}

function seccionMayor(inf, m) {
  const c = m.cuenta;
  inf.agregar([`CUENTA: ${c.codigo} - ${c.nombre}`], { estilo: "seccion", abarca: 0 });
  if (m.saldoInicial) inf.agregar([null, null, "SALDO ANTERIOR", null, null, m.saldoInicial], { estilo: "nota" });
  for (const x of m.movimientos) {
    if (x.reinicio) inf.agregar([x.fecha, null, `Apertura: el saldo anterior (${pesosTexto(x.anterior)}) se reinicia`, null, null, 0], { estilo: "nota" });
    else inf.agregar([x.asiento.fecha, String(x.asiento.numero), (x.glosa || "").toUpperCase(), sinCeros(x.debe), sinCeros(x.haber), x.saldo]);
  }
  const neto = c.tipo === "ACTIVO" || c.tipo === "GASTO" ? m.saldoFinal : -m.saldoFinal;
  const naturaleza = neto > 0 ? "SALDO DEUDOR" : neto < 0 ? "SALDO ACREEDOR" : "CUENTA SALDADA";
  inf.agregar([null, null, "TOTALES Y SALDO CUENTA:", m.td, m.th, [m.saldoFinal, naturaleza]], { estilo: "subtotal", derecha: true });
}
function informeMayor(cuentaId, desde, hasta) {
  const base = (nombre) => new Informe("LIBRO MAYOR", periodoTexto(desde, hasta),
    [col("Fecha", 11, "fecha"), col("As. N°", 7), col("Glosa / Descripción", 44), col("Debe", 14, "monto"), col("Haber", 14, "monto"), col("Saldo", 15, "monto", true)],
    nombre, { oficial: true, vacio: "-" });
  if (cuentaId) {
    const m = libroMayor(cuentaId, desde, hasta);
    const inf = base(`mayor_${m.cuenta.codigo}_${desde}_${hasta}`);
    seccionMayor(inf, m);
    return inf;
  }
  const inf = base(`libro_mayor_${desde}_${hasta}`);
  const mayores = cuentasConMovimiento(hasta).map((c) => libroMayor(c.id, desde, hasta)).filter((m) => m.movimientos.length || m.saldoInicial);
  for (const m of mayores) seccionMayor(inf, m);

      styles: { fillColor: AMARILLO, textColor: [0, 0, 0], cellPadding: { left: 10, right: 10, top: 6, bottom: 6 }, valign: "middle" },
      columnStyles: { 0: { cellWidth: anchoUtil * 0.68 }, 1: { cellWidth: anchoUtil * 0.32 } },
      didDrawCell: (d) => { if (d.row.index > 0 && d.column.index === 1) { doc.setDrawColor(...GRIS_GRILLA); doc.setLineWidth(0.5); doc.line(margen, d.cell.y, margen + anchoUtil, d.cell.y); } } });
    const t = doc.lastAutoTable;
    doc.setDrawColor(0, 0, 0); doc.setLineWidth(1.8); doc.rect(margen, y, anchoUtil, t.finalY - y);
    y = t.finalY;
  }
  for (const ls of notasLineas) { y += 0.3 * CM; doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...GRIS_TEXTO); doc.text(ls, margen, y + 7); y += ls.length * 9; }
  doc.setTextColor(0, 0, 0);
  if (inf.oficial) {
    y += 0.5 * CM;
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
    doc.text(doc.splitTextToSize(ARTICULO_100, anchoUtil), W - margen, y + 8, { align: "right" });
    y += 20 + 0.3 * CM;
    const anchoFirma = 6 * CM, x0 = (W - (anchoUtil - 1 * CM)) / 2, x2 = x0 + (anchoUtil - 1 * CM) - anchoFirma;
    const lineaY = y + 1.8 * CM;
    if (S.contador.firma) {
      try {
        const prop = doc.getImageProperties(S.contador.firma);
        let h = 1.5 * CM, w = (h * prop.width) / prop.height;
        if (w > 5 * CM) { w = 5 * CM; h = (w * prop.height) / prop.width; }
        doc.addImage(S.contador.firma, "PNG", x0 + (anchoFirma - w) / 2, lineaY - h - 2, w, h, "firma", "FAST");
      } catch (_) { /* firma ilegible: se omite la imagen */ }
    }
    doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.6);
    doc.line(x0, lineaY, x0 + anchoFirma, lineaY); doc.line(x2, lineaY, x2 + anchoFirma, lineaY);
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
    ["CONTADOR GENERAL", ...datosContador()].forEach((t, k) => doc.text(textoPdf(t), x0 + anchoFirma / 2, lineaY + 10 + k * 9.5, { align: "center" }));
    ["REPRESENTANTE LEGAL", ...datosRepresentante(e)].forEach((t, k) => doc.text(textoPdf(t), x2 + anchoFirma / 2, lineaY + 10 + k * 9.5, { align: "center" }));
  } else if (inf.firmas.length) {
    const k = inf.firmas.length, anchoFirma = Math.min(anchoUtil / k - 0.8 * CM, 5.5 * CM), hueco = (anchoUtil / k - anchoFirma) / 2;
    const lineaY = y + 0.8 * CM + 1.6 * CM;
    doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.6); doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
    inf.firmas.forEach((t, i) => { const x = margen + i * (anchoUtil / k) + hueco; doc.line(x, lineaY, x + anchoFirma, lineaY); doc.text(t, x + anchoFirma / 2, lineaY + 10, { align: "center" }); });
  }

  // Encabezado, pie, página y folio en todas las páginas
  const total = doc.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    const arriba = 1.2 * CM;
    doc.setTextColor(0, 0, 0); doc.setFont("helvetica", "bold"); doc.setFontSize(6.5);
    lineasEmpresa(e).forEach((t, k) => doc.text(doc.splitTextToSize(textoPdf(t), anchoUtil * 0.7)[0], margen, arriba + k * 0.28 * CM));
    doc.setFontSize(11); doc.text(textoPdf(inf.titulo), W / 2, arriba + 1.55 * CM, { align: "center" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.text(doc.splitTextToSize(textoPdf(inf.subtitulo), anchoUtil)[0], W / 2, arriba + 1.9 * CM, { align: "center" });
    doc.setDrawColor(...GRIS_GRILLA); doc.setLineWidth(0.5);
    doc.line(margen, arriba + 2.1 * CM, W - margen, arriba + 2.1 * CM);
    doc.line(margen, H - 1.35 * CM, W - margen, H - 1.35 * CM);
    doc.setFontSize(7); doc.text(NOMBRE_PROGRAMA, margen, H - 1.0 * CM);
    doc.text(`PÁGINA ${p} DE ${total}`, W - margen, H - 1.0 * CM, { align: "right" });
    if (folioInicial != null) { doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.text(`FOLIO: ${folioInicial + p - 1}`, W - margen, arriba, { align: "right" }); }
  }
  return { blob: doc.output("blob"), paginas: total };
}

/* Ancho y alto de una imagen PNG en data URL (cabecera IHDR), sin esperar a que el navegador la dibuje. */
function medidasPng(dataUrl) {
  const bytes = Uint8Array.from(atob(dataUrl.split(",")[1].slice(0, 64)), (c) => c.charCodeAt(0));
  const leer = (i) => ((bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | bytes[i + 3]) >>> 0;
  return { ancho: leer(16), alto: leer(20) };
}
async function aExcel(inf) {
  await cargarScript("exceljs");
  const wb = new window.ExcelJS.Workbook();
  const e = empresa();
  wb.title = inf.titulo; wb.creator = e.razon_social;
  const ws = wb.addWorksheet(inf.titulo.replace(/[[\]:*?/\\]/g, "").toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase()).slice(0, 31), { views: [{ showGridLines: false }] });
  const n = inf.columnas.length, principal = textoPrincipal(inf);
  const linea = { style: "thin", color: { argb: "FF9E9E9E" } }, negro = { style: "medium", color: { argb: "FF000000" } };
  const grilla = { top: linea, left: linea, bottom: linea, right: linea };
  const fondo = { type: "pattern", pattern: "solid", fgColor: { argb: "FFEEEEEE" } }, amarillo = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFF4CC" } };
  const formatoMonto = '"$"#,##0;[Red]-"$"#,##0';
  const unir = (f, c1, c2) => { if (c2 > c1) ws.mergeCells(f, c1, f, c2); };
  let fila = 0;
  for (const t of lineasEmpresa(e)) { fila++; const c = ws.getCell(fila, 1); c.value = t; c.font = { bold: true, size: 8 }; unir(fila, 1, n); }
  fila++; Object.assign(ws.getCell(fila, 1), { value: inf.titulo, font: { bold: true, size: 13 }, alignment: { horizontal: "center" } }); unir(fila, 1, n); ws.getRow(fila).height = 20;
  fila++; Object.assign(ws.getCell(fila, 1), { value: inf.subtitulo, font: { size: 9, color: { argb: "FF555555" } }, alignment: { horizontal: "center" } }); unir(fila, 1, n);
  fila += 2;
  const primeraEncabezado = fila;
  if (inf.grupos.length) {
    let c0 = 1;
    for (const [titulo, span] of inf.grupos) {
      for (let j = c0; j < c0 + span; j++) Object.assign(ws.getCell(fila, j), { fill: fondo, border: grilla });
      if (titulo) { Object.assign(ws.getCell(fila, c0), { value: titulo, font: { bold: true, size: 9 } }); if (span > 1) unir(fila, c0, c0 + span - 1); }
      c0 += span;
    }
    fila++;
  }
  inf.columnas.forEach((c, j) => {
    Object.assign(ws.getCell(fila, j + 1), { value: c.titulo, font: { bold: true, size: 9 }, fill: fondo, border: grilla, alignment: { vertical: "middle", wrapText: true } });
    ws.getColumn(j + 1).width = c.ancho;
  });
  if (inf.grupos.length) {
    let c0 = 1;
    for (const [titulo, span] of inf.grupos) {
      if (!titulo) { for (let j = c0; j < c0 + span; j++) { Object.assign(ws.getCell(fila - 1, j), { value: inf.columnas[j - 1].titulo, font: { bold: true, size: 9 }, alignment: { vertical: "middle" } }); ws.getCell(fila, j).value = null; ws.mergeCells(fila - 1, j, fila, j); } break; }
      c0 += span;
    }
  }
  ws.getRow(fila).height = 18;
  const filaTitulos = fila;
  ws.views = [{ state: "frozen", ySplit: fila, showGridLines: false }];

  for (const f of inf.filas) {
    fila++;
    const valores = [...f.valores, ...Array(Math.max(n - f.valores.length, 0)).fill(null)];
    for (let j = 1; j <= n; j++) {
      const c = inf.columnas[j - 1];
      let v = valores[j - 1], sub = null;
      if (Array.isArray(v)) [v, sub] = v;
      const dato = f.abarca === null || j - 1 < f.abarca;
      const celda = ws.getCell(fila, j);
      if (c.tipo === "fecha" && v && dato) { const [a, m, d] = v.split("-").map(Number); v = new Date(Date.UTC(a, m - 1, d)); }
      celda.value = v ?? (c.tipo === "monto" && inf.vacio && f.abarca === null ? inf.vacio : null);
      const negrita = NEGRITA_FILA.has(f.estilo) || c.negrita;
      celda.font = { bold: negrita, italic: f.estilo === "glosa" || f.estilo === "nota", size: 9, ...(f.estilo === "nota" ? { color: { argb: "FF555555" } } : {}) };
      celda.border = grilla;
      if (f.estilo === "seccion") celda.fill = fondo;
      if (f.estilo === "destacado") { celda.font = { bold: true, size: 12 }; celda.fill = amarillo; celda.border = { top: negro, left: negro, bottom: negro, right: negro }; }
      else if (f.estilo === "subtotal" || f.estilo === "total") celda.border = { left: linea, right: linea, top: negro, bottom: f.estilo === "total" ? negro : linea };
      if ((c.tipo === "monto" || c.tipo === "numero") && dato) {
        celda.numFmt = c.tipo === "monto" ? formatoMonto : "#,##0";
        celda.alignment = { horizontal: "right", vertical: "top" };
        if (sub) { const et = ws.getCell(fila, principal + 1); et.value = et.value ? `${et.value} (${sub})` : sub; }
      } else if (c.tipo === "fecha" && dato) { celda.numFmt = "DD/MM/YYYY"; celda.alignment = { horizontal: "left", vertical: "top" }; }
      else celda.alignment = { vertical: "top", wrapText: f.abarca === null, horizontal: f.derecha && j - 1 === principal ? "right" : "left", indent: j - 1 === principal && !f.derecha ? Math.min(f.nivel, 10) : 0 };
    }
    if (f.abarca !== null && f.abarca < n - 1) ws.mergeCells(fila, f.abarca + 1, fila, n);
  }
  (inf.recuadro || []).forEach(([texto, valor], k) => {
    fila += k === 0 ? 2 : 1;
    const tam = k === 0 ? 14 : 10;
    ws.getCell(fila, 1).value = texto;
    if (n > 2) ws.mergeCells(fila, 1, fila, n - 1);
    ws.getCell(fila, n).value = valor; ws.getCell(fila, n).numFmt = formatoMonto;
    for (let j = 1; j <= n; j++) Object.assign(ws.getCell(fila, j), { font: { bold: true, size: tam }, fill: amarillo,
      border: { top: negro, bottom: negro, ...(j === 1 ? { left: negro } : {}), ...(j === n ? { right: negro } : {}) }, alignment: { horizontal: j === n ? "right" : "left", vertical: "middle" } });
    ws.getRow(fila).height = k === 0 ? 26 : 18;
  });
  for (const nota of inf.notas) { fila += 2; Object.assign(ws.getCell(fila, 1), { value: nota, font: { italic: true, size: 8, color: { argb: "FF555555" } }, alignment: { wrapText: true, vertical: "top" } }); unir(fila, 1, n); ws.getRow(fila).height = 26; }
  const bloqueFirma = (c1, c2, renglones, f0) => {
    for (let j = c1; j <= c2; j++) ws.getCell(f0, j).border = { top: { style: "thin", color: { argb: "FF000000" } } };
    renglones.forEach((t, k) => { Object.assign(ws.getCell(f0 + k, c1), { value: t, font: { bold: true, size: 8 }, alignment: { horizontal: "center" } }); unir(f0 + k, c1, c2); });
  };
  const mitad = Math.max(Math.floor(n / 2), 1);
  if (inf.oficial) {
    fila += 2; Object.assign(ws.getCell(fila, 1), { value: ARTICULO_100, font: { bold: true, size: 8 } }); unir(fila, 1, n);
    fila += 5;
    if (S.contador.firma) {
      try {
        const { ancho, alto } = medidasPng(S.contador.firma);
        const id = wb.addImage({ base64: S.contador.firma, extension: "png" });
        ws.addImage(id, { tl: { col: 0, row: fila - 4 }, ext: { width: (ancho * 55) / alto, height: 55 } });
      } catch (_) { /* firma ilegible: se omite la imagen */ }
    }
    const renglones = ["CONTADOR GENERAL", ...datosContador()];
    bloqueFirma(1, Math.max(mitad - 1, 1), renglones, fila);
    bloqueFirma(Math.min(mitad + 1, n), n, ["REPRESENTANTE LEGAL", ...datosRepresentante(e)], fila);
    fila += renglones.length;
  } else if (inf.firmas.length) {
    fila += 4;
    const tramo = Math.max(Math.floor(n / inf.firmas.length), 1);
    inf.firmas.forEach((t, i) => { const ini = 1 + i * tramo; bloqueFirma(ini, Math.min(ini + Math.max(tramo - 2, 0), n), [t], fila); });
  }
  ws.pageSetup = { paperSize: 1, orientation: inf.horizontal ? "landscape" : "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    printTitlesRow: `${primeraEncabezado}:${filaTitulos}`, margins: { left: 0.5, right: 0.5, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } };
  ws.headerFooter = { oddFooter: `&L&7${NOMBRE_PROGRAMA}&R&7PÁGINA &P DE &N` };
  return new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* Informe de la pantalla actual (cada vista lo deja en S.informe). */
async function guardarArchivo(nombre, blob) {
  if (!S.descargas) throw new Error("La descarga de archivos no está disponible en esta vista.");
  try { await S.descargas.save({ filename: nombre, data: blob }); return true; }
  catch (err) { if (err?.code === "declined") return false; throw err; }
}
function nombreArchivo(inf, ext) { return `${nombreSeguro(empresa().razon_social)}_${inf.nombre}.${ext}`; }

async function exportar(formato) {
  if (!S.informe) return;
  const inf = S.informe();
  if (formato === "pdf" && inf.oficial) { S.folioPendiente = true; render(); $("#folio-inicial")?.select(); return; }
  await ocupado(async () => {
    aviso(formato === "pdf" ? "Generando PDF…" : "Generando Excel…");
    const blob = formato === "pdf" ? (await aPdf(inf)).blob : await aExcel(inf);
    if (await guardarArchivo(nombreArchivo(inf, formato === "pdf" ? "pdf" : "xlsx"), blob)) aviso(formato === "pdf" ? "PDF descargado." : "Excel descargado.");
  }, formato === "pdf" ? "No se pudo generar el PDF" : "No se pudo generar el Excel");
}

async function generarPdfConFolio() {
  const folio = Number($("#folio-inicial").value);
  if (!Number.isInteger(folio) || folio < 1) return aviso("Ingresa un número entero mayor o igual a 1.");
  const inf = S.informe();
  await ocupado(async () => {
    aviso("Generando PDF…");
    const { blob, paginas } = await aPdf(inf, folio);
    if (!(await guardarArchivo(nombreArchivo(inf, "pdf"), blob))) { aviso("Descarga cancelada: los folios no se usaron."); return; }
    const ultimo = folio + paginas - 1;
    if (ultimo > (empresa().ultimo_folio || 0)) await BD.setEmpresa(S.eid, { ...empresa(), ultimo_folio: ultimo });
    S.folioPendiente = false; render();
    aviso(`${paginas === 1 ? `PDF generado con el folio ${folio}.` : `PDF generado con los folios ${folio} al ${ultimo}.`} Próximo folio sugerido: ${Math.max(empresa().ultimo_folio || 0, ultimo) + 1}.`);
  }, "No se pudo generar el PDF");
}

function panelFolio() {

function slug() { return (empresa()?.razon_social || "empresa").normalize("NFD").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase(); }

async function descargarCsv() {
  const csv = S.csv || (S.vista === "cuentas" ? datosCsvCuentas() : null);
  if (!csv || !S.descargas) return;
  const texto = "﻿" + csv.filas.map((f) => f.map((v) => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\r\n");

async function ocupado(fn, mensaje) {
  if (S.ocupado) return;
  S.ocupado = true;
  try { await fn(); }
  catch (e) {
    if (e?.code === "invalid_argument" && S.almacen.enLinea) { S.puedeEscribir = false; render(); aviso("No tienes permiso para modificar datos en este artefacto."); }
    else aviso(`${mensaje}${e?.code === "quota_exceeded" ? ": se llenó el espacio del artefacto." : ". Inténtalo de nuevo."}`);
  } finally { S.ocupado = false; }
}

function cambiarEmpresa(id) {
  if (S.eid === id && S.desuscribirAsientos) return;
  S.eid = id; recordar("empresa", id);
  S.desuscribirAsientos?.(); S.desuscribirAsientos = null;
  S.desuscribirCambios?.(); S.desuscribirCambios = null; S.cambios = [];
  S.desuscribirRcv?.(); S.desuscribirRcv = null; S.rcv = []; S.rcvSel.clear(); S.docEdit = null;
  S.desuscribirF29?.(); S.desuscribirF29 = null; S.f29Borradores = []; S.f29 = null;
  S.desuscribirRem.forEach((f) => f?.()); S.desuscribirRem = []; S.socios = []; S.sueldos = []; S.honorarios = []; S.remPeriodo = null;
  S.periodosAnio = null; S.cierreAnio = null; S.apertura = null;
  S.lista = []; S.cargandoAsientos = !!id; S.periodo = null; S.filtros = { anio: null, mes: "", texto: "" }; S.mayorCuenta = "";
  prepararCuentas();
  if (!id) return;
  S.desuscribirCambios = S.almacen.onCol(`empresas/${id}/cambios`, (lista) => {
    if (id !== S.eid) return;
    S.cambios = lista.sort((a, b) => (a.fecha_hora < b.fecha_hora ? 1 : -1));
    if (S.vista === "periodos") render();
  }, () => {});
  S.desuscribirRem = ["socios", "sueldos", "honorarios"].map((col) => S.almacen.onCol(`empresas/${id}/${col}`, (lista) => {
    if (id !== S.eid) return;
    S[col] = lista;
    if (["sueldos", "honorarios", "f29"].includes(S.vista) && !S.ocupado) render();
  }, () => {}));
  S.desuscribirF29 = S.almacen.onCol(`empresas/${id}/f29`, (lista) => {
    if (id !== S.eid) return;
    S.f29Borradores = lista;
    if (S.vista === "f29" && !S.ocupado) render();
  }, () => {});
  S.desuscribirRcv = S.almacen.onCol(`empresas/${id}/rcv`, (lista) => {
    if (id !== S.eid) return;
    S.rcv = lista.map((d) => ({ ...d, tipo_doc: +d.tipo_doc }));
    if (S.vista === "rcv" && !S.ocupado && !S.docEdit) render();
  }, () => {});
  S.desuscribirAsientos = BD.onAsientos(id, (lista) => {
    if (id !== S.eid) return;
    S.lista = numerar(lista); S.cargandoAsientos = false;
    if (S.vista === "editor" && S.edit?.id) { const a = S.lista.find((x) => x.id === S.edit.id); if (a) S.edit.numero = a.numero; return; }
    if (S.vista === "editor" || (S.vista === "empresas" && S.importacion?.progreso != null)) return;
    render();
  }, (e) => { aviso("Se perdió la conexión con los datos. Recarga la página."); console.error(e); });
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-ir],[data-accion],[data-asiento],[data-cuenta],[data-empresa],[data-editar-doc],[data-nuevo-doc],[data-centralizar]");
  if (!t || t.disabled) return;
  if (t.dataset.ir) { ev.preventDefault(); ir(t.dataset.ir); return; }
  if (t.dataset.asiento) { abrirEditor(t.dataset.asiento); return; }
  if (t.dataset.cuenta) {
    if (!S.puedeEscribir) return;
    const c = S.porId.get(t.dataset.cuenta); S.cuentaEdit = { ...c }; render(); window.scrollTo(0, 0); return;
  }
  if (t.dataset.empresa) { cambiarEmpresa(t.dataset.empresa); ir("inicio"); return; }
  if (t.dataset.editarDoc) { abrirDoc(t.dataset.editarDoc); return; }
  if (t.dataset.nuevoDoc) { abrirDoc(null, t.dataset.nuevoDoc); return; }
  if (t.dataset.centralizar) { centralizar(t.dataset.centralizar); return; }
  const accion = t.dataset.accion;
  const ed = S.edit;
  switch (accion) {
    case "agregar-linea": ed.lineas.push(lineaVacia()); render(); $(`#l-${ed.lineas.length - 1}-cuenta`)?.focus(); break;
    case "quitar-linea": ed.lineas.splice(+t.dataset.linea, 1); render(); break;
    case "pedir-eliminar-asiento": S.confirmar = "asiento"; render(); break;
    case "pedir-eliminar-empresa": S.confirmar = "empresa"; render(); break;
    case "cancelar-confirmacion": S.confirmar = null; render(); break;
    case "eliminar-asiento": ocupado(async () => {
      const n = ed.numero;
      await BD.deleteAsiento(S.eid, ed.id);
      await liberarDocumentos(ed.id);
      await liberarRemuneraciones(ed.id);
      if (mesCerrado(ed.fechaOriginal)) await registrarCambio("Eliminación", describirAsiento(n, ed.fechaOriginal, ed.glosaOriginal), [ed.fechaOriginal.slice(0, 7)], ed.motivo);
      S.edit = null; ir("asientos"); aviso(`Asiento N° ${n} eliminado.`);
    }, "No se pudo eliminar el asiento"); break;
    case "confirmar-guardar": guardarAsiento(true); break;
    case "cerrar-mes": cambiarMes(t.dataset.periodo, true); break;
    case "pedir-reabrir": S.confirmar = "reabrir:" + t.dataset.periodo; render(); break;
    case "reabrir-mes": cambiarMes(t.dataset.periodo, false); break;
    case "cerrar-hasta": cerrarHasta(); break;
    case "pedir-cierre": S.confirmar = "cierre"; render(); break;
    case "cerrar-ejercicio": cerrarEjercicio(); break;
    case "ver-propuesta-apertura": verPropuestaApertura(); break;
    case "pedir-quitar-firma": S.confirmar = "firma"; render(); break;
    case "quitar-firma": guardarContador(""); break;
    case "cerrar-doc": S.docEdit = null; S.confirmar = null; render(); break;
    case "pedir-eliminar-doc": leerFormularioDoc(); S.confirmar = "doc"; render(); break;
    case "eliminar-doc": eliminarDocs([S.docEdit.id]); break;
    case "pedir-eliminar-marcados": S.confirmar = "docs"; render(); break;
    case "eliminar-marcados": eliminarDocs([...S.rcvSel]); break;
    case "guardar-f29": guardarF29(); break;
    case "pdf": exportar("pdf"); break;
    case "excel": exportar("excel"); break;
    case "cancelar-folio": S.folioPendiente = false; render(); break;
    case "pdf-asiento": { const a = S.lista.find((x) => x.id === ed.id); if (a) { S.informe = () => informeComprobante(a); exportar("pdf"); } break; }
    case "nuevo-socio": S.socioEdit = { id: null, nombre: "", rut: "", sueldo_bruto: 0 }; render(); $("#so-nombre")?.focus(); break;
    case "editar-socio": S.socioEdit = { ...socioPorId(t.dataset.id) }; render(); break;
    case "cancelar-socio": S.socioEdit = null; render(); break;
    case "pedir-eliminar-socio": S.confirmar = "socio:" + t.dataset.id; render(); break;
    case "eliminar-socio": eliminarSocio(t.dataset.id); break;
    case "liquidar": liquidar(); break;
    case "eliminar-liquidacion": ocupado(async () => { await S.almacen.del(`empresas/${S.eid}/sueldos/${t.dataset.id}`); render(); aviso("Liquidación eliminada."); }, "No se pudo eliminar la liquidación"); break;
    case "contabilizar-sueldos": contabilizarRemuneraciones("sueldos"); break;
    case "contabilizar-honorarios": contabilizarRemuneraciones("honorarios"); break;
    case "editar-boleta": { const b = S.honorarios.find((x) => x.id === t.dataset.id); S.boletaEdit = { ...b, monto: clp(b.bruto), base: "bruto", sin_retencion: !b.tasa }; render(); window.scrollTo(0, 0); break; }
    case "cancelar-boleta": S.boletaEdit = null; render(); break;
    case "pedir-eliminar-boleta": S.confirmar = "boleta:" + t.dataset.id; render(); break;
    case "eliminar-boleta": ocupado(async () => { await S.almacen.del(`empresas/${S.eid}/honorarios/${t.dataset.id}`); S.confirmar = null; render(); aviso("Boleta eliminada."); }, "No se pudo eliminar la boleta"); break;
    case "f29-del-mes": parametrosF29().periodo = S.rcvPeriodo; S.f29.manual = null; ir("f29"); break;
    case "eliminar-empresa": eliminarEmpresa(); break;
    case "nueva-cuenta": S.cuentaEdit = { id: null, codigo: "", nombre: "", imputable: true, activa: true }; render(); $("#c-codigo")?.focus(); break;
    case "cancelar-cuenta": S.cuentaEdit = null; render(); break;
    case "eliminar-cuenta": eliminarCuenta(); break;
    case "confirmar-importacion": importar(); break;
    case "cancelar-importacion": S.importacion = null; render(); break;
    case "csv": descargarCsv(); break;
  }
});

document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("form[data-form]");
  if (!f) return;
  ev.preventDefault();
  switch (f.dataset.form) {
    case "periodo": {
      const p = periodo();
      const desde = $("#p-desde")?.value || p.desde, hasta = $("#p-hasta").value;
      if (!hasta || desde > hasta) { aviso("Revisa el período: la fecha inicial debe ser anterior a la final."); return; }
      p.desde = desde; p.hasta = hasta;
      if ($("#p-cuenta")) S.mayorCuenta = $("#p-cuenta").value;
      render(); break;
    }
    case "filtros": S.filtros = { anio: $("#f-anio").value, mes: $("#f-mes").value, texto: $("#f-texto").value }; render(); break;
    case "asiento": guardarAsiento(); break;
    case "cuenta": guardarCuenta(); break;
    case "empresa": guardarEmpresa(); break;
    case "nueva-empresa": crearEmpresa(); break;
    case "contador": guardarContador(); break;
    case "documento": guardarDocumento(); break;
    case "resumen": agregarResumenManual(); break;
    case "tributarias": guardarTributarias(); break;
    case "f29": if (leerEntradasF29()) render(); break;
    case "socio": guardarSocio(); break;
    case "folio": generarPdfConFolio(); break;
    case "boleta": guardarBoleta(); break;
  }
});

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (S.vista === "editor" && S.edit) {
    if (el.id === "a-fecha") S.edit.fecha = el.value;
    else if (el.id === "a-glosa") S.edit.glosa = el.value;
    else if (el.id === "a-apertura") S.edit.apertura = el.checked;
    else if (el.id === "a-motivo") { S.edit.motivo = el.value; return; }
    else if (el.dataset.linea != null && el.dataset.campo) {
      const l = S.edit.lineas[+el.dataset.linea];
      if (el.value.trim() === "=" && (el.dataset.campo === "debe" || el.dataset.campo === "haber")) {
        l[el.dataset.campo] = "";
        const { d, h } = totalesEdicion();
        const dif = el.dataset.campo === "debe" ? h - d : d - h;
        el.value = dif > 0 ? clp(dif) : "";
      }
      l[el.dataset.campo] = el.value;
      if (el.dataset.campo === "texto") { l.cuenta = cuentaDesdeTexto(el.value); el.classList.toggle("malo", !!el.value.trim() && !l.cuenta); }
    }
    actualizarCuadre();
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "a-apertura" && S.edit) S.edit.apertura = ev.target.checked;
  if (ev.target.id === "sel-empresa") { cambiarEmpresa(ev.target.value); ir(S.vista === "editor" ? "asientos" : S.vista); }
  if (ev.target.id === "archivo-json" && ev.target.files[0]) leerArchivo(ev.target.files[0]);
  if (ev.target.id === "p-cuenta") { S.mayorCuenta = ev.target.value; render(); }
  if (ev.target.id === "per-anio") { S.periodosAnio = ev.target.value; S.confirmar = null; render(); }
  if (ev.target.id === "ci-anio") { S.cierreAnio = ev.target.value; S.confirmar = null; render(); }
  if (["ap-anio", "ap-fecha", "ap-utilidad", "ap-perdida"].includes(ev.target.id)) { leerParametrosApertura(ev.target.id === "ap-anio"); render(); }
  if (ev.target.id === "co-firma" && ev.target.files[0]) cargarFirma(ev.target.files[0]);
  if (ev.target.id === "rcv-periodo" && /^\d{4}-\d{2}$/.test(ev.target.value)) { S.rcvPeriodo = ev.target.value; S.rcvSel.clear(); S.docEdit = null; S.rcvMensajes = null; render(); }
  if (ev.target.id === "rcv-archivos" && ev.target.files.length) importarArchivosRcv([...ev.target.files]);
  if (ev.target.dataset.cuentaDoc) cambiarCuentaDoc(ev.target.dataset.cuentaDoc, ev.target.value);
  if (ev.target.dataset.selDoc) { if (ev.target.checked) S.rcvSel.add(ev.target.dataset.selDoc); else S.rcvSel.delete(ev.target.dataset.selDoc); S.confirmar = null; render(); }
  if (ev.target.id === "doc-tipo_doc") { leerFormularioDoc(); render(); }
  if (ev.target.id === "rem-periodo" && /^\d{4}-\d{2}$/.test(ev.target.value)) { S.remPeriodo = ev.target.value; S.boletaEdit = null; S.socioEdit = null; render(); }
  if (ev.target.id === "f29-periodo" && /^\d{4}-\d{2}$/.test(ev.target.value)) { const p = parametrosF29(); p.periodo = ev.target.value; p.manual = null; render(); }
});
document.addEventListener("input", (ev) => {
  if (!S.docEdit || !ev.target.classList.contains("monto-doc")) return;
  const total = [...document.querySelectorAll("#form-documento .monto-doc")].reduce((s, el) => s + (parseMonto(el.value) || 0), 0);
  $("#doc-total").textContent = clp(total);
});
document.addEventListener("focusout", (ev) => {
  const el = ev.target;
  if (el.classList?.contains("monto-doc") && el.value.trim() && !Number.isNaN(parseMonto(el.value))) el.value = clp(parseMonto(el.value)) || "";
  if (S.vista === "editor" && S.edit && (el.dataset.campo === "debe" || el.dataset.campo === "haber")) {
    const v = parseMonto(el.value);
    if (el.value && !Number.isNaN(v)) { el.value = v ? clp(v) : ""; S.edit.lineas[+el.dataset.linea][el.dataset.campo] = el.value; }
  }
});

/* ------------------------------------------------------------------ inicio */
async function iniciar() {
  render();
  const [db, usuario, descargas] = await Promise.all([
    window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null, window.claude?.use?.("downloads") ?? null,
  ]).catch(() => [null, null, null]);
  S.almacen = db ? new AlmacenClaude(db) : new AlmacenMemoria();
  S.descargas = descargas;
  if (usuario) { try { const p = await usuario.can("data.write"); if (p === false) S.puedeEscribir = false; } catch (_) {} }
  S.almacen.onDoc("config/utm", (d) => {
    S.utm = d?.valores || {};
    if (["f29", "sueldos", "honorarios"].includes(S.vista) && !S.ocupado) render();
  }, () => {});
  S.almacen.onDoc("config/contador", (d) => {
    S.contador = { nombre: d?.nombre || "", rut: d?.rut || "", firma: d?.firma || "" };
    if (S.vista === "contador") render();
  }, () => {});
  let primera = true;
  BD.onEmpresas((empresas) => {
    S.empresas = empresas;
    if (!S.empresas.some((e) => e.id === S.eid)) {
      const siguiente = S.empresas[0]?.id || null;
      if (siguiente !== S.eid || primera) cambiarEmpresa(siguiente);
    } else if (primera) { const eid = S.eid; S.eid = null; cambiarEmpresa(eid); }
    primera = false;
    prepararCuentas();
    S.lista = S.lista.length ? numerar(S.lista) : S.lista;
    if (S.vista === "editor" || S.importacion?.progreso != null) { renderMenu(); return; }
    render();
  }, (e) => { aviso("No se pudo leer la lista de empresas. Recarga la página."); console.error(e); });
}
iniciar();
</script>
